encodings:
  - id: water_w
    worksheet: ОГХ
    selector: {column: D, value: W}
    status: blocked
    interpretation: Gravimetric water content; the workbook label permits either percent or fraction.
    measurement:
      quantity: gravimetric_water_content
      unit: null
      denominator_basis: dry_soil_mass
    blockers: [water_scale_by_source]
  - id: water_q
    worksheet: ОГХ
    selector: {column: D, value: Q}
    status: blocked
    interpretation: Volumetric water content; the workbook label permits either percent or fraction.
    measurement:
      quantity: volumetric_water_content
      unit: null
      denominator_basis: bulk_volume
    blockers: [water_scale_by_source]
  - id: water_unknown
    worksheet: ОГХ
    selector: {column: D, value: "?"}
    status: blocked
    interpretation: Water-content quantity, denominator basis, and scale are unknown.
    blockers: [unknown_water_basis]
  - id: fitted_vgn
    worksheet: ОГХ
    selector: {column: D, value: VGN}
    status: confirmed
    interpretation: Fitted VGN parameters Qr, Qs, n, and a; never an observed retention point.
  - id: pressure_pf
    worksheet: ОГХ
    selector: {column: E, value: pF}
    status: proposed
    interpretation: Base-10 logarithm of matric-potential head magnitude in centimeters of water.
    measurement: {quantity: matric_potential, unit: kilopascal}
    conversion: centimeter_water_head = 10 ** value; then use the ptfkit unit registry.
    blockers: [pressure_convention_by_source]
  - id: pressure_kpa
    worksheet: ОГХ
    selector: {column: E, value: kPa}
    status: blocked
    interpretation: Pressure values labelled kPa; sign convention is not stated.
    measurement: {quantity: matric_potential, unit: kilopascal}
    blockers: [pressure_convention_by_source]
  - id: pressure_mpa_label
    worksheet: ОГХ
    selector: {column: E, value: mPa}
    status: blocked
    interpretation: The exact case-sensitive label is mPa; its intended unit is unresolved.
    blockers: [mpa_label_meaning]
  - id: pressure_pgk
    worksheet: ОГХ
    selector: {column: E, value: ПГК}
    status: blocked
    interpretation: The abbreviation is not mapped to a physical pressure quantity or unit.
    blockers: [pressure_pgk_meaning]
  - id: pressure_over_salts
    worksheet: ОГХ
    selector: {column: E, value: давление над солями}
    status: blocked
    interpretation: Salt-equilibrium condition is not yet mapped to matric or osmotic potential.
    blockers: [pressure_over_salts_meaning]

formula_policy:
  read_formulas: true
  read_cached_values: true
  recalculate: false
  derived_columns:
    - {worksheet: Данные, column: A, purpose: Composite sample identifier, validation: Recompute from C and B and require exact equality with the cached value.}
    - {worksheet: ОГХ, column: A, purpose: Composite sample identifier, validation: Recompute from B and C and require exact equality with the cached value.}
    - {worksheet: ОГХ, column: C, purpose: Repeated sample number, validation: Retain expression and cached value and verify against its referenced source row.}
    - {worksheet: ГС-PSD, column: A, purpose: Composite sample identifier, validation: Recompute from B and C and require exact equality with the cached value.}
    - {worksheet: дп, column: A, purpose: Composite sample identifier, validation: Recompute from C and B and require exact equality with the cached value.}
    - {worksheet: ч, column: A, purpose: Composite sample identifier, validation: Recompute from C and B and require exact equality with the cached value.}
    - {worksheet: сл, column: A, purpose: Composite sample identifier, validation: Recompute from C and B and require exact equality with the cached value.}
    - {worksheet: диссертации, column: A, purpose: Composite sample identifier, validation: Recompute from C and B and require exact equality with the cached value.}

reviewed_corrections: []

quarantines:
  - id: control_rows
    scope: Данные, дп, ч, сл, and диссертации rows with sample_number = 0.1
    reason: These rows carry source-specific column labels and are not soil samples.
    release_requires: Never release as samples; consume only through an implemented control-row parser.
  - id: unknown_water_rows
    scope: ОГХ rows where D = ? (637 rows in the reviewed workbook bytes)
    reason: Water-content quantity, denominator basis, and scale are unknown.
    release_requires: Source-level documentation of quantity and unit.
  - id: fitted_parameter_rows
    scope: ОГХ rows where D = VGN (92 rows)
    reason: These are fitted model parameters rather than measured water-retention observations.
    release_requires: Import into a separate fitted-parameters table, never the observation table.
  - id: ambiguous_pressure_rows
    scope: ОГХ rows labelled mPa, ПГК, or давление над солями
    reason: Pressure quantity, unit, or experimental interpretation is unresolved.
    release_requires: Source-level review and an explicit conversion rule.
  - id: unheaded_psd_rows
    scope: ГС-PSD rows 59:68
    reason: The structural inventory found no preceding header block for these rows.
    release_requires: Establish their interval scheme and relationship to the preceding blocks.
  - id: proposed_identity_aliases
    scope: All sample joins requiring a proposed source alias
    reason: Case-only similarity is evidence, not proof of sample identity.
    release_requires: Human review of each source alias and duplicate-key resolution.

blockers:
  - id: source_alias_review
    scope: identity.source_aliases
    question: Do the 14 case-only source-label pairs denote the same publications and sample-number namespaces?
    evidence: Case folding increases the Данные-to-ОГХ sample-id overlap from 80 to 171, adding 91 sample identifiers.
  - id: duplicate_master_sample_ids
    scope: Данные sample rows
    question: Which repeated rows are duplicate views, repeated measurements, or distinct samples sharing a weak identifier?
    evidence: Excluding 49 control rows leaves 665 rows but only 507 distinct cached sample_id values (158 excess occurrences).
  - id: water_scale_by_source
    scope: ОГХ D in [W, Q]
    question: For every source, are water values fractions or percentages?
    evidence: W ranges from 0.008 to 82.98 and Q from 0.0420339 to 78.2, so the code alone does not determine scale.
  - id: unknown_water_basis
    scope: ОГХ D = ?
    question: Are these 637 values gravimetric or volumetric, and are they fractions or percentages?
    evidence: The workbook explicitly stores a question mark instead of a water-content encoding.
  - id: pressure_convention_by_source
    scope: ОГХ E in [pF, kPa]
    question: Does every source report positive suction magnitude, and are pF values consistently log10(cm water head)?
    evidence: Labels provide representation but do not encode sign convention or source-specific methodological exceptions.
  - id: mpa_label_meaning
    scope: ОГХ E = mPa (10 rows, source 1992_Гуматов)
    question: Does mPa mean MPa, millipascal, or a source-specific notation?
    evidence: Unit symbols are case-sensitive and mPa is not equivalent to MPa.
  - id: pressure_pgk_meaning
    scope: ОГХ E = ПГК (60 rows)
    question: What physical condition, quantity, and unit does ПГК denote?
    evidence: The abbreviation appears for two sources without a unit definition in the workbook.
  - id: pressure_over_salts_meaning
    scope: ОГХ E = давление над солями (30 rows)
    question: How should salt-equilibrium observations be represented without conflating matric and osmotic potential?
    evidence: The label describes a method or condition rather than a registered ptfkit pressure unit.
  - id: density_units
    scope: Данные Q and V; диссертации T and corresponding duplicate views
    question: What units, dry-mass convention, and sample-volume basis apply to bulk and particle density?
    evidence: The headers name density quantities but contain no units or basis.
  - id: organic_property_provenance
    scope: Organic carbon and humus columns
    question: Which values are measured, which are converted, and what source-specific conversion factors were used?
    evidence: Both organic carbon and humus are present, including formula-derived cells, without transformation provenance.
  - id: particle_size_schemes
    scope: Данные M:P, ГС-PSD blocks, and wide dynamic sections
    question: What mass basis, analytical method, unit scale, and boundary convention applies to every interval scheme?
    evidence: ГС-PSD contains six detected header layouts, aggregate columns, and an unheaded final block.
  - id: duplicate_views
    scope: Данные, дп, ч, сл, and диссертации
    question: Which cells are authoritative when duplicate source views disagree?
    evidence: The workbook contains overlapping wide tables with similar identifiers but shifted layouts and independent formulas.
  - id: non_identity_formulas
    scope: Formula cells outside identifier and ОГХ sample-number columns
    question: What transformations produced the 19 remaining formula cells, and are they predictors, targets, or corrections?
    evidence: The inventory records 4235 cached formulas; 4216 are in known identifier or repeated-number columns.
  - id: saturated_conductivity_units
    scope: Wide source-specific sections
    question: Where is saturated hydraulic conductivity stored, and what unit and logarithm convention applies per source?
    evidence: No stable row-1 column mapping identifies conductivity across the grouped wide layout.
  - id: retention_reconstruction
    scope: Данные wide retention sections and ОГХ
    question: Does code reconstruction from source-control rows reproduce every long-form observation and fitted parameter exactly?
    evidence: ОГХ has 1847 populated data rows and formula-derived identifiers, while Данные uses inherited wide headers.
  - id: coordinate_publication_policy
    scope: Coordinate columns and source workbook distribution
    question: May coordinates and the workbook itself be redistributed or included in evaluation artifacts?
    evidence: Rights, attribution, and coordinate-publication policy have not been recorded.
