classification_system: USDA-NRCS fine-earth texture classes
source:
  organization: USDA Natural Resources Conservation Service
  title: Soil Texture Calculator
  artifact: USDA_Soil_Texture_Calculator.xlsm
  retrieved: 2026-08-21
  url: https://www.nrcs.usda.gov/sites/default/files/2022-11/USDA_Soil_Texture_Calculator.xlsm
  sha256: f81aedb7525709be04b3dbb4989a2d5204dd5a56e53d6c4f5f68e4ba9a9ce8ab
  value_rule: Values are the workbook's representative values for the 12 basic texture classes, without normalization or substitution.
units: percent by mass of fine earth
sum_tolerance: 1.0e-12
classes:
  - {name: sand, sand: 90, silt: 5, clay: 5}
  - {name: loamy sand, sand: 79, silt: 14, clay: 7}
  - {name: sandy loam, sand: 65, silt: 25, clay: 10}
  - {name: loam, sand: 41, silt: 42, clay: 17}
  - {name: silt loam, sand: 22, silt: 65, clay: 13}
  - {name: silt, sand: 7, silt: 87, clay: 6}
  - {name: sandy clay loam, sand: 61, silt: 12, clay: 27}
  - {name: clay loam, sand: 33, silt: 34, clay: 33}
  - {name: silty clay loam, sand: 11, silt: 56, clay: 33}
  - {name: sandy clay, sand: 50, silt: 5, clay: 45}
  - {name: silty clay, sand: 5, silt: 45, clay: 50}
  - {name: clay, sand: 17, silt: 13, clay: 70}
notes:
  - Representative values are deterministic estimates for a class, not measured particle-size fractions.
warnings:
  - Compatibility with a PTF depends on its particle-size definitions and must not be inferred from input names.
