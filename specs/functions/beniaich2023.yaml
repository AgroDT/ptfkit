scientific_notes: |
  # Beniaich et al. (2023)

  ## Review decisions

  `Clay`, `Silt`, `Sand`, and `SOM` are mass percentages. The published linear
  regressions return gravimetric percentage points, which are divided by 100 for
  the public `g/g` outputs.

  ## Blockers

  The publication does not provide fitted regression-tree splits or terminal
  values, Cubist rules or linear models, or random-forest trees, training data,
  and random seed. The corresponding functions remain blocked.
