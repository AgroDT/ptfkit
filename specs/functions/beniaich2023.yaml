source:
  summary: Beniaich et al. (2023), soil-water PTFs for four Moroccan regions.
  citation_apa: 'Beniaich, A., Otten, W., Shin, H.-C., Cooper, H. V., Rickson, J.,
    Soulaimani, A., & El Gharous, M. (2023). Evaluation of pedotransfer functions
    to estimate some of soil hydraulic characteristics in North Africa: A case study
    from Morocco. Frontiers in Environmental Science, 11, 1090688.'
  doi:
    identifier: 10.3389/fenvs.2023.1090688
    url: https://doi.org/10.3389/fenvs.2023.1090688
scope:
  territory: Agricultural topsoils in Doukkala, Gharb-Loukouss, Moulouya, and Tadla,
    Morocco
  dataset: 331 disturbed topsoil samples collected at 0-20 cm from 2019 to 2022; random
    50% calibration and 50% validation subsets.
$defs:
  clay:
    name: clay
    symbol: Clay
    unit: '%'
    domain: 0 <= value <= 100
    description: Clay content by mass.
  silt:
    name: silt
    symbol: Silt
    unit: '%'
    domain: 0 <= value <= 100
    description: Silt content by mass.
  sand:
    name: sand
    symbol: Sand
    unit: '%'
    domain: 0 <= value <= 100
    description: Sand content by mass.
  silt_nonzero:
    name: silt
    symbol: Silt
    unit: '%'
    domain: 0 < value <= 100
    description: Silt content by mass and denominator of the clay-to-silt ratio.
  soil_organic_matter:
    name: soil_organic_matter
    symbol: SOM
    unit: '%'
    domain: value >= 0
    description: Soil organic matter content by mass.
  Beniaich2023PTFResult:
    type: record
    name: Beniaich2023PTFResult
    fields:
    - name: water_saturation
      symbol: w_0
      unit: g/g
      domain: null
      description: Gravimetric water content at saturation.
    - name: water_field_capacity
      symbol: w_330
      unit: g/g
      domain: null
      description: Gravimetric water content at -33 kPa.
    - name: water_wilting_point
      symbol: w_15000
      unit: g/g
      domain: null
      description: Gravimetric water content at -1,500 kPa.
functions:
- name: calc_ptf_beniaich2023_slr1
  status: implemented
  public_api:
    name: calc_ptf_beniaich2023_slr1
    summary: Estimate three gravimetric water contents from clay.
  scope:
    prediction_target: Gravimetric water content at saturation, -33 kPa, and -1,500
      kPa.
    models:
      h_theta: Three point estimates
      k_h: null
  inputs:
  - $ref: "#/$defs/clay"
  outputs:
    $ref: "#/$defs/Beniaich2023PTFResult"
  implementation:
    variables:
    - name: water_saturation
      expr: (46.307 + 0.556 * clay) / 100
    - name: water_field_capacity
      expr: (10.277 + 0.365 * clay) / 100
    - name: water_wilting_point
      expr: (3.081 + 0.327 * clay) / 100
  golden_tests:
  - id: representative_case
    inputs:
      clay: 20.0
    expected:
      water_saturation: 0.57427
      water_field_capacity: 0.17577
      water_wilting_point: 0.09621
    rtol: 1.0e-12
    atol: 1.0e-12
    notes: Calculated from Table 5 and divided by 100.
  edge_cases: []
  documentation:
    notes:
    - Source regressions operate in percentage points; outputs are divided by 100
      to return g/g.
    warnings:
    - Developed from Moroccan agricultural topsoils and not independently validated
      outside the source territory.
