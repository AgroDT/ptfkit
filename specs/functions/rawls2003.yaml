      - {name: clay, symbol: clay, unit: "% mass", domain: "0.0 < value < 90", description: Clay content by mass.}
      - {name: sand, symbol: sand, unit: "% mass", domain: "0.7 < value < 95", description: "Sand content by mass; clay plus sand must not exceed 100."}
    outputs:
      type: scalar
      name: theta_1500
      quantity: volumetric_water_content
      symbol: theta_1500
      unit: volume_fraction
      reported_unit: "cm³/cm³"
      domain: null
      description: Volumetric soil water content at -1500 kPa.
    verification_cases:
      - id: calculated_diagnostic_probe
        kind: calculated
        inputs: {soil_organic_carbon: 1.0, clay: 20.0, sand: 60.0}
        expected: {theta_1500: 0.12978036954714565}
        source_location: "Section 3.2 equation; evidence-bundle direct evaluation"
        rationale: >-
          The input is interior to every source range, clay plus sand is 80%,
          and direct decimal evaluation confirms the fixed value. This is an
          implementation probe, not an observation or evidence of accuracy.
    edge_cases: []
    documentation:
      notes:
        - The polynomial calculates volume percent; the public output divides the result by 100.
      warnings:
        - Apply only within the source ranges and with clay plus sand no greater than 100%.
    implementation:
      variables:
        - {name: x, expr: "-0.837531 + 0.430183 * soil_organic_carbon"}
        - {name: y, expr: "-1.40744 + 0.0661969 * clay"}
        - {name: z, expr: "-1.51866 + 0.0393284 * sand"}
        - {name: x_squared, expr: "x ^ 2"}
        - {name: x_cubed, expr: "x ^ 3"}
        - {name: y_squared, expr: "y ^ 2"}
        - {name: y_cubed, expr: "y ^ 3"}
        - {name: z_squared, expr: "z ^ 2"}
        - {name: z_cubed, expr: "z ^ 3"}
        - {name: xy, expr: "x * y"}
        - name: polynomial
          expr: "0.06865 + 0.108713 * x - 0.0157225 * x_squared + 0.00102805 * x_cubed + 0.886569 * y - 0.223581 * xy + 0.0126379 * x_squared * y - 0.017059 * y_squared + 0.0135266 * x * y_squared - 0.0334434 * y_cubed - 0.0535182 * z - 0.0354271 * x * z - 0.00261313 * x_squared * z - 0.154563 * y * z - 0.0160219 * xy * z - 0.0400606 * y_squared * z - 0.104875 * z_squared + 0.0159857 * x * z_squared - 0.0671656 * y * z_squared - 0.0260699 * z_cubed"
        - {name: theta_1500_volume_percent, expr: "14.2568 + 7.36318 * polynomial"}
        - {name: theta_1500, expr: "theta_1500_volume_percent / 100"}

scientific_notes: |
  # Rawls et al. (2003)

  ## Supported models

  - Figures 2 and 3 publish separate regression trees for volumetric water
    contents at -33 and -1500 kPa. Each tree has 20 terminal nodes whose means,
    within-node standard deviations, and sample counts were transcribed from
    the supplied source figures.
  - Section 3.2 publishes separate GMDH polynomials for the same targets. Their
    source domain is `0.02 < Corg < 28.44`, `0 < clay < 90`,
    `0.7 < sand < 95`, with `clay + sand <= 100`.

  ## Review decisions

  - Output quantity `volumetric_water_content` and unit `volume_fraction` use
    normalized API notation `cm³/cm³`. Tree means and GMDH results are divided
    by 100 from the paper's volume-percent scale.
  - The published regression trees use structured `decision_tree` variables.
    Numeric `lt` predicates preserve the printed strict thresholds, while enum
    `in` predicates preserve the texture-class groups shown in the figures.
  - All tree comparisons preserve strict `<` operators. Exact threshold
    equality follows the No branch and is covered by the leaf cases.
  - Independent-data RMSE values of 5.9 volume percentage points at -33 kPa
    and 2.6 volume percentage points at -1500 kPa are model-performance
    metadata, not implementation tolerances.

  ## Verification rationale

  - The 40 tree cases use published terminal regions and means as their
    oracles. Inputs lie inside those regions or exactly on published thresholds,
    so changing `<` to `<=`, choosing the wrong texture branch, or returning a
    neighboring leaf mean changes an asserted result.
  - The GMDH cases use direct decimal evaluation of the printed equations.
    They protect predictor normalization, coefficients, and conversion from
    volume percent to volumetric fraction; they are not observations or
    evidence of predictive accuracy.

  ## Documented limitations

  - Tree terminal means summarize groups and are not deterministic physical
    truths; the figures also report within-node standard deviations.
  - Public preview visibility does not establish redistribution rights. The
    preview payloads and publisher figures remain outside this specification.
