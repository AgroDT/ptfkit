scientific_notes: |
  # Rawls et al. (2003)

  ## Supported models

  - Figures 2 and 3 publish separate regression trees for volumetric water
    contents at -33 and -1500 kPa. Each tree has 20 terminal nodes whose means,
    within-node standard deviations, and sample counts were transcribed from
    the supplied source figures.
  - Section 3.2 publishes separate GMDH polynomials for the same targets. Their
    source domain is `0.02 < Corg < 28.44`, `0 < clay < 90`,
    `0.7 < sand < 95`, with `clay + sand <= 100`.

  ## Review decisions

  - Output quantity `volumetric_water_content` and unit `volume_fraction` use
    normalized API notation `cm³/cm³`. Tree means and GMDH results are divided
    by 100 from the paper's volume-percent scale.
  - The published regression trees use reusable named tree definitions. The
    -33 kPa tree selects the texture class with an exhaustive `match` before
    evaluating strict numeric `lt` thresholds; the -1500 kPa tree uses strict
    numeric splits.
  - All tree comparisons preserve strict `<` operators. Exact threshold
    equality follows the No branch and is covered by the leaf cases.
    IEEE NaN numeric inputs also make `<` false and therefore follow the No
    branch; tree leaves do not implicitly propagate missing numeric values.
  - Independent-data RMSE values of 5.9 volume percentage points at -33 kPa
    and 2.6 volume percentage points at -1500 kPa are model-performance
    metadata, not implementation tolerances.

  ## Verification rationale

  - The tree cases are calculated verification points whose expected values
    come from published terminal regions and means. Inputs lie inside those
    regions or exactly on published thresholds, so changing `<` to `<=`,
    choosing the wrong texture branch, or returning a neighboring leaf mean
    changes an asserted result. Additional points cover every texture-class
    membership across its relevant carbon ranges.
  - The GMDH cases use direct decimal evaluation of the printed equations.
    They protect predictor normalization, coefficients, and conversion from
    volume percent to volumetric fraction; they are not observations or
    evidence of predictive accuracy.

  ## Documented limitations

  - Tree terminal means summarize groups and are not deterministic physical
    truths; the figures also report within-node standard deviations.
  - Public preview visibility does not establish redistribution rights. The
    preview payloads and publisher figures remain outside this specification.
