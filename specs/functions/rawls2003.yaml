source:
  summary: Rawls et al. (2003), organic-carbon effects on soil water retention.
  citation_apa: >-
    Rawls, W. J., Pachepsky, Y. A., Ritchie, J. C., Sobecki, T. M., &
    Bloodworth, H. (2003). Effect of soil organic carbon on soil water
    retention. Geoderma, 116(1-2), 61-76.
  doi:
    identifier: 10.1016/S0016-7061(03)00094-6
    url: https://doi.org/10.1016/S0016-7061(03)00094-6
scope:
  territory: United States
  dataset: >-
    Approximately 12,000 samples from the USDA National Soil Characterization
    database; equations were evaluated with NRCS pilot-study data.
$defs:
  UsdaTextureClass:
    type: enum
    description: USDA soil textural class used by the Figure 2 regression tree.
    values:
      - {name: sand, value: "Sand"}
      - {name: loamy_sand, value: "Loamy sand"}
      - {name: sandy_loam, value: "Sandy loam"}
      - {name: loam, value: "Loam"}
      - {name: silt_loam, value: "Silt loam"}
      - {name: sandy_clay_loam, value: "Sandy clay loam"}
      - {name: silt, value: "Silt"}
      - {name: clay_loam, value: "Clay loam"}
      - {name: sandy_clay, value: "Sandy clay"}
      - {name: silty_clay_loam, value: "Silty clay loam"}
      - {name: silty_clay, value: "Silty clay"}
      - {name: clay, value: "Clay"}
functions:
  - name: calc_ptf_rawls2003_soc_theta33_tree
    status: implemented
    public_api:
      name: calc_ptf_rawls2003_soc_theta33_tree
      summary: Estimate volumetric water content at -33 kPa with the published regression tree.
    scope:
      prediction_target: Volumetric soil water content at -33 kPa.
      models: {h_theta: Regression-tree point estimate at -33 kPa, k_h: null}
    inputs:
      - name: soil_texture
        description: USDA soil textural class used to traverse Figure 2.
        $ref: "#/$defs/UsdaTextureClass"
      - name: soil_organic_carbon
        symbol: Corg
        unit: "% mass"
        domain: null
        description: Soil organic carbon content by mass.
    outputs:
      type: scalar
      name: theta_33
      quantity: volumetric_water_content
      symbol: theta_33
      unit: volume_fraction
      reported_unit: "cm³/cm³"
      domain: null
      description: Volumetric soil water content at -33 kPa.
    verification_cases:
      - id: figure_2_leaf_01_sand
        kind: published
        inputs: {soil_texture: sand, soil_organic_carbon: 1.0}
        expected: {theta_33: 0.108}
        source_location: "Figure 2, terminal node [1]"
        notes: Published terminal mean divided by 100; sand below 2.1% Corg.
      - id: figure_2_leaf_02_loamy_sand
        kind: published
        inputs: {soil_texture: loamy_sand, soil_organic_carbon: 1.0}
        expected: {theta_33: 0.151}
        source_location: "Figure 2, terminal node [2]"
        notes: Published terminal mean divided by 100; loamy sand below 2.1% Corg.
      - id: figure_2_leaf_03_sandy_loam_low_corg
        kind: published
        inputs: {soil_texture: sandy_loam, soil_organic_carbon: 1.0}
        expected: {theta_33: 0.204}
        source_location: "Figure 2, terminal node [3]"
        notes: Published terminal mean divided by 100; Corg below 1.1%.
      - id: figure_2_leaf_04_corg_1_1_boundary
        kind: published
        inputs: {soil_texture: sandy_loam, soil_organic_carbon: 1.1}
        expected: {theta_33: 0.244}
        source_location: "Figure 2, terminal node [4]"
        notes: Published terminal mean divided by 100; equality takes the No branch at Corg < 1.1.
      - id: figure_2_leaf_05_corg_2_1_boundary
        kind: published
        inputs: {soil_texture: sand, soil_organic_carbon: 2.1}
        expected: {theta_33: 0.280}
        source_location: "Figure 2, terminal node [5]"
        notes: Published terminal mean divided by 100; equality takes the No branch at Corg < 2.1.
      - id: figure_2_leaf_06_corg_4_8_boundary
        kind: published
        inputs: {soil_texture: loamy_sand, soil_organic_carbon: 4.8}
        expected: {theta_33: 0.350}
        source_location: "Figure 2, terminal node [6]"
        notes: Published terminal mean divided by 100; equality takes the No branch at Corg < 4.8.
      - id: figure_2_leaf_07_corg_7_7_boundary
        kind: published
        inputs: {soil_texture: sand, soil_organic_carbon: 7.7}
        expected: {theta_33: 0.394}
        source_location: "Figure 2, terminal node [7]"
        notes: Published terminal mean divided by 100; equality takes the No branch at Corg < 7.7.
      - id: figure_2_leaf_08_sandy_loam_high_corg
        kind: published
        inputs: {soil_texture: sandy_loam, soil_organic_carbon: 7.7}
        expected: {theta_33: 0.549}
        source_location: "Figure 2, terminal node [8]"
        notes: Published terminal mean divided by 100; sandy-loam high-Corg branch.
      - id: figure_2_leaf_09_loam_low_corg
        kind: published
        inputs: {soil_texture: loam, soil_organic_carbon: 1.0}
        expected: {theta_33: 0.272}
        source_location: "Figure 2, terminal node [9]"
        notes: Published terminal mean divided by 100; Corg below 1.7%.
      - id: figure_2_leaf_10_corg_1_7_boundary
        kind: published
        inputs: {soil_texture: loam, soil_organic_carbon: 1.7}
        expected: {theta_33: 0.305}
        source_location: "Figure 2, terminal node [10]"
        notes: Published terminal mean divided by 100; equality takes the No branch at Corg < 1.7.
      - id: figure_2_leaf_11_silt_loam_low_corg
        kind: published
        inputs: {soil_texture: silt_loam, soil_organic_carbon: 1.0}
        expected: {theta_33: 0.315}
        source_location: "Figure 2, terminal node [11]"
        notes: Published terminal mean divided by 100; Corg below 1.5%.
      - id: figure_2_leaf_12_corg_1_5_boundary
        kind: published
        inputs: {soil_texture: silt_loam, soil_organic_carbon: 1.5}
        expected: {theta_33: 0.338}
        source_location: "Figure 2, terminal node [12]"
        notes: Published terminal mean divided by 100; equality takes the No branch at Corg < 1.5.
      - id: figure_2_leaf_13_corg_4_2_loam_boundary
        kind: published
        inputs: {soil_texture: loam, soil_organic_carbon: 4.2}
        expected: {theta_33: 0.353}
        source_location: "Figure 2, terminal node [13]"
        notes: Published terminal mean divided by 100; equality takes the No branch at Corg < 4.2.
      - id: figure_2_leaf_14_corg_4_2_silt_boundary
        kind: published
        inputs: {soil_texture: silt_loam, soil_organic_carbon: 4.2}
        expected: {theta_33: 0.393}
        source_location: "Figure 2, terminal node [14]"
        notes: Published terminal mean divided by 100; second texture group at the 4.2% boundary.
      - id: figure_2_leaf_15_corg_8_5_loam_boundary
        kind: published
        inputs: {soil_texture: loam, soil_organic_carbon: 8.5}
        expected: {theta_33: 0.383}
        source_location: "Figure 2, terminal node [15]"
        notes: Published terminal mean divided by 100; equality takes the No branch at Corg < 8.5.
      - id: figure_2_leaf_16_corg_8_5_silt_boundary
        kind: published
        inputs: {soil_texture: silt_loam, soil_organic_carbon: 8.5}
        expected: {theta_33: 0.464}
        source_location: "Figure 2, terminal node [16]"
        notes: Published terminal mean divided by 100; second texture group at the 8.5% boundary.
      - id: figure_2_leaf_17_silty_clay_loam_low_corg
        kind: published
        inputs: {soil_texture: silty_clay_loam, soil_organic_carbon: 4.0}
        expected: {theta_33: 0.361}
        source_location: "Figure 2, terminal node [17]"
        notes: Published terminal mean divided by 100; Corg below 4.2%.
      - id: figure_2_leaf_18_corg_4_2_very_fine_boundary
        kind: published
        inputs: {soil_texture: silty_clay_loam, soil_organic_carbon: 4.2}
        expected: {theta_33: 0.548}
        source_location: "Figure 2, terminal node [18]"
        notes: Published terminal mean divided by 100; equality takes the No branch at Corg < 4.2.
      - id: figure_2_leaf_19_silty_clay
        kind: published
        inputs: {soil_texture: silty_clay, soil_organic_carbon: 1.0}
        expected: {theta_33: 0.397}
        source_location: "Figure 2, terminal node [19]"
        notes: Published terminal mean divided by 100; silty clay is not split by Corg.
      - id: figure_2_leaf_20_clay
        kind: published
        inputs: {soil_texture: clay, soil_organic_carbon: 1.0}
        expected: {theta_33: 0.426}
        source_location: "Figure 2, terminal node [20]"
        notes: Published terminal mean divided by 100; clay is not split by Corg.
    edge_cases: []
    documentation:
      notes:
        - Figure 2 reports terminal means and within-node standard deviations in volume percent; public outputs divide the means by 100.
        - Every comparison is strict less-than, so equality follows the No branch. The cases cover every leaf and threshold.
    implementation:
      variables:
        - name: theta_33
          decision_tree:
            split: {input: soil_texture, operator: in, values: [sand, loamy_sand, sandy_loam]}
            yes:
              split: {input: soil_organic_carbon, operator: lt, value: 2.1}
              yes:
                split: {input: soil_texture, operator: in, values: [sand]}
                yes: {leaf: 0.108}
                no:
                  split: {input: soil_texture, operator: in, values: [loamy_sand]}
                  yes: {leaf: 0.151}
                  no:
                    split: {input: soil_organic_carbon, operator: lt, value: 1.1}
                    yes: {leaf: 0.204}
                    no: {leaf: 0.244}
              no:
                split: {input: soil_organic_carbon, operator: lt, value: 4.8}
                yes: {leaf: 0.280}
                no:
                  split: {input: soil_organic_carbon, operator: lt, value: 7.7}
                  yes: {leaf: 0.350}
                  no:
                    split: {input: soil_texture, operator: in, values: [sand, loamy_sand]}
                    yes: {leaf: 0.394}
                    no: {leaf: 0.549}
            no:
              split: {input: soil_texture, operator: in, values: [loam, silt_loam, sandy_clay_loam, silt, clay_loam, sandy_clay]}
              yes:
                split: {input: soil_organic_carbon, operator: lt, value: 4.2}
                yes:
                  split: {input: soil_texture, operator: in, values: [loam, sandy_clay_loam, sandy_clay]}
                  yes:
                    split: {input: soil_organic_carbon, operator: lt, value: 1.7}
                    yes: {leaf: 0.272}
                    no: {leaf: 0.305}
                  no:
                    split: {input: soil_organic_carbon, operator: lt, value: 1.5}
                    yes: {leaf: 0.315}
                    no: {leaf: 0.338}
                no:
                  split: {input: soil_organic_carbon, operator: lt, value: 8.5}
                  yes:
                    split: {input: soil_texture, operator: in, values: [loam, clay_loam, sandy_clay]}
                    yes: {leaf: 0.353}
                    no: {leaf: 0.393}
                  no:
                    split: {input: soil_texture, operator: in, values: [loam, sandy_clay]}
                    yes: {leaf: 0.383}
                    no: {leaf: 0.464}
              no:
                split: {input: soil_texture, operator: in, values: [silty_clay_loam]}
                yes:
                  split: {input: soil_organic_carbon, operator: lt, value: 4.2}
                  yes: {leaf: 0.361}
                  no: {leaf: 0.548}
                no:
                  split: {input: soil_texture, operator: in, values: [silty_clay]}
                  yes: {leaf: 0.397}
                  no: {leaf: 0.426}

