      - {id: figure_3_leaf_11_clay_19_boundary, kind: calculated, inputs: {clay: 19.0, sand: 20.0, soil_organic_carbon: 1.0}, expected: {theta_1500: 0.143}, source_location: "Figure 3, terminal node [11]", rationale: "Selected at the published clay threshold; strict less-than takes region [11], whose mean is divided by 100."}
