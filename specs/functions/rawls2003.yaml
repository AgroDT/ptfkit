  - name: calc_ptf_rawls2003_soc_theta33_gmdh
    status: implemented
    public_api:
      name: calc_ptf_rawls2003_soc_theta33_gmdh
      summary: Estimate volumetric water content at -33 kPa with the published GMDH polynomial.
    scope:
      prediction_target: Volumetric soil water content at -33 kPa.
      models: {h_theta: GMDH polynomial point estimate at -33 kPa, k_h: null}
    inputs:
      - {name: soil_organic_carbon, symbol: Corg, unit: "% mass", domain: "0.02 < value < 28.44", description: Soil organic carbon content by mass.}
      - {name: clay, symbol: clay, unit: "% mass", domain: "0.0 < value < 90", description: Clay content by mass.}
      - {name: sand, symbol: sand, unit: "% mass", domain: "0.7 < value < 95", description: "Sand content by mass; clay plus sand must not exceed 100."}
    outputs:
      type: scalar
      name: theta_33
      quantity: volumetric_water_content
      symbol: theta_33
      unit: volume_fraction
      reported_unit: "cm³/cm³"
      domain: null
      description: Volumetric soil water content at -33 kPa.
    verification_cases:
      - id: calculated_diagnostic_probe
        kind: calculated
        inputs: {soil_organic_carbon: 1.0, clay: 20.0, sand: 60.0}
        expected: {theta_33: 0.24651660127906823}
        source_location: "Section 3.2 equation; evidence-bundle direct evaluation"
        rationale: >-
          The input is interior to every source range, clay plus sand is 80%,
          and direct decimal evaluation confirms the fixed value. This is an
          implementation probe, not an observation or evidence of accuracy.
    edge_cases: []
    documentation:
      notes:
        - The polynomial calculates volume percent; the public output divides the result by 100.
      warnings:
        - Apply only within the source ranges and with clay plus sand no greater than 100%.
    implementation:
      variables:
        - {name: x, expr: "-0.837531 + 0.430183 * soil_organic_carbon"}
        - {name: y, expr: "-1.40744 + 0.0661969 * clay"}
        - {name: z, expr: "-1.51866 + 0.0393284 * sand"}
        - {name: x_squared, expr: "x ^ 2"}
        - {name: x_cubed, expr: "x ^ 3"}
        - {name: y_squared, expr: "y ^ 2"}
        - {name: y_cubed, expr: "y ^ 3"}
        - {name: z_squared, expr: "z ^ 2"}
        - {name: z_cubed, expr: "z ^ 3"}
        - {name: xy, expr: "x * y"}
        - name: polynomial
          expr: "0.0461615 + 0.290955 * x - 0.0496845 * x_squared + 0.00704802 * x_cubed + 0.269101 * y - 0.176528 * xy + 0.0543138 * x_squared * y + 0.1982 * y_squared - 0.060699 * y_cubed - 0.320249 * z - 0.0111693 * x_squared * z + 0.14104 * y * z + 0.0657345 * xy * z - 0.102026 * y_squared * z - 0.04012 * z_squared + 0.160838 * x * z_squared - 0.121392 * y * z_squared - 0.0616676 * z_cubed"
        - {name: theta_33_volume_percent, expr: "29.7528 + 10.3544 * polynomial"}
        - {name: theta_33, expr: "theta_33_volume_percent / 100"}

