source:
  summary: Rawls et al. (2003), organic-carbon effects on soil water retention.
  citation_apa: >-
    Rawls, W. J., Pachepsky, Y. A., Ritchie, J. C., Sobecki, T. M., &
    Bloodworth, H. (2003). Effect of soil organic carbon on soil water
    retention. Geoderma, 116(1-2), 61-76.
  doi:
    identifier: 10.1016/S0016-7061(03)00094-6
    url: https://doi.org/10.1016/S0016-7061(03)00094-6
scope:
  territory: United States
  dataset: >-
    Approximately 12,000 samples from the USDA National Soil Characterization
    database; equations were evaluated with NRCS pilot-study data.
$defs:
  Theta33:
    type: scalar
    name: theta_33
    quantity: volumetric_water_content
    symbol: theta_33
    unit: volume_fraction
    reported_unit: "cm³/cm³"
    domain: null
    description: Volumetric soil water content at -33 kPa.
  Theta1500:
    type: scalar
    name: theta_1500
    quantity: volumetric_water_content
    symbol: theta_1500
    unit: volume_fraction
    reported_unit: "cm³/cm³"
    domain: null
    description: Volumetric soil water content at -1500 kPa.
  Theta33Tree:
    type: tree
    inputs:
      - {name: texture, $ref: ../definitions/soil.yaml#/$defs/UsdaTextureClass}
      - {name: carbon, type: number}
    output: {$ref: "#/$defs/Theta33"}
    root:
      match:
        input: texture
        cases:
          - values: [sand]
            then:
              split: {input: carbon, operator: lt, value: 2.1}
              yes: {leaf: 0.108}
              no:
                split: {input: carbon, operator: lt, value: 4.8}
                yes: {leaf: 0.280}
                no:
                  split: {input: carbon, operator: lt, value: 7.7}
                  yes: {leaf: 0.350}
                  no: {leaf: 0.394}
          - values: [loamy_sand]
            then:
              split: {input: carbon, operator: lt, value: 2.1}
              yes: {leaf: 0.151}
              no:
                split: {input: carbon, operator: lt, value: 4.8}
                yes: {leaf: 0.280}
                no:
                  split: {input: carbon, operator: lt, value: 7.7}
                  yes: {leaf: 0.350}
                  no: {leaf: 0.394}
          - values: [sandy_loam]
            then:
              split: {input: carbon, operator: lt, value: 1.1}
              yes: {leaf: 0.204}
              no:
                split: {input: carbon, operator: lt, value: 2.1}
                yes: {leaf: 0.244}
                no:
                  split: {input: carbon, operator: lt, value: 4.8}
                  yes: {leaf: 0.280}
                  no:
                    split: {input: carbon, operator: lt, value: 7.7}
                    yes: {leaf: 0.350}
                    no: {leaf: 0.549}
          - values: [loam, sandy_clay]
            then:
              split: {input: carbon, operator: lt, value: 1.7}
              yes: {leaf: 0.272}
              no:
                split: {input: carbon, operator: lt, value: 4.2}
                yes: {leaf: 0.305}
                no:
                  split: {input: carbon, operator: lt, value: 8.5}
                  yes: {leaf: 0.353}
                  no: {leaf: 0.383}
          - values: [sandy_clay_loam]
            then:
              split: {input: carbon, operator: lt, value: 1.7}
              yes: {leaf: 0.272}
              no:
                split: {input: carbon, operator: lt, value: 4.2}
                yes: {leaf: 0.305}
                no:
                  split: {input: carbon, operator: lt, value: 8.5}
                  yes: {leaf: 0.393}
                  no: {leaf: 0.464}
          - values: [silt_loam, silt]
            then:
              split: {input: carbon, operator: lt, value: 1.5}
              yes: {leaf: 0.315}
              no:
                split: {input: carbon, operator: lt, value: 4.2}
                yes: {leaf: 0.338}
                no:
                  split: {input: carbon, operator: lt, value: 8.5}
                  yes: {leaf: 0.393}
                  no: {leaf: 0.464}
          - values: [clay_loam]
            then:
              split: {input: carbon, operator: lt, value: 1.5}
              yes: {leaf: 0.315}
              no:
                split: {input: carbon, operator: lt, value: 4.2}
                yes: {leaf: 0.338}
                no:
                  split: {input: carbon, operator: lt, value: 8.5}
                  yes: {leaf: 0.353}
                  no: {leaf: 0.464}
          - values: [silty_clay_loam]
            then:
              split: {input: carbon, operator: lt, value: 4.2}
              yes: {leaf: 0.361}
              no: {leaf: 0.548}
          - values: [silty_clay]
            then: {leaf: 0.397}
          - values: [clay]
            then: {leaf: 0.426}
  Theta1500Tree:
    type: tree
    inputs:
      - {name: clay, type: number}
      - {name: sand, type: number}
      - {name: carbon, type: number}
    output: {$ref: "#/$defs/Theta1500"}
    root:
      split: {input: clay, operator: lt, value: 26}
      yes:
        split: {input: clay, operator: lt, value: 14}
        yes:
          split: {input: carbon, operator: lt, value: 2.3}
          yes:
            split: {input: clay, operator: lt, value: 8}
            yes:
              split: {input: sand, operator: lt, value: 80}
              yes:
                split: {input: carbon, operator: lt, value: 1.5}
                yes: {leaf: 0.061}
                no: {leaf: 0.085}
              no: {leaf: 0.040}
            no:
              split: {input: clay, operator: lt, value: 12}
              yes: {leaf: 0.082}
              no: {leaf: 0.100}
          no:
            split: {input: carbon, operator: lt, value: 6.5}
            yes: {leaf: 0.110}
            no: {leaf: 0.159}
        no:
          split: {input: clay, operator: lt, value: 19}
          yes:
            split: {input: carbon, operator: lt, value: 5.8}
            yes:
              split: {input: clay, operator: lt, value: 17}
              yes: {leaf: 0.116}
              no: {leaf: 0.128}
            no: {leaf: 0.167}
          no:
            split: {input: clay, operator: lt, value: 23}
            yes: {leaf: 0.143}
            no: {leaf: 0.160}
      no:
        split: {input: clay, operator: lt, value: 44}
        yes:
          split: {input: clay, operator: lt, value: 33}
          yes:
            split: {input: clay, operator: lt, value: 29}
            yes: {leaf: 0.173}
            no: {leaf: 0.193}
          no:
            split: {input: clay, operator: lt, value: 37.4}
            yes: {leaf: 0.211}
            no: {leaf: 0.229}
        no:
          split: {input: clay, operator: lt, value: 54}
          yes:
            split: {input: clay, operator: lt, value: 48}
            yes: {leaf: 0.253}
            no: {leaf: 0.275}
          no:
            split: {input: clay, operator: lt, value: 67}
            yes: {leaf: 0.296}
            no: {leaf: 0.323}
functions:
  - name: calc_ptf_rawls2003_soc_theta33_tree
    status: implemented
    public_api:
      name: calc_ptf_rawls2003_soc_theta33_tree
      summary: Estimate volumetric water content at -33 kPa with the published regression tree.
    scope:
      prediction_target: Volumetric soil water content at -33 kPa.
      models: {h_theta: Regression-tree point estimate at -33 kPa, k_h: null}
    inputs:
      - name: soil_texture
        description: USDA soil textural class used to traverse Figure 2.
        $ref: ../definitions/soil.yaml#/$defs/UsdaTextureClass
      - name: soil_organic_carbon
        symbol: Corg
        unit: "% mass"
        domain: null
        description: Soil organic carbon content by mass.
    outputs: {$ref: "#/$defs/Theta33"}
    verification_cases:
      - id: figure_2_leaf_01_sand
        kind: calculated
        inputs: {soil_texture: sand, soil_organic_carbon: 1.0}
        expected: {theta_33: 0.108}
        source_location: "Figure 2, terminal node [1]"
        rationale: Selected inside published terminal region [1]; expected value is the published terminal mean divided by 100.
      - id: figure_2_leaf_02_loamy_sand
        kind: calculated
        inputs: {soil_texture: loamy_sand, soil_organic_carbon: 1.0}
        expected: {theta_33: 0.151}
        source_location: "Figure 2, terminal node [2]"
        rationale: Selected inside published terminal region [2]; expected value is the published terminal mean divided by 100.
      - id: figure_2_leaf_03_sandy_loam_low_corg
        kind: calculated
        inputs: {soil_texture: sandy_loam, soil_organic_carbon: 1.0}
        expected: {theta_33: 0.204}
        source_location: "Figure 2, terminal node [3]"
        rationale: Selected inside published terminal region [3]; expected value is the published terminal mean divided by 100.
      - id: figure_2_leaf_04_corg_1_1_boundary
        kind: calculated
        inputs: {soil_texture: sandy_loam, soil_organic_carbon: 1.1}
        expected: {theta_33: 0.244}
        source_location: "Figure 2, terminal node [4]"
        rationale: Selected at the published 1.1% threshold; strict less-than takes region [4], whose published mean is divided by 100.
      - id: figure_2_leaf_05_corg_2_1_boundary
        kind: calculated
        inputs: {soil_texture: sand, soil_organic_carbon: 2.1}
        expected: {theta_33: 0.280}
        source_location: "Figure 2, terminal node [5]"
        rationale: Selected at the published 2.1% threshold; strict less-than takes region [5], whose published mean is divided by 100.
      - id: figure_2_leaf_06_corg_4_8_boundary
        kind: calculated
        inputs: {soil_texture: loamy_sand, soil_organic_carbon: 4.8}
        expected: {theta_33: 0.350}
        source_location: "Figure 2, terminal node [6]"
        rationale: Selected at the published 4.8% threshold; strict less-than takes region [6], whose published mean is divided by 100.
      - id: figure_2_leaf_07_corg_7_7_boundary
        kind: calculated
        inputs: {soil_texture: sand, soil_organic_carbon: 7.7}
        expected: {theta_33: 0.394}
        source_location: "Figure 2, terminal node [7]"
        rationale: Selected at the published 7.7% threshold; strict less-than takes region [7], whose published mean is divided by 100.
      - id: figure_2_leaf_08_sandy_loam_high_corg
        kind: calculated
        inputs: {soil_texture: sandy_loam, soil_organic_carbon: 7.7}
        expected: {theta_33: 0.549}
        source_location: "Figure 2, terminal node [8]"
        rationale: Selected inside published terminal region [8]; expected value is the published terminal mean divided by 100.
      - id: figure_2_leaf_09_loam_low_corg
        kind: calculated
        inputs: {soil_texture: loam, soil_organic_carbon: 1.0}
        expected: {theta_33: 0.272}
        source_location: "Figure 2, terminal node [9]"
        rationale: Selected inside published terminal region [9]; expected value is the published terminal mean divided by 100.
      - id: figure_2_leaf_10_corg_1_7_boundary
        kind: calculated
        inputs: {soil_texture: loam, soil_organic_carbon: 1.7}
        expected: {theta_33: 0.305}
        source_location: "Figure 2, terminal node [10]"
        rationale: Selected at the published 1.7% threshold; strict less-than takes region [10], whose published mean is divided by 100.
      - id: figure_2_leaf_11_silt_loam_low_corg
        kind: calculated
        inputs: {soil_texture: silt_loam, soil_organic_carbon: 1.0}
        expected: {theta_33: 0.315}
        source_location: "Figure 2, terminal node [11]"
        rationale: Selected inside published terminal region [11]; expected value is the published terminal mean divided by 100.
      - id: figure_2_leaf_12_corg_1_5_boundary
        kind: calculated
        inputs: {soil_texture: silt_loam, soil_organic_carbon: 1.5}
        expected: {theta_33: 0.338}
        source_location: "Figure 2, terminal node [12]"
        rationale: Selected at the published 1.5% threshold; strict less-than takes region [12], whose published mean is divided by 100.
      - id: figure_2_leaf_13_corg_4_2_loam_boundary
        kind: calculated
        inputs: {soil_texture: loam, soil_organic_carbon: 4.2}
        expected: {theta_33: 0.353}
        source_location: "Figure 2, terminal node [13]"
        rationale: Selected at the published 4.2% threshold; strict less-than takes region [13], whose published mean is divided by 100.
      - id: figure_2_leaf_14_corg_4_2_silt_boundary
        kind: calculated
        inputs: {soil_texture: silt_loam, soil_organic_carbon: 4.2}
        expected: {theta_33: 0.393}
        source_location: "Figure 2, terminal node [14]"
        rationale: Selected at the published 4.2% threshold in the silt group; expected value is region [14]'s published mean divided by 100.
      - id: figure_2_leaf_15_corg_8_5_loam_boundary
        kind: calculated
        inputs: {soil_texture: loam, soil_organic_carbon: 8.5}
        expected: {theta_33: 0.383}
        source_location: "Figure 2, terminal node [15]"
        rationale: Selected at the published 8.5% threshold; strict less-than takes region [15], whose published mean is divided by 100.
      - id: figure_2_leaf_16_corg_8_5_silt_boundary
        kind: calculated
        inputs: {soil_texture: silt_loam, soil_organic_carbon: 8.5}
        expected: {theta_33: 0.464}
        source_location: "Figure 2, terminal node [16]"
        rationale: Selected at the published 8.5% threshold in the silt group; expected value is region [16]'s published mean divided by 100.
      - id: figure_2_leaf_17_silty_clay_loam_low_corg
        kind: calculated
        inputs: {soil_texture: silty_clay_loam, soil_organic_carbon: 4.0}
        expected: {theta_33: 0.361}
        source_location: "Figure 2, terminal node [17]"
        rationale: Selected inside published terminal region [17]; expected value is the published terminal mean divided by 100.
      - id: figure_2_leaf_18_corg_4_2_very_fine_boundary
        kind: calculated
        inputs: {soil_texture: silty_clay_loam, soil_organic_carbon: 4.2}
        expected: {theta_33: 0.548}
        source_location: "Figure 2, terminal node [18]"
        rationale: Selected at the published 4.2% threshold; strict less-than takes region [18], whose published mean is divided by 100.
      - id: figure_2_leaf_19_silty_clay
        kind: calculated
        inputs: {soil_texture: silty_clay, soil_organic_carbon: 1.0}
        expected: {theta_33: 0.397}
        source_location: "Figure 2, terminal node [19]"
        rationale: Selected for silty clay in published terminal region [19]; expected value is the published terminal mean divided by 100.
      - id: figure_2_leaf_20_clay
        kind: calculated
        inputs: {soil_texture: clay, soil_organic_carbon: 1.0}
        expected: {theta_33: 0.426}
        source_location: "Figure 2, terminal node [20]"
        rationale: Selected for clay in published terminal region [20]; expected value is the published terminal mean divided by 100.
      - {id: figure_2_clay_loam_low, kind: calculated, inputs: {soil_texture: clay_loam, soil_organic_carbon: 1.0}, expected: {theta_33: 0.315}, source_location: "Figure 2, terminal node [11]", rationale: "Selected below the 1.5% threshold to verify clay-loam membership; expected value is the published mean divided by 100."}
      - {id: figure_2_clay_loam_mid_low, kind: calculated, inputs: {soil_texture: clay_loam, soil_organic_carbon: 2.0}, expected: {theta_33: 0.338}, source_location: "Figure 2, terminal node [12]", rationale: "Selected between the 1.5% and 4.2% thresholds to verify clay-loam membership; expected value is the published mean divided by 100."}
      - {id: figure_2_clay_loam_mid_high, kind: calculated, inputs: {soil_texture: clay_loam, soil_organic_carbon: 5.0}, expected: {theta_33: 0.353}, source_location: "Figure 2, terminal node [13]", rationale: "Selected between the 4.2% and 8.5% thresholds to verify clay-loam membership; expected value is the published mean divided by 100."}
      - {id: figure_2_clay_loam_high, kind: calculated, inputs: {soil_texture: clay_loam, soil_organic_carbon: 9.0}, expected: {theta_33: 0.464}, source_location: "Figure 2, terminal node [16]", rationale: "Selected above the 8.5% threshold to verify clay-loam membership; expected value is the published mean divided by 100."}
      - {id: figure_2_sandy_clay_low, kind: calculated, inputs: {soil_texture: sandy_clay, soil_organic_carbon: 1.0}, expected: {theta_33: 0.272}, source_location: "Figure 2, terminal node [9]", rationale: "Selected below the 1.7% threshold to verify sandy-clay membership; expected value is the published mean divided by 100."}
      - {id: figure_2_sandy_clay_mid_low, kind: calculated, inputs: {soil_texture: sandy_clay, soil_organic_carbon: 2.0}, expected: {theta_33: 0.305}, source_location: "Figure 2, terminal node [10]", rationale: "Selected between the 1.7% and 4.2% thresholds to verify sandy-clay membership; expected value is the published mean divided by 100."}
      - {id: figure_2_sandy_clay_mid_high, kind: calculated, inputs: {soil_texture: sandy_clay, soil_organic_carbon: 5.0}, expected: {theta_33: 0.353}, source_location: "Figure 2, terminal node [13]", rationale: "Selected between the 4.2% and 8.5% thresholds to verify sandy-clay membership; expected value is the published mean divided by 100."}
      - {id: figure_2_sandy_clay_high, kind: calculated, inputs: {soil_texture: sandy_clay, soil_organic_carbon: 9.0}, expected: {theta_33: 0.383}, source_location: "Figure 2, terminal node [15]", rationale: "Selected above the 8.5% threshold to verify sandy-clay membership; expected value is the published mean divided by 100."}
      - {id: figure_2_sandy_clay_loam_low, kind: calculated, inputs: {soil_texture: sandy_clay_loam, soil_organic_carbon: 1.0}, expected: {theta_33: 0.272}, source_location: "Figure 2, terminal node [9]", rationale: "Selected below the 1.7% threshold to verify sandy-clay-loam membership; expected value is the published mean divided by 100."}
      - {id: figure_2_sandy_clay_loam_mid_low, kind: calculated, inputs: {soil_texture: sandy_clay_loam, soil_organic_carbon: 2.0}, expected: {theta_33: 0.305}, source_location: "Figure 2, terminal node [10]", rationale: "Selected between the 1.7% and 4.2% thresholds to verify sandy-clay-loam membership; expected value is the published mean divided by 100."}
      - {id: figure_2_sandy_clay_loam_mid_high, kind: calculated, inputs: {soil_texture: sandy_clay_loam, soil_organic_carbon: 5.0}, expected: {theta_33: 0.393}, source_location: "Figure 2, terminal node [14]", rationale: "Selected between the 4.2% and 8.5% thresholds to verify sandy-clay-loam membership; expected value is the published mean divided by 100."}
      - {id: figure_2_sandy_clay_loam_high, kind: calculated, inputs: {soil_texture: sandy_clay_loam, soil_organic_carbon: 9.0}, expected: {theta_33: 0.464}, source_location: "Figure 2, terminal node [16]", rationale: "Selected above the 8.5% threshold to verify sandy-clay-loam membership; expected value is the published mean divided by 100."}
      - {id: figure_2_silt_low, kind: calculated, inputs: {soil_texture: silt, soil_organic_carbon: 1.0}, expected: {theta_33: 0.315}, source_location: "Figure 2, terminal node [11]", rationale: "Selected below the 1.5% threshold to verify silt membership; expected value is the published mean divided by 100."}
      - {id: figure_2_silt_mid_low, kind: calculated, inputs: {soil_texture: silt, soil_organic_carbon: 2.0}, expected: {theta_33: 0.338}, source_location: "Figure 2, terminal node [12]", rationale: "Selected between the 1.5% and 4.2% thresholds to verify silt membership; expected value is the published mean divided by 100."}
      - {id: figure_2_silt_mid_high, kind: calculated, inputs: {soil_texture: silt, soil_organic_carbon: 5.0}, expected: {theta_33: 0.393}, source_location: "Figure 2, terminal node [14]", rationale: "Selected between the 4.2% and 8.5% thresholds to verify silt membership; expected value is the published mean divided by 100."}
      - {id: figure_2_silt_high, kind: calculated, inputs: {soil_texture: silt, soil_organic_carbon: 9.0}, expected: {theta_33: 0.464}, source_location: "Figure 2, terminal node [16]", rationale: "Selected above the 8.5% threshold to verify silt membership; expected value is the published mean divided by 100."}
    edge_cases: []
    documentation:
      notes:
        - Figure 2 reports terminal means and within-node standard deviations in volume percent; public outputs divide the means by 100.
        - Every comparison is strict less-than, so equality follows the No branch. The cases cover every leaf and threshold.
        - A NaN organic-carbon input makes every less-than comparison false and follows the corresponding No branches; it is not propagated automatically.
    implementation:
      variables:
        - name: theta_33
          tree:
            definition: {$ref: "#/$defs/Theta33Tree"}
            arguments: {texture: soil_texture, carbon: soil_organic_carbon}

  - name: calc_ptf_rawls2003_soc_theta1500_tree
    status: implemented
    public_api:
      name: calc_ptf_rawls2003_soc_theta1500_tree
      summary: Estimate volumetric water content at -1500 kPa with the published regression tree.
    scope:
      prediction_target: Volumetric soil water content at -1500 kPa.
      models: {h_theta: Regression-tree point estimate at -1500 kPa, k_h: null}
    inputs:
      - {name: clay, symbol: clay, unit: "% mass", domain: null, description: Clay content by mass.}
      - {name: sand, symbol: sand, unit: "% mass", domain: null, description: Sand content by mass.}
      - {name: soil_organic_carbon, symbol: Corg, unit: "% mass", domain: null, description: Soil organic carbon content by mass.}
    outputs: {$ref: "#/$defs/Theta1500"}
    verification_cases:
      - {id: figure_3_leaf_01_low_corg, kind: calculated, inputs: {clay: 5.0, sand: 70.0, soil_organic_carbon: 1.0}, expected: {theta_1500: 0.061}, source_location: "Figure 3, terminal node [1]", rationale: "Selected inside published terminal region [1]; expected value is the published mean divided by 100."}
      - {id: figure_3_leaf_02_corg_1_5_boundary, kind: calculated, inputs: {clay: 5.0, sand: 70.0, soil_organic_carbon: 1.5}, expected: {theta_1500: 0.085}, source_location: "Figure 3, terminal node [2]", rationale: "Selected at the published 1.5% threshold; strict less-than takes region [2], whose mean is divided by 100."}
      - {id: figure_3_leaf_03_sand_80_boundary, kind: calculated, inputs: {clay: 5.0, sand: 80.0, soil_organic_carbon: 1.0}, expected: {theta_1500: 0.040}, source_location: "Figure 3, terminal node [3]", rationale: "Selected at the published sand threshold; strict less-than takes region [3], whose mean is divided by 100."}
      - {id: figure_3_leaf_04_clay_8_boundary, kind: calculated, inputs: {clay: 8.0, sand: 20.0, soil_organic_carbon: 2.0}, expected: {theta_1500: 0.082}, source_location: "Figure 3, terminal node [4]", rationale: "Selected at the published clay threshold; strict less-than takes region [4], whose mean is divided by 100."}
      - {id: figure_3_leaf_05_clay_12_boundary, kind: calculated, inputs: {clay: 12.0, sand: 20.0, soil_organic_carbon: 2.0}, expected: {theta_1500: 0.100}, source_location: "Figure 3, terminal node [5]", rationale: "Selected at the published clay threshold; strict less-than takes region [5], whose mean is divided by 100."}
      - {id: figure_3_leaf_06_corg_2_3_boundary, kind: calculated, inputs: {clay: 13.0, sand: 20.0, soil_organic_carbon: 2.3}, expected: {theta_1500: 0.110}, source_location: "Figure 3, terminal node [6]", rationale: "Selected at the published carbon threshold; strict less-than takes region [6], whose mean is divided by 100."}
      - {id: figure_3_leaf_07_corg_6_5_boundary, kind: calculated, inputs: {clay: 13.0, sand: 20.0, soil_organic_carbon: 6.5}, expected: {theta_1500: 0.159}, source_location: "Figure 3, terminal node [7]", rationale: "Selected at the published carbon threshold; strict less-than takes region [7], whose mean is divided by 100."}
      - {id: figure_3_leaf_08_clay_14_boundary, kind: calculated, inputs: {clay: 14.0, sand: 20.0, soil_organic_carbon: 5.0}, expected: {theta_1500: 0.116}, source_location: "Figure 3, terminal node [8]", rationale: "Selected at the published clay threshold; strict less-than takes region [8], whose mean is divided by 100."}
      - {id: figure_3_leaf_09_clay_17_boundary, kind: calculated, inputs: {clay: 17.0, sand: 20.0, soil_organic_carbon: 5.0}, expected: {theta_1500: 0.128}, source_location: "Figure 3, terminal node [9]", rationale: "Selected at the published clay threshold; strict less-than takes region [9], whose mean is divided by 100."}
