      - id: calculated_high_carbon_probe
        kind: calculated
        inputs: {soil_organic_carbon: 10.0, clay: 20.0, sand: 60.0}
        expected: {theta_33: 0.36525658111557506}
        source_location: "Section 3.2 equation; independent decimal evaluation"
