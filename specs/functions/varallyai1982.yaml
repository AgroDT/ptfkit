source:
  summary: Varallyai et al. (1982), water-retention parameter regressions for Hungarian soils.
  citation_apa: >-
    Varallyai, D., Raikai, K., Mironenko, Ye. V., Pachepskiy, Ya. A., & Scherbakov,
    R. A. (1982). A mathematical description of basic water-physical soil
    characteristics. Pochvovedenie, (4), 77-89.
  doi: null
scope:
  territory: Hungary, mainly the Hungarian Plain
  dataset: >-
    Undisturbed samples from 559 genetic horizons in 160 soil profiles; the
    meadow-series regressions used 68 samples and the chernozem comparison used
    108 samples.
$defs:
  bulkDensity:
    name: bulk_density
    symbol: rho
    unit: g/cm^3
    domain: value > 0
    description: Undisturbed-soil bulk density.
  fineSandFraction:
    name: fine_sand_fraction
    symbol: S
    unit: fraction
    domain: 0 <= value <= 1
    description: Mass fraction in the 0.25-0.05 mm particle-size class.
  fineFraction:
    name: fine_fraction
    symbol: C
    unit: fraction
    domain: 0 <= value <= 1
    description: Fine-particle mass fraction reported as particles smaller than 0.002 mm.
  Varallyai1982Parameters:
    type: record
    name: Varallyai1982Parameters
    fields:
      - name: theta_0
        symbol: theta_0
        unit: vol.%
        domain: null
        description: Upper-asymptote water content parameter of equation (9).
      - name: m
        symbol: m
        unit: dimensionless
        domain: null
        description: Shape parameter of equation (9).
      - name: pf_star
        symbol: pF_*
        unit: dimensionless
        domain: null
        description: >-
          Base-10 logarithm of the equation (9) suction-scale parameter psi_*,
          with suction expressed in centimetres of water.
functions:
  - name: calc_ptf_varallyai1982_meadow
    status: implemented
    public_api:
      name: calc_ptf_varallyai1982_meadow
      result_class: Varallyai1982Parameters
      summary: Estimate equation (9) water-retention parameters for meadow-series soils.
    scope:
      territory: Hungary, mainly the Hungarian Plain
      prediction_target: Parameters of the equation (9) water-retention model.
      models:
        h_theta: "theta = theta_0 / (1 + (psi / psi_*)^m)"
        k_h: null
    inputs:
      - $ref: '#/$defs/bulkDensity'
      - $ref: '#/$defs/fineSandFraction'
      - $ref: '#/$defs/fineFraction'
    outputs:
      $ref: '#/$defs/Varallyai1982Parameters'
    verification_cases:
      - id: representative_review_case
        kind: calculated
        inputs:
          bulk_density: 1.4
          fine_sand_fraction: 0.3
          fine_fraction: 0.25
        expected:
          theta_0: 46.54495
          m: 0.10029
          pf_star: 3.62445
        rationale: Calculated directly from equation (14) during specification review.
    edge_cases:
      - id: nan_fine_fraction
        inputs:
          bulk_density: 1.4
          fine_sand_fraction: 0.3
          fine_fraction: .nan
        expected_behavior: Propagate NaN to all outputs.
        notes: Review numeric policy.
    documentation:
      notes:
        - Equation (14) was fitted to 68 meadow-series soil samples.
        - S and C are fractions of one, while bulk density is in g/cm^3.
        - The source reports 95% relative errors of 14% for theta_0, 34% for m, and 25% for pF_*.
      warnings:
        - Use is described as approximate by the source.
        - The source does not report exact calibration ranges; avoid extrapolation beyond comparable Hungarian meadow-series soils.
    implementation:
      variables:
        - name: theta_0
          expr: -8.78 * bulk_density ^ 2 + 14.46 * fine_fraction ^ 2 + 62.85
        - name: m
          expr: 0.576 * fine_sand_fraction ^ 2 - 1.434 * fine_sand_fraction * fine_fraction + 0.156
        - name: pf_star
          expr: -1.702 * fine_sand_fraction + 1.103 * bulk_density * fine_fraction + 3.749
  - name: calc_ptf_varallyai1982_chernozem_a
    status: implemented
    public_api:
      name: calc_ptf_varallyai1982_chernozem_a
      result_class: Varallyai1982Parameters
      summary: Estimate equation (9) water-retention parameters for chernozem A horizons.
    scope:
      territory: Hungary, mainly the Hungarian Plain
      prediction_target: Parameters of the equation (9) water-retention model for chernozem A horizons.
      models:
        h_theta: "theta = theta_0 / (1 + (psi / psi_*)^m)"
        k_h: null
    inputs:
      - $ref: '#/$defs/bulkDensity'
      - $ref: '#/$defs/fineFraction'
    outputs:
      $ref: '#/$defs/Varallyai1982Parameters'
    verification_cases:
      - id: representative_review_case
        kind: calculated
        inputs:
          bulk_density: 1.4
          fine_fraction: 0.35
        expected:
          theta_0: 52.005
          m: 0.4174
          pf_star: 4.00469
        rationale: Calculated directly from equation (15) during specification review.
    edge_cases:
      - id: nan_bulk_density
        inputs:
          bulk_density: .nan
          fine_fraction: 0.35
        expected_behavior: Propagate NaN to all outputs.
        notes: Review numeric policy.
    documentation:
      notes:
        - Equation (15) applies to chernozem A horizons.
        - The source reports 95% relative errors of 10% for theta_0, 29% for m, and 18% for pF_*.
      warnings:
        - Use is described as approximate by the source.
        - The source does not report exact calibration ranges; avoid extrapolation beyond comparable Hungarian chernozem A horizons.
    implementation:
      variables:
        - name: theta_0
          expr: -56.40 * bulk_density + 20.50 * fine_fraction + 123.79
        - name: m
          expr: 0.336 * bulk_density - 0.053
        - name: pf_star
          expr: 4.701 * bulk_density * fine_fraction + 1.513 * bulk_density - 0.417
  - name: calc_ptf_varallyai1982_chernozem_b
    status: implemented
    public_api:
      name: calc_ptf_varallyai1982_chernozem_b
      result_class: Varallyai1982Parameters
      summary: Estimate equation (9) water-retention parameters for chernozem B horizons.
    scope:
      territory: Hungary, mainly the Hungarian Plain
      prediction_target: Parameters of the equation (9) water-retention model for chernozem B horizons.
      models:
        h_theta: "theta = theta_0 / (1 + (psi / psi_*)^m)"
        k_h: null
    inputs:
      - $ref: '#/$defs/bulkDensity'
      - $ref: '#/$defs/fineFraction'
    outputs:
      $ref: '#/$defs/Varallyai1982Parameters'
    verification_cases:
      - id: representative_review_case
        kind: calculated
        inputs:
          bulk_density: 1.4
          fine_fraction: 0.35
        expected:
          theta_0: 47.60035
          m: 0.407
          pf_star: 3.9299
        rationale: Calculated directly from equation (16) during specification review.
    edge_cases:
      - id: nan_bulk_density
        inputs:
          bulk_density: .nan
          fine_fraction: 0.35
        expected_behavior: Propagate NaN to all outputs.
        notes: Review numeric policy.
    documentation:
      notes:
        - Equation (16) applies to chernozem B horizons.
        - The source reports 95% relative errors of 11% for theta_0, 34% for m, and 18% for pF_*.
      warnings:
        - Use is described as approximate by the source.
        - The source does not report exact calibration ranges; avoid extrapolation beyond comparable Hungarian chernozem B horizons.
    implementation:
      variables:
        - name: theta_0
          expr: -62.20 * bulk_density - 49.14 * fine_fraction ^ 2 + 140.70
        - name: m
          expr: 0.635 * bulk_density - 0.482
        - name: pf_star
          expr: 4.270 * bulk_density * fine_fraction + 3.509 * bulk_density - 3.075
  - name: calc_ptf_varallyai1982_chernozem_c
    status: implemented
    public_api:
      name: calc_ptf_varallyai1982_chernozem_c
      result_class: Varallyai1982Parameters
      summary: Estimate equation (9) water-retention parameters for chernozem C horizons.
    scope:
      territory: Hungary, mainly the Hungarian Plain
      prediction_target: Parameters of the equation (9) water-retention model for chernozem C horizons.
      models:
        h_theta: "theta = theta_0 / (1 + (psi / psi_*)^m)"
        k_h: null
    inputs:
      - $ref: '#/$defs/bulkDensity'
      - $ref: '#/$defs/fineFraction'
    outputs:
      $ref: '#/$defs/Varallyai1982Parameters'
    verification_cases:
      - id: representative_review_case
        kind: calculated
        inputs:
          bulk_density: 1.4
          fine_fraction: 0.35
        expected:
          theta_0: 49.87
          m: 0.84011
          pf_star: 3.59772
        rationale: Calculated directly from equation (17) during specification review.
    edge_cases:
      - id: nan_bulk_density
        inputs:
          bulk_density: .nan
          fine_fraction: 0.35
        expected_behavior: Propagate NaN to all outputs.
        notes: Review numeric policy.
    documentation:
      notes:
        - Equation (17) applies to chernozem C horizons.
        - The source reports 95% relative errors of 7% for theta_0, 22% for m, and 11% for pF_*.
      warnings:
        - Use is described as approximate by the source.
        - The source does not report exact calibration ranges; avoid extrapolation beyond comparable Hungarian chernozem C horizons.
    implementation:
      variables:
        - name: theta_0
          expr: -46.80 * bulk_density + 115.39
        - name: m
          expr: 0.439 * bulk_density * fine_fraction + 0.625
        - name: pf_star
          expr: 3.268 * bulk_density * fine_fraction + 0.865 * bulk_density ^ 2 + 0.301
scientific_notes: |
  # Varallyai et al. (1982)

  The extracted functions are equations (14)-(17), which predict the three
  parameters of equation (9):

  ```text
  theta = theta_0 / (1 + (psi / psi_*) ^ m)
  pF_* = log10(psi_*), with psi_* expressed in cm H2O
  ```

  The paper describes the regressions as suitable only for approximate
  calculations. The source dataset comprises undisturbed Hungarian soil samples.
  Water-retention observations covered pF 0-6.2, but that measurement range is
  not an input domain for these parameter regressions.

  ## Review decisions

  - Use `f64`, do not round intermediate or returned values, and propagate NaN
    according to ordinary IEEE-754 arithmetic.
  - Restrict particle-size fractions to the physical interval [0, 1] and bulk
    density to positive values. These are API validity domains, not reported
    calibration bounds.
  - The source reports no exact calibration ranges. Applicability is therefore
    limited by documentation to comparable Hungarian meadow-series soils or the
    specified chernozem genetic horizon; no narrower numeric bounds are inferred.
  - Golden values are review-derived evaluations of equations (14)-(17), not
    independently reported observations from the paper.
