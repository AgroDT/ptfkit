  - name: calc_ptf_ferrerjulia2004_humic_acrisol_sand
    status: implemented
    public_api: {name: calc_ptf_ferrerjulia2004_humic_acrisol_sand, result_class: null, summary: Estimate saturated conductivity for Humic Acrisol from sand content.}
    scope: {prediction_target: Saturated hydraulic conductivity for FAO 1974 Humic Acrisol., models: {h_theta: null, k_h: Exponential one-variable regression}}
