scientific_notes: |
  # Ferrer Julià et al. (2004)

  The paper first reproduces five published PTFs for comparison, then reports
  paired one-variable and three-variable regressions for 17 FAO 1974 soil
  classes, followed by two general regressions for the combined dataset. This
  ordering is retained above. The four regressions for Cambic Arenosol and
  Dystric Vertisol were explicitly rejected by the authors and are not reported
  numerically, so no functions are specified for them.

  The source reports saturated hydraulic conductivity in mm/h and defines `s`,
  `c`, and `om` as sand, clay, and organic matter percentages. Some database
  conductivity observations originated as qualitative descriptions converted
  to 1 mm/h (very low) or 50 mm/h (very high), creating substantial clusters at
  those values. The database also combined measurements made using different
  methods.

  The paper used the best soil-class PTF where available and the general
  three-variable PTF otherwise when filling missing horizon conductivity. It
  then formed profile conductivity as a horizon-thickness-weighted arithmetic
  mean. Those spatial workflow rules and the MD, RMSD, AMD, and relative-error
  diagnostics are not exposed as PTF functions in this source specification.

  ## Human review decisions

  - For `calc_ptf_ferrerjulia2004_gleyic_solonchak_texture_organic_matter`, use
    `-0.90917` as the intercept. The original PDF and its text layer print
    `-90917`; the reviewer identified this as a missing-decimal typographical
    error and explicitly supplied the corrected value.
  - Approve the proposed public API decomposition and names, including the five
    comparison equations reproduced by the article.
  - Treat sand, clay, and organic matter as percentage-valued API inputs in the
    closed interval 0 to 100. Require strictly positive clay only for the
    Saxton equation because it evaluates `log10(clay)`. These are API validity
    bounds, not claims about the unreported calibration ranges.
  - Use IEEE-754 `f64`, perform no rounding or output clamping, and propagate
    NaN and infinities with NumPy-compatible arithmetic. In particular, retain
    negative results from the linear regressions rather than silently replacing
    them with zero.
  - Use the synthetic finite-domain vectors recorded in `golden_tests` as
    implementation regression tests. Their expected values are direct formula
    evaluations and are not presented as observations from the article.
  - No separate edge-case vectors are required beyond input-domain validation
    and the numeric policy above.

  ## Scientific cautions retained after review

  - For `calc_ptf_ferrerjulia2004_gleyic_solonchak_sand`, Table 3 reports
    `R^2 = 0.399`, while the discussion reports `R^2 = 0.435`. This discrepancy
    does not alter the printed regression coefficients.
  - Both Rendzina regressions have weak horizon-level fits affected by converted
    qualitative conductivity values. The paper reports a profile-average
    one-variable fit of `R^2 = 0.727` but does not provide its coefficients.
  - Both Calcic Luvisol regressions have weak fits; the authors state that clay
    mineralogical information would likely be needed to improve them.
