source:
  summary: Ferrer Julià et al. (2004), saturated-conductivity PTFs for Spanish soils.
  citation_apa: >-
    Ferrer Julià, M., Estrela Monreal, T., Sánchez del Corral Jiménez, A., &
    García Meléndez, E. (2004). Constructing a saturated hydraulic
    conductivity map of Spain using pedotransfer functions and spatial
    prediction. Geoderma, 123, 257-277.
  doi:
    identifier: 10.1016/j.geoderma.2004.02.011
    url: https://doi.org/10.1016/j.geoderma.2004.02.011
scope:
  territory: Spanish mainland on the Iberian Peninsula
  dataset: >-
    Trueba et al. (2000a) Spanish soil database: 2178 profiles and 7011
    horizons; the general regressions used 3172 horizons with sufficient data.
$defs:
  sand_percent:
    name: sand
    symbol: s
    unit: '%'
    domain: 0 <= value <= 100
    description: Sand content by percentage.
  clay_percent:
    name: clay
    symbol: c
    unit: '%'
    domain: 0 <= value <= 100
    description: Clay content by percentage.
  organic_matter_percent:
    name: organic_matter
    symbol: om
    unit: '%'
    domain: 0 <= value <= 100
    description: Organic matter content by percentage.
  clay_positive_percent:
    name: clay
    symbol: c
    unit: '%'
    domain: 0 < value <= 100
    description: Clay content by percentage; strictly positive for the base-10 logarithm.
  k_sat_mm_h: &k_sat_mm_h
    type: scalar
    name: k_sat
    symbol: K_s
    unit: mm/h
    domain: null
    description: Estimated saturated hydraulic conductivity.
functions:
  - name: calc_ptf_ferrerjulia2004_campbell_shiozawa
    status: implemented
    public_api: {name: calc_ptf_ferrerjulia2004_campbell_shiozawa, result_class: null, summary: Evaluate the Campbell and Shiozawa saturated-conductivity PTF.}
    scope: {prediction_target: Saturated hydraulic conductivity., models: {h_theta: null, k_h: Campbell and Shiozawa (1994)}}
    inputs: [{$ref: '#/$defs/sand_percent'}, {$ref: '#/$defs/clay_percent'}]
    outputs: *k_sat_mm_h
    golden_tests:
      - id: reviewer_reference_vector
        inputs:
          sand: 50
          clay: 25
        verification:
          kind: calculated_reference
        notes: Synthetic finite-domain verification vector selected during human review and evaluated directly from the documented formula.
    edge_cases: []
    documentation: {notes: [Reproduced in Section 4.2 for comparison with the new Spanish-soil PTFs.], warnings: []}
    implementation:
      variables:
        - {name: k_sat, expr: '54 * exp(-0.07 * sand - 0.167 * clay)'}
  - name: calc_ptf_ferrerjulia2004_saxton
    status: implemented
    public_api: {name: calc_ptf_ferrerjulia2004_saxton, result_class: null, summary: Evaluate the Saxton et al. saturated-conductivity PTF.}
    scope: {prediction_target: Saturated hydraulic conductivity., models: {h_theta: null, k_h: Saxton et al. (1986)}}
    inputs: [{$ref: '#/$defs/sand_percent'}, {$ref: '#/$defs/clay_positive_percent'}]
    outputs: *k_sat_mm_h
    golden_tests:
      - id: reviewer_reference_vector
        inputs:
          sand: 50
          clay: 25
        verification:
          kind: calculated_reference
        notes: Synthetic finite-domain verification vector selected during human review and evaluated directly from the documented formula.
    edge_cases: []
    documentation: {notes: [Reproduced in Section 4.2 for comparison with the new Spanish-soil PTFs.], warnings: [The denominator contains log10(clay) and the source does not state its valid domain or singularity policy.]}
    implementation:
      variables:
        - name: k_sat
          expr: '10 * exp(1.01 - 0.0755 * sand + (-3.895 + 0.03671 * sand - 0.1103 * clay + 0.00087546 * clay ^ 2) / (0.33 - 0.000751 * sand + 0.176 * log10(clay)))'
  - name: calc_ptf_ferrerjulia2004_dane_puckett
    status: implemented
    public_api: {name: calc_ptf_ferrerjulia2004_dane_puckett, result_class: null, summary: Evaluate the Dane and Puckett saturated-conductivity PTF.}
