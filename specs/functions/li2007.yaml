source:
  summary: Li et al. (2007), Fengqiu County, North China Plain, China.
  citation_apa: Li, Y., Chen, D., White, R. E., Zhu, A., & Zhang, J. (2007). Estimating
    soil hydraulic properties of Fengqiu County soils in the North China Plain using
    pedo-transfer functions. Geoderma, 138(3-4), 261-271.
  doi:
    identifier: 10.1016/j.geoderma.2006.11.018
    url: https://doi.org/10.1016/j.geoderma.2006.11.018
scope:
  territory: Fengqiu County soils in the North China Plain, China
  dataset: 63 soil water retention curves and 36 saturated soil hydraulic conductivity
    samples from seven soil profiles.
functions:
- name: calc_ptf_li2007
  status: implemented
  public_api:
    name: calc_ptf_li2007
    result_class: Li2007PTFResult
    summary: Estimate van Genuchten parameters and saturated hydraulic conductivity
      for Fengqiu County soils.
  scope:
    prediction_target: Van Genuchten saturated water content, alpha, n, and saturated
      hydraulic conductivity.
    models:
      h_theta: Van Genuchten model without residual water content term
      k_h: Saturated hydraulic conductivity
  inputs:
  - name: sand
    symbol: SAND
    unit: '%'
    domain: value > 0
    description: Sand content, 0.02-2 mm.
  - name: silt
    symbol: SILT
    unit: '%'
    domain: value > 0
    description: Silt content, 0.02-0.002 mm.
  - name: clay
    symbol: CLAY
    unit: '%'
    domain: value > 0
    description: Clay content, <0.002 mm.
  - name: bulk_density
    symbol: BD
    unit: g/cm^3
    domain: value > 0
    description: Bulk density.
  - name: soil_organic_matter
    symbol: SOM
    unit: '%'
    domain: value > 0
    description: Soil organic matter.
  outputs:
    type: record
    name: Li2007PTFResult
    fields:
    - name: theta_s
      symbol: theta_s
      unit: cm^3/cm^3
      domain: value >= 0
      description: Saturated water content.
    - name: a_vg
      symbol: alpha
      unit: cm^-1
      domain: value >= 0
      description: Van Genuchten alpha parameter, inversely related to air-entry suction.
    - name: n_vg
      symbol: n
      unit: dimensionless
      domain: value > 1
      description: Van Genuchten n parameter that characterizes pore-size distribution.
    - name: k_sat
      symbol: Ks
      unit: m/s
      domain: value >= 0
      description: Saturated hydraulic conductivity.
  verification_cases:
  - id: loamy_sand
    kind: calculated
    inputs:
      sand: 85.0
      silt: 10.0
      clay: 5.0
      soil_organic_matter: 0.21
      bulk_density: 1.2
    expected:
      theta_s: 0.5256803583157499
      a_vg: 0.9491464758307142
      n_vg: 1.1657804980997006
      k_sat: 6.549110367333547e-06
    rationale: Calculated from Table 6 formulas and unit conversion.
  - id: loam
    kind: calculated
    inputs:
      sand: 50.23
      silt: 38.72
      clay: 11.05
      soil_organic_matter: 0.65
      bulk_density: 1.42
    expected:
      theta_s: 0.49659526127697506
      a_vg: 0.009519989841950734
      n_vg: 1.1806286355149054
      k_sat: 4.5117324656202257e-07
    rationale: Calculated from Table 6 formulas and unit conversion.
  - id: silty_clay
    kind: calculated
    inputs:
      sand: 12.88
      silt: 60.0
      clay: 27.12
      soil_organic_matter: 1.02
      bulk_density: 1.48
    expected:
      theta_s: 0.4053061510618609
      a_vg: 0.0018530400762371828
      n_vg: 1.2080428739797433
      k_sat: 1.5151432632107234e-06
    rationale: Calculated from Table 6 formulas and unit conversion.
  edge_cases:
  - id: non_positive_log_input
    inputs:
      sand: 0.0
      silt: 10.0
      clay: 5.0
      soil_organic_matter: 0.21
      bulk_density: 1.2
    expected_behavior: NumPy-compatible logarithm-domain behaviour.
    notes: Formula uses natural logarithms of all inputs.
  documentation:
    warnings:
    - The formulas use natural logarithms of selected inputs.
  implementation:
    variables:
    - name: sand_ln
      expr: ln(sand)
    - name: silt_ln
      expr: ln(silt)
    - name: clay_ln
      expr: ln(clay)
    - name: soil_organic_matter_ln
      expr: ln(soil_organic_matter)
    - name: bulk_density_ln
      expr: ln(bulk_density)
    - name: theta_s
      expr: exp(-1.531 + 0.212 * sand_ln + 0.006 * silt - 0.051 * soil_organic_matter - 0.566 * bulk_density_ln)
    - name: a_vg
      expr: exp(-67.408 - 0.040 * silt - 0.670 * silt_ln - 2.189 * soil_organic_matter + 1.410 * soil_organic_matter_ln + 78.400 * bulk_density - 121.331 * bulk_density_ln)
    - name: n_vg
      expr: 1.488 + 0.002 * silt_ln + 0.013 * clay - 0.248 * clay_ln + 0.048 * soil_organic_matter_ln + 0.451 * bulk_density_ln
    - name: k_sat_cm_per_day
      expr: exp(13.262 - 1.914 * sand_ln - 0.974 * silt_ln - 0.058 * clay - 1.709 * soil_organic_matter_ln + 2.885 * soil_organic_matter - 8.026 * bulk_density_ln)
    - name: k_sat
      expr: k_sat_cm_per_day * (1.0 / 8640000.0)
scientific_notes: |
  # Li et al. (2007)

  ## Supported models

  Table 6 supplies the regressions for van Genuchten parameters and saturated
  hydraulic conductivity. The public conductivity output converts cm/day to m/s.

  ## Documented limitations

  The logarithmic predictors require positive sand, silt, clay, soil organic
  matter, and bulk density.
