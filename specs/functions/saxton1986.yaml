source:
  summary: Saxton et al. retention relationships parameterized by USDA CalcPTF.
  citation_apa: >-
    Saxton, K. E., Rawls, W. J., Romberger, J. S., & Papendick, R. I. (1986).
    Estimating generalized soil-water characteristics from texture. Soil Science
    Society of America Journal, 50(4), 1031-1036.
  doi:
    identifier: 10.2136/sssaj1986.03615995005000040039x
    url: https://doi.org/10.2136/sssaj1986.03615995005000040039x
scope:
  territory: United States
  dataset: >-
    The retention regressions were fitted to 44 texture combinations generated
    from the Rawls et al. (1982) regressions for 2541 soil horizons.
functions:
  - name: calc_ptf_saxton1986_calcptf_parameters
    status: implemented
    public_api:
      name: calc_ptf_saxton1986_calcptf_parameters
      result_class: Saxton1986CalcPTFParameters
      summary: >-
        Estimate the CalcPTF Brooks-Corey parameterization of the Saxton et al.
        retention relationship from sand, clay, bulk density, and particle density.
    scope:
      prediction_target: >-
        Residual and saturated volumetric water content, inverse air-entry head,
        and pore-size distribution index for the Brooks-Corey retention model.
      models:
        h_theta: Brooks-Corey moisture-retention model
        k_h: null
    inputs:
      - name: sand
        symbol: sand
        unit: '%'
        domain: 5 <= value <= 95
        description: Sand content under the USDA particle-size classification.
      - name: clay
        symbol: clay
        unit: '%'
        domain: 5 <= value <= 60
        description: Clay content under the USDA particle-size classification.
      - name: bulk_density
        symbol: rho_b
        unit: g/cm^3
        domain: value > 0
        description: Soil bulk density used by CalcPTF to calculate porosity.
      - name: particle_density
        symbol: rho_s
        unit: g/cm^3
        domain: value > bulk_density
        description: Soil particle density used by CalcPTF to calculate porosity.
    outputs:
      type: record
      name: Saxton1986CalcPTFParameters
      fields:
        - name: theta_r
          quantity: volumetric_water_content
          symbol: theta_r
          unit: volume_fraction
          reported_unit: cm^3/cm^3
          domain: value == 0
          description: Residual volumetric water content fixed to zero.
        - name: theta_s
          quantity: volumetric_water_content
          symbol: theta_s
          unit: volume_fraction
          reported_unit: cm^3/cm^3
          domain: 0 < value < 1
          description: Saturated volumetric water content represented by soil porosity.
        - name: alpha
          quantity: brooks_corey_alpha
          symbol: alpha
          unit: inverse_centimeter
          reported_unit: cm^-1
          domain: value > 0
          description: Inverse Brooks-Corey air-entry pressure head.
        - name: conductivity_lambda
          quantity: conductivity_shape_parameter
          symbol: lambda
          unit: dimensionless
          reported_unit: dimensionless
          domain: value > 0
          description: Brooks-Corey pore-size distribution index.
    verification_cases:
      - id: calcptf_shipped_example
        kind: published
        inputs:
          sand: 58.6
          clay: 11.1
          bulk_density: 1.42
          particle_density: 2.6
        expected:
          theta_r: 0.00000
          theta_s: 0.45385
          alpha: 0.11593
          conductivity_lambda: 0.21090
        source_location: >-
          USDA CalcPTF version 3.0 manual, Section 4.4, sample 1 and the
          Saxton et al. (1986) row of WR.par
        notes: >-
          The CalcPTF WR.par heading labels its final Brooks-Corey column `n`;
          the manual and parameter plot identify this value as lambda.
    edge_cases:
      - id: nan_sand
        inputs:
          sand: .nan
          clay: 11.1
          bulk_density: 1.42
          particle_density: 2.6
        expected_behavior: >-
          Propagate NaN through alpha and conductivity_lambda while theta_r and
          theta_s remain independent of sand.
        notes: Reviewed NumPy-compatible numeric policy.
    documentation:
      notes:
        - >-
          This API exposes the USDA CalcPTF parameterization of the 1986
          regressions rather than every water-potential and conductivity function
          published in the article.
        - >-
          CalcPTF converts the article's air-entry tension from kPa to centimetres
          of water using 10 cm per kPa before taking its inverse.
      warnings:
        - >-
          The article's validated texture region is piecewise: 5-30% sand with
          8-58% clay, or 30-95% sand with 5-60% clay. Sand and clay must also
          describe a physically valid USDA texture composition.
        - >-
          The relationships represent texture-driven statistical estimates;
          density, structure, organic matter, clay type, and hysteresis can affect
          measured retention behavior.
    implementation:
      variables:
        - name: theta_r
          expr: "0"
        - name: theta_s
          expr: 1 - bulk_density / particle_density
        - name: sand_squared
          expr: sand ^ 2
        - name: retention_a
          expr: 100 * exp(-4.396 - 0.0715 * clay - 0.000488 * sand_squared - 0.00004285 * sand_squared * clay)
        - name: retention_b
          expr: -3.140 - 0.00222 * clay ^ 2 - 0.00003484 * sand_squared * clay
        - name: air_entry_tension
          expr: retention_a * theta_s ^ retention_b
        - name: alpha
          expr: 1 / (10 * air_entry_tension)
        - name: conductivity_lambda
          expr: -1 / retention_b

scientific_notes: |
  # Saxton et al. (1986), CalcPTF parameterization

  ## Supported model

  The article defines the dry-range retention relationship as
  `Psi = A * theta^B`, with `Psi` in kPa and `theta` in cubic metres per cubic
  metre. Equations 5 and 6 regress `A` and `B` against USDA sand and clay
  percentages. The published erratum confirms that the final term in Equation 6
  is `g * sand^2 * clay`.

  ## Review decisions

  - USDA CalcPTF version 3.0 explicitly parameterizes the Saxton et al. equations
    as a Brooks-Corey model. It fixes `theta_r` to zero and obtains `theta_s` from
    porosity as `1 - bulk_density / particle_density`.
  - From the article's identity `A = Psi_e * theta_s^(-B)`, air-entry tension is
    `Psi_e = A * theta_s^B`. CalcPTF reports inverse air-entry head as
    `alpha = 1 / (10 * Psi_e)`, using its documented 10 cm-per-kPa conversion,
    and the Brooks-Corey index as `lambda = -1 / B`.
  - The function name makes the secondary CalcPTF parameterization boundary
    explicit and avoids conflating this source with Saxton and Rawls (2006).

  ## Verification provenance

  The published verification case is the complete sample-1 input and Saxton et
  al. output in Section 4.4 of the official USDA CalcPTF version 3.0 manual.
  CalcPTF is an authoritative secondary implementation, not the primary article.

  ## Documented limitations

  The original article reports the applicable texture region approximately as
  `5 <= sand <= 30` with `8 <= clay <= 58`, or `30 <= sand <= 95` with
  `5 <= clay <= 60`. The structured scalar domains preserve the enclosing ranges;
  the piecewise relationship and physical texture-sum constraint remain
  documentation because the schema has no cross-input domain expression.
