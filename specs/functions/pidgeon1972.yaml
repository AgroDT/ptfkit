source:
  summary: Pidgeon (1972), available-water regressions for ferrallitic soils in Uganda.
  citation_apa: Pidgeon, J. D. (1972). The measurement and prediction of available
    water capacity of ferrallitic soils in Uganda. *Journal of Soil Science*, *23*(4),
    431-441.
  doi: null
scope:
  territory: Non-alluvial ferrallitic soils in Uganda, predominantly kaolinitic and
    possibly illitic
  dataset: Ugandan profile samples; Entebbe alluvial and Nabbongo montmorillonitic
    soils were excluded from the adopted regressions.
