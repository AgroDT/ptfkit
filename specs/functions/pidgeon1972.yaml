source:
  summary: Pidgeon (1972), available-water regressions for ferrallitic soils in Uganda.
  citation_apa: Pidgeon, J. D. (1972). The measurement and prediction of available
    water capacity of ferrallitic soils in Uganda. *Journal of Soil Science*, *23*(4),
    431-441.
  doi: null
scope:
  territory: Non-alluvial ferrallitic soils in Uganda, predominantly kaolinitic and
    possibly illitic
  dataset: Ugandan profile samples; Entebbe alluvial and Nabbongo montmorillonitic
    soils were excluded from the adopted regressions.
functions:
- name: calc_ptf_pidgeon1972_fc
  status: implemented
  public_api:
    name: calc_ptf_pidgeon1972_fc
    result_class: null
    summary: Estimate gravimetric field capacity from silt, clay, and organic matter.
  scope:
    prediction_target: Gravimetric field capacity
    models:
      h_theta: Point estimate
      k_h: null
  inputs:
  - name: silt
    symbol: Silt2
    unit: '%'
    domain: null
    description: Silt measured by particle-size method 2.
  - name: clay
    symbol: Clay2
    unit: '%'
    domain: null
    description: Clay measured by particle-size method 2.
  - name: organic_matter
    symbol: OM
    unit: '%'
    domain: null
    description: Organic matter content.
  outputs:
    type: scalar
    name: field_capacity
    quantity: gravimetric_water_content
    symbol: FC
    unit: '% w/w'
    domain: null
    description: Gravimetric field capacity.
  verification_cases:
  - id: regression_case
    kind: calculated
    inputs:
      silt: 30.0
      clay: 20.0
      organic_matter: 2.0
    expected:
      field_capacity: 21.26
    rationale: Calculated from Table 3 using the reviewed 1.54 organic-matter coefficient.
  edge_cases: []
  documentation:
    notes:
    - The reviewed organic-matter coefficient is 1.54.
    warnings: []
  implementation:
    variables:
    - name: field_capacity
      expr: 7.38 + 0.16 * silt + 0.30 * clay + 1.54 * organic_matter
