scientific_notes: '

  # Pidgeon (1972)


  The particle-size suffixes below preserve the two explicitly different

  laboratory methods in the source: method 1 used ultrasonic dispersion, while

  method 2 used overnight sodium-hexametaphosphate dispersion.


  All functions use `f64`, do not round, and propagate NaN. The main

  field-capacity equation uses the reviewed Table 3 coefficient `1.54*OM`.

  The complete article citation was supplied during specification review.


  ## `calc_ptf_pidgeon1972_fc`


  ### Formula

  `FC = 7.38 + 0.16*Silt2 + 0.30*Clay2 + 1.54*OM`


  ## `calc_ptf_pidgeon1972_fc_sand`


  ### Formula

  `FC = 36.16 - 0.25*Sand2`


  ## `calc_ptf_pidgeon1972_fc_sand_organic_matter`


  ### Formula

  `FC = 34.27 - 0.27*Sand2 + 1.25*OM`


  ## `calc_ptf_pidgeon1972_fc_vol_sand_organic_matter`


  ### Formula

  `FCvol = 38.15 - 0.17*Sand2 + 0.77*OM`


  ## `calc_ptf_pidgeon1972_pwp`


  ### Formula

  `PWP = -4.19 + 0.19*Silt2 + 0.39*Clay2 + 0.90*OM`


  ## `calc_ptf_pidgeon1972_pwp_sand`


  ### Formula

  `PWP = 28.41 - 0.29*Sand1`


  ## `calc_ptf_pidgeon1972_pwp_sand_organic_matter`


  ### Formula

  `PWP = 32.90 - 0.37*Sand2 + 0.44*OM`


  ## `calc_ptf_pidgeon1972_awc`


  ### Formula

  `AWC = 169.3 - 1.50*Clay1 + 6.09*OM`


  ## `calc_ptf_pidgeon1972_awc_sand_organic_matter`


  ### Formula

  `AWC = 1.0 + 1.84*Sand2 + 8.12*OM`


  ## `calc_ptf_pidgeon1972_awc_coarse_sand`


  ### Formula

  `AWC = 68.5 + 2.33*CoarseSand1`


  ## `calc_ptf_pidgeon1972_awc_fine_sand`


  ### Formula

  `AWC = 66.7 + 2.66*FineSand1`


  ## `calc_ptf_pidgeon1972_awc_very_fine_sand`


  ### Formula

  `AWC = 66.9 + 4.58*VeryFineSand1`


  ## `calc_ptf_pidgeon1972_eawc`


  ### Formula

  `EAWC = 121.1 - 3.03*Silt2 - 1.38*Clay2 + 6.76*OM`


  ## `calc_ptf_pidgeon1972_eawc_sand`


  ### Formula

  `EAWC = -25.8 + 1.55*Sand2`


  ## `calc_ptf_pidgeon1972_eawc_sand_organic_matter`


  ### Formula

  `EAWC = -10.8 + 1.15*Sand1 + 4.78*OM`


  ## `calc_ptf_pidgeon1972_eawc_coarse_sand_organic_matter`


  ### Formula

  `EAWC = -7.4 + 2.37*CoarseSand1 + 6.86*OM`


  ## `calc_ptf_pidgeon1972_eawc_fine_sand_organic_matter`


  ### Formula

  `EAWC = -18.0 + 3.11*FineSand1 + 7.69*OM`

  '
