  status: implemented
  public_api:
    name: calc_ptf_pidgeon1972_fc
    result_class: null
    summary: Estimate gravimetric field capacity from silt, clay, and organic matter.
  scope:
    prediction_target: Gravimetric field capacity
    models:
      h_theta: Point estimate
      k_h: null
  inputs:
  - name: silt
    symbol: Silt2
    unit: '%'
    domain: null
    description: Silt measured by particle-size method 2.
  - name: clay
    symbol: Clay2
    unit: '%'
    domain: null
    description: Clay measured by particle-size method 2.
  - name: organic_matter
    symbol: OM
    unit: '%'
    domain: null
    description: Organic matter content.
  outputs:
    type: scalar
    name: field_capacity
    symbol: FC
    unit: '% w/w'
    domain: null
    description: Gravimetric field capacity.
  golden_tests:
  - id: regression_case
    inputs:
      silt: 30.0
      clay: 20.0
      organic_matter: 2.0
    expected:
      field_capacity: 21.26
    rtol: 1.0e-12
    atol: 1.0e-12
    notes: Calculated from Table 3 using the reviewed 1.54 organic-matter coefficient.
  edge_cases: []
  documentation:
    notes:
    - The reviewed organic-matter coefficient is 1.54.
