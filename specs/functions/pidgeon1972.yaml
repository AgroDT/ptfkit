scientific_notes: |
  # Pidgeon (1972)

  ## Review decisions

  Particle-size suffixes preserve the two laboratory methods in the source:
  method 1 used ultrasonic dispersion and method 2 used overnight
  sodium-hexametaphosphate dispersion. The main field-capacity model uses the
  reviewed Table 3 organic-matter coefficient of 1.54.
