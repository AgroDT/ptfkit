source:
  summary: Dijkerman (1988), texture-based gravimetric water retention for Sierra Leone soils.
  citation_apa: >-
    Dijkerman, J. C. (1988). An Ustult-Aquult-Tropept catena in Sierra Leone,
    West Africa, II. Land qualities and land evaluation. Geoderma, 42, 29-49.
  doi:
    identifier: 10.1016/0016-7061(88)90021-3
    url: https://doi.org/10.1016/0016-7061(88)90021-3
scope:
  territory: Sierra Leone, West Africa
  dataset: >-
    166 soil samples from 42 soil profiles reported by Odell et al. (1974).
    Samples with organic carbon greater than 4% were excluded from the regressions.
$defs:
  Sand:
    name: sand
    symbol: x_2
    unit: '%'
    domain: 0.5 <= sand <= 96.4
    description: >-
      Sand content by mass. The supplied research notes report this observed
      calibration range from a reconstruction of Odell et al. (1974), Appendix B.
  Clay:
    name: clay
    symbol: x_1
    unit: '%'
    domain: 1.3 <= clay <= 66.6
    description: >-
      Clay content by mass. The supplied research notes report this observed
      calibration range from a reconstruction of Odell et al. (1974), Appendix B.
functions:
  - name: calc_ptf_dijkerman1988
    status: ready-for-implementation
    public_api:
      name: calc_ptf_dijkerman1988
      result_class: Dijkerman1988WaterContent
      summary: Estimate gravimetric water contents at 15 bar and one-third bar from texture.
    scope:
      prediction_target: Gravimetric water contents at 15 bar and one-third bar.
      models:
        h_theta: null
        k_h: null
    inputs:
      - $ref: '#/$defs/Clay'
      - $ref: '#/$defs/Sand'
    outputs:
      type: record
      name: Dijkerman1988WaterContent
      fields:
        - name: water_content_15_bar
          quantity: gravimetric_water_content
          symbol: y_1
          unit: mass_percent
          reported_unit: '%'
          domain: null
          description: Gravimetric moisture content at 15 bar, in weight percentage.
        - name: water_content_one_third_bar
          quantity: gravimetric_water_content
          symbol: y_2
          unit: mass_percent
          reported_unit: '%'
          domain: null
          description: Gravimetric moisture content at one-third bar, in weight percentage.
    verification_cases:
      - id: veeneklaas_table_2_2_a
        kind: published
        inputs: {clay: 5.0, sand: 92.5}
        expected: {water_content_15_bar: 2.7, water_content_one_third_bar: 4.6}
        source_location: Veeneklaas et al. (1991), Table 2.2, row A, PDF page index 15; transcribed in supplied research notes.
        notes: Published g/kg outputs divided by 10 to obtain mass percent.
      - id: veeneklaas_table_2_2_b
        kind: published
        inputs: {clay: 12.5, sand: 77.5}
        expected: {water_content_15_bar: 5.6, water_content_one_third_bar: 9.8}
        source_location: Veeneklaas et al. (1991), Table 2.2, row B, PDF page index 15; transcribed in supplied research notes.
        notes: Published g/kg outputs divided by 10 to obtain mass percent.
      - id: veeneklaas_table_2_2_c
        kind: published
        inputs: {clay: 10.0, sand: 60.0}
        expected: {water_content_15_bar: 4.6, water_content_one_third_bar: 16.0}
        source_location: Veeneklaas et al. (1991), Table 2.2, row C, PDF page index 15; transcribed in supplied research notes.
        notes: Published g/kg outputs divided by 10 to obtain mass percent.
      - id: veeneklaas_table_2_2_d
        kind: published
        inputs: {clay: 27.5, sand: 62.5}
        expected: {water_content_15_bar: 11.5, water_content_one_third_bar: 15.1}
        source_location: Veeneklaas et al. (1991), Table 2.2, row D, PDF page index 15; transcribed in supplied research notes.
        notes: Published g/kg outputs divided by 10 to obtain mass percent.
      - id: veeneklaas_table_2_2_e
        kind: published
        inputs: {clay: 42.5, sand: 10.0}
        expected: {water_content_15_bar: 17.3, water_content_one_third_bar: 33.5}
        source_location: Veeneklaas et al. (1991), Table 2.2, row E, PDF page index 15; transcribed in supplied research notes.
        notes: Published g/kg outputs divided by 10 to obtain mass percent.
      - id: veeneklaas_table_2_2_f
        kind: published
        inputs: {clay: 32.5, sand: 32.5}
        expected: {water_content_15_bar: 13.4, water_content_one_third_bar: 25.6}
        source_location: Veeneklaas et al. (1991), Table 2.2, row F, PDF page index 15; transcribed in supplied research notes.
        notes: Published g/kg outputs divided by 10 to obtain mass percent.
      - id: veeneklaas_table_2_2_g
        kind: published
        inputs: {clay: 17.5, sand: 38.5}
        expected: {water_content_15_bar: 7.6, water_content_one_third_bar: 23.5}
        source_location: Veeneklaas et al. (1991), Table 2.2, row G, PDF page index 15; transcribed in supplied research notes.
        notes: Published g/kg outputs divided by 10 to obtain mass percent.
    edge_cases: []
    documentation:
      notes:
        - Sand, silt, and clay percentages must sum to 100; sand plus clay must not exceed 100.
        - The regression dataset excludes samples containing more than 4% organic carbon.
        - These are two point predictions, not a continuous retention curve.
      warnings:
        - The paper describes these relationships as rough guides.
        - One-third-bar moisture content may underestimate field capacity and available moisture in these soils.
        - The observed marginal calibration ranges do not establish validity for every joint texture combination.
    implementation:
      variables:
        - name: water_content_15_bar
          expr: 0.74 + 0.39 * clay
        - name: water_content_one_third_bar
          expr: 36.97 - 0.35 * sand
  - name: calc_ptf_dijkerman1988_available_water
    status: ready-for-implementation
    public_api:
      name: calc_ptf_dijkerman1988_available_water
      result_class: null
      summary: Estimate the gravimetric available moisture between one-third bar and 15 bar.
    scope:
      prediction_target: Gravimetric available moisture between one-third bar and 15 bar.
      models:
        h_theta: null
        k_h: null
    inputs:
      - $ref: '#/$defs/Clay'
      - name: silt
        symbol: silt
        unit: '%'
        domain: 0 <= silt <= 100; 0.5 <= 100 - clay - silt <= 96.4
        description: >-
          Silt content by mass; sand, silt, and clay sum to 100%.
          No separate observed silt calibration range is supplied.
    outputs:
      type: scalar
      name: available_water
      quantity: gravimetric_water_content
      symbol: y_2 - y_1
      unit: mass_percent
      reported_unit: '%'
      domain: null
      description: Difference in gravimetric moisture contents, in weight percentage points.
    verification_cases:
      - id: veeneklaas_c_texture_calculated
        kind: calculated
        inputs: {clay: 10.0, silt: 30.0}
        expected: {available_water: 11.33}
        rationale: >-
          Use the complete texture of Veeneklaas et al. (1991), Table 2.2,
          row C, as transcribed in the supplied notes: sand 60%, clay 10%,
          and the remaining 30% silt. This lies inside the reported calibration
          envelope and gives positive, ordered moisture contents. Reference
          arithmetic from the paper's combined equation gives
          1.23 - 0.04 * 10 + 0.35 * 30 = 11.33. This is a calculated value,
          not a published difference of the rounded table outputs.
    edge_cases: []
    documentation:
      notes:
        - This estimates a gravimetric difference, not profile water storage or a volumetric fraction.
        - Use soil material with organic carbon at most 4% and physically consistent texture percentages.
      warnings:
        - Available moisture estimated using one-third bar may be somewhat low according to the paper.
    implementation:
      variables:
        - name: available_water
          expr: 1.23 - 0.04 * clay + 0.35 * silt
scientific_notes: |
  ## Supported models

  The Soil moisture availability section and Figures 2 and 3 give the two
  regressions. The same section explicitly publishes their combined
  clay-and-silt equation for available moisture. The explained variation is
  92% for 15-bar moisture and 88% for one-third-bar moisture; these are model
  performance statistics, not implementation tolerances.

  ## Review decisions

  The supplied Markdown contains the article plus earlier research notes.
  Evidence attributed to those notes has been preserved as such; the cited
  PDF scans, OCR files, and review scripts were not rerun during extraction.
  The article explicitly states that the answer is in weight percentage.
  This takes precedence over the embedded image descriptions' erroneous
  volumetric labels. Figure 3's illustrative point list also disagrees with
  its equation; those approximate image-description points are not published
  verification pairs. The prose and figure equation agree on the coefficients.
  Pressure labels retain the article's bar notation; no bar-to-atmosphere or
  pressure-to-head conversion is introduced.

  The supplied notes transcribe seven complete numerical rows from Veeneklaas,
  F. R., Cisse, S., Gosseye, P. A., van Duivenbooden, N., & van Keulen, H.
  (1991), Competing for Limited Resources: The Case of the Fifth Region of
  Mali, Report 4: Development Scenarios (CABO-DLO/ESPR; ISBN 90-73384-13-3).
  Its equations on PDF page index 12 use the same coefficients, with g/kg
  outputs; Table 2.2 on PDF page index 15 supplies the verification values.
  The report does not name Dijkerman and is used only for numerical evidence,
  not attribution or calibration applicability. The table's one-g/kg
  rounding is covered by the existing mass-percent registry tolerance;
  no function-level override is introduced.

  The notes report reconstruction of Odell et al. (1974), Appendix B:
  44 profile tables contain 186 laboratory rows; removal of two Rokupr
  profiles without moisture measurements leaves 42 profiles and 181 rows.
  Seven incomplete rows and eight complete rows with organic carbon above
  4% are excluded, leaving 166 rows. Reported observed extrema are sand
  0.5% (S28666) to 96.4% (S28668), and clay 1.3% (S28668 and S28669) to
  66.6% (S29124). These marginal bounds are not general physical limits or
  a guarantee of predictive validity. No complete boundary predictor rows
  are supplied here, so marginal extrema are not combined into cases.

  ## Documented limitations

  The paper recommends bulk density, horizon thickness, rooting depth, and
  adjustments for material larger than 2 mm when estimating profile storage.
  No additional profile-storage function is extracted from this discussion.
  Table VII contains profile-level storage results rather than complete
  input-output examples for the retained texture regressions.

  Tables V and X concern effective rooting depth and waterlogging duration;
  they are land-evaluation relationships outside the retained moisture PTFs.
  Table X provides ranges and missing entries, not a scalar hydraulic lookup.
  Fertility classifications and growing-season calculations are also outside
  the retained PTF scope.

  ## Blockers

  None for the retained gravimetric moisture equations. Human review is
  required before the separate generation workflow.
