source:
  summary: Weber et al. (2020), compiled international soil hydraulic data.
  citation_apa: Weber, T. K. D., Finkel, M., da Conceicao Goncalves, M., Vereecken,
    H., & Diamantopoulos, E. (2020). Pedotransfer function for the Brunswick soil
    hydraulic property model and comparison to the van Genuchten-Mualem model. Water
    Resources Research, 56, e2019WR026820.
  doi:
    identifier: 10.1029/2019WR026820
    url: https://doi.org/10.1029/2019WR026820
scope:
  territory: Portuguese, German, UNSODA, and Vereecken soil data collections
  dataset: A compilation of 1,729 samples with water-retention and hydraulic-conductivity
    data; regression data set DS1 contained 392 of the 402 retained samples, DS2 was
    used for tau, DS3 contained 359 samples for K_snc, and 10 samples were held out
    as DS4.
functions:
- name: calc_ptf_weber2020
  status: implemented
  public_api:
    name: calc_ptf_weber2020
    result_class: Weber2020PTFResult
    summary: Convert VGM parameters to Brunswick-VGM parameters.
  scope:
    prediction_target: Seven Brunswick-VGM soil hydraulic model parameters from six
      VGM parameters.
    models:
      h_theta: Brunswick model with the van Genuchten capillary saturation function
      k_h: Brunswick capillary, noncapillary, and isothermal vapor conductivity model
  inputs:
  - name: theta_r_vgm
    symbol: theta_r,VGM
    unit: dimensionless
    domain: 0.001 <= value <= 0.35
    description: VGM residual volumetric water content.
  - name: theta_s_vgm
    symbol: theta_s,VGM
    unit: dimensionless
    domain: 0.2 <= value <= 0.7
    description: VGM saturated volumetric water content.
  - name: alpha_vgm
    symbol: alpha_VGM
    unit: cm^-1
    domain: 0.001 <= value <= 0.1
    description: VGM inverse pressure-head scale parameter.
  - name: n_vgm
    symbol: n_VGM
    unit: dimensionless
    domain: 1.1 <= value <= 11
    description: VGM pore-size distribution shape parameter.
  - name: tau_vgm
    symbol: tau_VGM
    unit: dimensionless
    domain: -2 <= value <= 10
    description: VGM hydraulic-conductivity shape parameter.
  - name: k_s_vgm
    symbol: K_s,VGM
    unit: cm d^-1
    domain: 1 <= value <= 1000
    description: VGM saturated hydraulic conductivity.
  outputs:
    type: record
    name: Weber2020PTFResult
    fields:
    - name: theta_snc_bw
      quantity: volumetric_water_content
      symbol: theta_snc,BW
      unit: dimensionless
      domain: null
      description: Saturated water content of the Brunswick noncapillary pore space.
    - name: theta_sc_bw
      quantity: volumetric_water_content
      symbol: theta_sc,BW
      unit: dimensionless
      domain: null
      description: Saturated water content of the Brunswick capillary pore space.
    - name: alpha_bw
      quantity: van_genuchten_alpha
      symbol: alpha_BW
      unit: cm^-1
      domain: null
      description: Brunswick-VGM inverse pressure-head scale parameter.
    - name: n_bw
      quantity: brunswick_n
      symbol: n_BW
      unit: dimensionless
      domain: null
      description: Brunswick-VGM pore-size distribution shape parameter.
    - name: tau_bw
      quantity: brunswick_tau
      symbol: tau_BW
      unit: dimensionless
      domain: null
      description: Brunswick capillary hydraulic-conductivity shape parameter.
    - name: k_sc_bw
      quantity: saturated_hydraulic_conductivity
      symbol: K_sc,BW
      unit: cm d^-1
      domain: null
      description: Saturated capillary hydraulic conductivity.
    - name: k_snc_bw
      quantity: saturated_hydraulic_conductivity
      symbol: K_snc,BW
      unit: cm d^-1
      domain: null
      description: Saturated noncapillary hydraulic conductivity.
  verification_cases:
  - id: representative_vgm_parameters
    kind: calculated
    inputs:
      theta_r_vgm: 0.05
      theta_s_vgm: 0.45
      alpha_vgm: 0.02
      n_vgm: 1.6
      tau_vgm: -0.5
      k_s_vgm: 100.0
    expected:
      theta_snc_bw: 0.06267
      theta_sc_bw: 0.38607
      alpha_bw: 0.0201472407335197
      n_bw: 1.71980542683289
      tau_bw: -0.887
      k_sc_bw: 172.186857498601
      k_snc_bw: 0.0190546071796325
    rationale: Calculated directly from the Table 3 regressions using the confirmed constrained-tau
      interpretation.
  edge_cases:
  - id: positive_tau_constraint
    inputs:
      tau_vgm: 1.0
    expected_behavior: The tau regression uses zero as its explanatory value and returns
      tau_bw = 0.0295.
    notes: The confirmed interpretation applies min(tau_vgm, 0) before the Table 3
      regression.
  documentation:
    notes:
    - Regression coefficients are the York-regression estimates in Table 3; parenthesized
      standard errors are not part of the prediction.
    - Input domains reproduce the parameter-estimation bounds in Table 1 and are not
      stated as a validated application domain.
    - The source recommends the median K_snc value as a provisional parsimonious estimate
      requiring further research.
    warnings:
    - The DS2 inequality is treated as a source typographical error; the tau regression
      is interpreted as being based on nonpositive tau_vgm values.
  implementation:
    variables:
    - name: theta_snc_bw
      expr: -1.58e-3 + 1.285 * theta_r_vgm
    - name: theta_s_bw
      expr: 1.89e-3 + 0.993 * theta_s_vgm
    - name: theta_sc_bw
      expr: theta_s_bw - theta_snc_bw
    - name: alpha_bw
      expr: 10.0 ^ (-2.06e-2 + 0.986 * log10(alpha_vgm))
    - name: n_bw
      expr: 1.0 + 10.0 ^ (6.42e-2 + 0.933 * log10(n_vgm - 1.0))
    - name: tau_vgm_constrained
      expr: min(tau_vgm, 0.0)
    - name: tau_bw
      expr: 2.95e-2 + 1.833 * tau_vgm_constrained
    - name: k_sc_bw
      expr: 10.0 ^ (1.16e-1 + 1.060 * log10(k_s_vgm))
    - name: k_snc_bw
      expr: 10.0 ^ -1.72
scientific_notes: |
  # Weber et al. (2020)

  ## Review decisions

  Table 3 reports York regressions. The text and Figure 8 identify total
  saturated water content as the sum of capillary and noncapillary components.
  Noncapillary conductivity uses the median reported in section 3.3.2.

  The source contains contradictory wording about the `tau` regression. Human
  review constrains the explanatory VGM parameter to nonpositive values before
  applying the printed regression; the DS2 statement that negative cases were
  removed is treated as a typographical error. The scientific rationale, the
  stated constraint, and the nonzero fitted slope support this interpretation.
  The operational source notation is
  `tau_vgm_constrained = min(tau_vgm, 0)` and
  `tau_bw = 2.95e-2 + 1.833 * tau_vgm_constrained`.

  ## Documented limitations

  The logarithmic regressions require positive `alpha_vgm`, `k_s_vgm`, and
  `n_vgm - 1`.

  ## Golden-test rationale

  The representative case uses values within the Table 1 parameter bounds. Its
  seven expected outputs are calculated directly from the Table 3 coefficients,
  the reported median noncapillary conductivity, and the confirmed constrained-
  `tau` interpretation.
