source:
  key: weber2020
  summary: Weber et al. (2020), compiled international soil hydraulic data.
  citation_apa: Weber, T. K. D., Finkel, M., da Conceicao Goncalves, M., Vereecken,
    H., & Diamantopoulos, E. (2020). Pedotransfer function for the Brunswick soil
    hydraulic property model and comparison to the van Genuchten-Mualem model. Water
    Resources Research, 56, e2019WR026820.
  doi:
    identifier: 10.1029/2019WR026820
    url: https://doi.org/10.1029/2019WR026820
scope:
  territory: Portuguese, German, UNSODA, and Vereecken soil data collections
  dataset: A compilation of 1,729 samples with water-retention and hydraulic-conductivity
    data; regression data set DS1 contained 392 of the 402 retained samples, DS2 was
    used for tau, DS3 contained 359 samples for K_snc, and 10 samples were held out
    as DS4.
functions:
- name: calc_ptf_weber2020
  status: implemented
  public_api:
    name: calc_ptf_weber2020
    result_class: Weber2020PTFResult
    summary: Convert VGM parameters to Brunswick-VGM parameters.
  scope:
    prediction_target: Seven Brunswick-VGM soil hydraulic model parameters from six
      VGM parameters.
    models:
      h_theta: Brunswick model with the van Genuchten capillary saturation function
      k_h: Brunswick capillary, noncapillary, and isothermal vapor conductivity model
  inputs:
  - name: theta_r_vgm
    symbol: theta_r,VGM
    unit: dimensionless
    domain: 0.001 <= value <= 0.35
    description: VGM residual volumetric water content.
  - name: theta_s_vgm
    symbol: theta_s,VGM
    unit: dimensionless
    domain: 0.2 <= value <= 0.7
    description: VGM saturated volumetric water content.
  - name: alpha_vgm
    symbol: alpha_VGM
    unit: cm^-1
    domain: 0.001 <= value <= 0.1
    description: VGM inverse pressure-head scale parameter.
  - name: n_vgm
    symbol: n_VGM
    unit: dimensionless
    domain: 1.1 <= value <= 11
    description: VGM pore-size distribution shape parameter.
  - name: tau_vgm
    symbol: tau_VGM
    unit: dimensionless
    domain: -2 <= value <= 10
    description: VGM hydraulic-conductivity shape parameter.
  - name: k_s_vgm
    symbol: K_s,VGM
    unit: cm d^-1
    domain: 1 <= value <= 1000
    description: VGM saturated hydraulic conductivity.
  outputs:
  - name: theta_snc_bw
    symbol: theta_snc,BW
    unit: dimensionless
    domain: null
    description: Saturated water content of the Brunswick noncapillary pore space.
  - name: theta_sc_bw
    symbol: theta_sc,BW
    unit: dimensionless
    domain: null
    description: Saturated water content of the Brunswick capillary pore space.
  - name: alpha_bw
    symbol: alpha_BW
    unit: cm^-1
    domain: null
    description: Brunswick-VGM inverse pressure-head scale parameter.
  - name: n_bw
    symbol: n_BW
    unit: dimensionless
    domain: null
    description: Brunswick-VGM pore-size distribution shape parameter.
  - name: tau_bw
    symbol: tau_BW
    unit: dimensionless
    domain: null
    description: Brunswick capillary hydraulic-conductivity shape parameter.
  - name: k_sc_bw
    symbol: K_sc,BW
    unit: cm d^-1
    domain: null
    description: Saturated capillary hydraulic conductivity.
  - name: k_snc_bw
    symbol: K_snc,BW
    unit: cm d^-1
    domain: null
    description: Saturated noncapillary hydraulic conductivity.
  golden_tests:
  - id: representative_vgm_parameters
    inputs:
      theta_r_vgm: 0.05
      theta_s_vgm: 0.45
      alpha_vgm: 0.02
      n_vgm: 1.6
      tau_vgm: -0.5
      k_s_vgm: 100.0
    expected:
      theta_snc_bw: 0.06267
      theta_sc_bw: 0.38607
      alpha_bw: 0.0201472407335197
      n_bw: 1.71980542683289
      tau_bw: -0.887
      k_sc_bw: 172.186857498601
      k_snc_bw: 0.0190546071796325
    rtol: 1.0e-12
    atol: 1.0e-12
    notes: Calculated directly from the Table 3 regressions using the confirmed constrained-tau
      interpretation.
  edge_cases:
  - id: positive_tau_constraint
    inputs:
      tau_vgm: 1.0
    expected_behavior: The tau regression uses zero as its explanatory value and returns
      tau_bw = 0.0295.
    notes: The confirmed interpretation applies min(tau_vgm, 0) before the Table 3
      regression.
  documentation:
    notes:
    - Regression coefficients are the York-regression estimates in Table 3; parenthesized
      standard errors are not part of the prediction.
    - Input domains reproduce the parameter-estimation bounds in Table 1 and are not
      stated as a validated application domain.
    - The source recommends the median K_snc value as a provisional parsimonious estimate
      requiring further research.
    warnings:
    - The DS2 inequality is treated as a source typographical error; the tau regression
      is interpreted as being based on nonpositive tau_vgm values.
scientific_notes: '

  # Weber et al. (2020)


  ## `calc_ptf_weber2020`


  ### Formula


  Table 3 reports York regressions in the form `y = intercept + slope * x`.

  The text and Figure 8 identify `theta_s,BW` as the total saturated water

  content `theta_sc,BW + theta_snc,BW`:


  ```text

  theta_snc_bw = -1.58e-3 + 1.285 * theta_r_vgm

  theta_s_bw = 1.89e-3 + 0.993 * theta_s_vgm

  theta_sc_bw = theta_s_bw - theta_snc_bw


  log10(alpha_bw) = -2.06e-2 + 0.986 * log10(alpha_vgm)

  log10(n_bw - 1) = 6.42e-2 + 0.933 * log10(n_vgm - 1)

  log10(k_sc_bw) = 1.16e-1 + 1.060 * log10(k_s_vgm)


  k_snc_bw = 10^(-1.72) cm d^-1

  ```


  Equivalently, the three log-space predictions are back-transformed as:


  ```text

  alpha_bw = 10^(-2.06e-2 + 0.986 * log10(alpha_vgm))

  n_bw = 1 + 10^(6.42e-2 + 0.933 * log10(n_vgm - 1))

  k_sc_bw = 10^(1.16e-1 + 1.060 * log10(k_s_vgm))

  ```


  The published `tau` coefficient row and confirmed nonpositive-input constraint

  give the operational formula:


  ```text

  tau_vgm_constrained = min(tau_vgm, 0)

  tau_bw = 2.95e-2 + 1.833 * tau_vgm_constrained

  ```


  The surrounding prose is read as constraining the explanatory VGM parameter

  before applying the Table 3 regression. Correspondingly, the DS2 statement

  that cases with `tau_vgm < 0` were removed is treated as a typographical error:

  the scientific rationale, the nonpositive constraint, and the nonzero fitted

  slope are mutually consistent only when positive cases were removed from the

  tau regression data.


  ### Constants


  All regression constants above are printed in Table 3. The noncapillary

  conductivity is the median reported in Section 3.3.2:

  `10^(-1.72) cm d^-1`.


  ### Numeric policy


  Use `f64` and the printed coefficient precision without rounding intermediate

  results. The logarithmic equations require `alpha_vgm > 0`, `n_vgm > 1`, and

  `k_s_vgm > 0`.


  ### Golden-test rationale


  The structured representative case uses values within the Table 1 parameter

  bounds. Its seven expected outputs are calculated directly from the printed

  Table 3 coefficients, the reported median `K_snc`, and the confirmed

  constrained-tau interpretation, without rounding intermediate results.


  ### Interpretation note


  The constrained-tau formula and corrected DS2 inequality above are the

  user-confirmed resolution of contradictory wording in the supplied source.

  '
