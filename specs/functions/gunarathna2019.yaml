source:
  summary: Point water-retention regressions for tropical Sri Lankan soils.
  citation_apa: >-
    Gunarathna, M. H. J. P., Sakai, K., Nakandakari, T., Momii, K.,
    Kumari, M. K. N., & Amarasekara, M. G. T. S. (2019).
    Pedotransfer functions to estimate hydraulic properties of tropical
    Sri Lankan soils. Soil & Tillage Research, 190, 109-119.
    https://doi.org/10.1016/j.still.2019.02.009
  doi:
    identifier: 10.1016/j.still.2019.02.009
    url: https://doi.org/10.1016/j.still.2019.02.009
scope:
  territory: Tropical Sri Lanka.
  dataset: >-
    323 soil horizons retained after removing samples with missing water-content
    data from the SRI-CANSOL survey of 110 profiles. The survey covers almost
    all soil series and land uses except the northern part of Sri Lanka.
    Models were evaluated using tenfold cross-validation.
$defs:
  sand:
    name: sand
    symbol: SA
    unit: "%"
    domain: "Table 1 observed range: 5.2 <= value <= 99.0"
    description: Sand percentage measured by sieve analysis.
  silt:
    name: silt
    symbol: SI
    unit: "%"
    domain: "Table 1 observed range: 0.0 <= value <= 38.6"
    description: Silt percentage measured by the pipette method.
  bulk_density:
    name: bulk_density
    symbol: BD
    unit: "g/cm3"
    domain: "Table 1 observed range: 1.0 <= value <= 2.0"
    description: Bulk density measured using undisturbed cores.
  organic_carbon:
    name: organic_carbon
    symbol: OC
    unit: "%"
    domain: "Table 1 observed range: 0.0 <= value <= 4.5"
    description: Organic carbon percentage measured by the Walkley-Black method.
functions:
  - name: calc_ptf_gunarathna2019_vwc10_set1
    status: implemented
    public_api:
      name: calc_ptf_gunarathna2019_vwc10_set1
      result_class: null
      summary: Estimate volumetric water content at -10 kPa using Set 1.
    scope:
      prediction_target: Volumetric water content at -10 kPa.
      models:
        h_theta: null
        k_h: null
    inputs:
      - $ref: "#/$defs/sand"
    outputs:
      type: scalar
      name: theta_10
      quantity: volumetric_water_content
      symbol: VWC10
      unit: volume_fraction
      reported_unit: mm/mm
      domain: null
      description: Volumetric water content at -10 kPa matric potential.
    verification_cases:
      - id: published_predictor_means
        kind: calculated
        inputs:
          sand: 65.1
        expected:
          theta_10: 0.23933
        rationale: >-
          Calculated from Table 3, VWC10, Set 1, using the required
          predictor means in Table 1. These are interior marginal means,
          not an observed individual soil or a published prediction pair.
          Sand 65.1% and silt 13.1% leave 21.8% clay for texture closure;
          the separately rounded published clay mean is 21.9%.
          Reference arithmetic directly substitutes the means into the
          printed regression, multiplying factors for squared terms.
          Across the extracted sets these inputs give positive water contents
          ordered theta_1500 < theta_33 < theta_10.
    edge_cases: []
    documentation:
      notes:
        - "Equation evidence: Table 3, VWC10, Set 1."
        - Input ranges describe the study observations, not enforced validity limits.
      warnings:
        - Predictions are empirical and are not clipped to physical bounds.
        - "Section 3.1 reports slight overprediction above 64% sand at this pressure."
    implementation:
      variables:
        - name: theta_10
          expr: 0.4802 - 0.0037 * sand
