scientific_notes: |
  ## Supported models

  Table 3 publishes eleven distinct regression equations, ordered here by
  pressure and then input set. Section 2 defines pressure-plate measurements
  at -10, -33, and -1500 kPa. Figure 6 labels volumetric water contents mm/mm.
  The approved mm/mm alias preserves their numerical volume-fraction scale.

  ## Review decisions

  Only predictors retained in each final Table 3 equation are exposed.
  Table 2 lists candidate and selected attributes before final regression;
  it does not require unused clay, bulk-density, or organic-carbon arguments.
  Table 2 explicitly identifies squared BD and OC attributes, supporting the
  interpretation of the flattened Table 3 tokens BD2 and OC2 as squares.

  The Set 2 VWC1500 row in Table 3 is empty, and Table 2 retains only sand for
  that combination. No additional equation is invented for that row.
  Section 2 excludes Set 5 from subsequent analysis because soil structure
  was not important. There is no categorical predictor in the retained models.

  Table 3 is the coefficient authority. Automated figure descriptions in the
  supplied Markdown contain discrepancies (including a VWC33 intercept of
  0.4358 and a positive VWC1500 sand slope); these are not used to replace
  the explicit regression table. The prefatory research note also reports
  a different VWC33 slope in a 2020 follow-up; that is a separate publication.

  The supplied bundle's older strict-golden audit is historical context.
  The current extraction policy permits calculated cases when no complete
  published input-prediction pair is supplied. Table 1 output means and
  approximate points in automated plot descriptions are not verification
  outputs. Calculated cases check arithmetic, not predictive accuracy.
  No performance statistic is used as an implementation tolerance.

  ## Documented limitations

  Section 3.1 describes applicability across Sri Lankan climatic zones and
  broad soil types, while the survey excludes the northern part of the country.
  The authors recommend using multiple inputs when available to reduce
  reliance on sand alone. Functional evaluation covers available water and
  maize irrigation scheduling; it is not an additional fitted PTF.

  ## Metadata

  The supplied text identifies the authors, year, title, journal and DOI.
  Volume 190 and pages 109-119 were confirmed against the publisher record:
  https://www.sciencedirect.com/science/article/abs/pii/S0167198718307360
