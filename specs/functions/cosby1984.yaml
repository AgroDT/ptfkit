source:
  summary: Cosby et al. (1984), United States.
  citation_apa: Cosby, B. J., Hornberger, G. M., Clapp, R. B., & Ginn, T. R. (1984).
    A statistical exploration of the relationships of soil moisture characteristics
    to the physical properties of soils. Water Resources Research, 20(6), 682-690.
  doi: null
scope:
  territory: United States
  dataset: 1448 soil samples from Holtan et al. (1968) and Rawls et al. (1976).
functions:
- name: calc_ptf_cosby1984_univariate
  status: ready-for-implementation
  public_api:
    name: calc_ptf_cosby1984_univariate
    result_class: Cosby1984UnivariatePTFResult
    summary: Estimate Cosby et al. (1984) univariate hydraulic parameter statistics
      from soil texture.
  scope:
    prediction_target: Mean and standard deviation estimates for hydraulic parameters
      from sand, silt, and clay percentages.
    models:
      h_theta: Power function moisture characteristic
      k_h: Saturated hydraulic conductivity parameter statistics
  inputs:
  - name: sand
    symbol: sand
    unit: '%'
    domain: 0 <= value <= 100
    description: Sand content.
  - name: silt
    symbol: silt
    unit: '%'
    domain: 0 <= value <= 100
    description: Silt content.
  - name: clay
    symbol: clay
    unit: '%'
    domain: 0 <= value <= 100
    description: Clay content.
  outputs:
  - name: mean_b
    symbol: b
    unit: dimensionless
    domain: null
    description: Mean slope of the moisture characteristic.
  - name: mean_log_psi_s
    symbol: log_psi_s
    unit: reported log value
    domain: null
    description: Mean log saturation matric potential; the underlying potential is
      expressed in cm H2O.
  - name: mean_log_k_sat
    symbol: log_k_sat
    unit: reported log value
    domain: null
    description: Mean log saturated hydraulic conductivity; the underlying conductivity
      is expressed in inches per hour.
  - name: mean_theta_s
    symbol: theta_s
    unit: '% volume/volume'
    domain: null
    description: Mean saturated water content.
  - name: sd_b
    symbol: b
    unit: dimensionless
    domain: null
    description: Standard deviation of b.
  - name: sd_log_k_sat
    symbol: log_k_sat
    unit: reported log value
    domain: null
    description: Standard deviation of log saturated hydraulic conductivity.
  - name: sd_theta_s
    symbol: theta_s
    unit: '% volume/volume'
    domain: null
    description: Standard deviation of saturated water content.
  golden_tests:
  - id: scalar_mid_texture
    inputs:
      sand: 50.0
      silt: 30.0
      clay: 20.0
    expected:
      mean_b: 6.09
      mean_log_psi_s: 1.225
      mean_log_k_sat: -0.119
      mean_theta_s: 42.6
      sd_b: 2.34
      sd_log_k_sat: 0.5553
      sd_theta_s: 6.27
    rtol: 1.0e-12
    atol: 1.0e-12
    notes: Calculated directly from Table 5 formulas for pilot testing.
  - id: scalar_sandy_texture
    inputs:
      sand: 80.0
      silt: 15.0
      clay: 5.0
    expected:
      mean_b: 3.705
      mean_log_psi_s: 0.832
      mean_log_k_sat: 0.34
      mean_theta_s: 38.82
      sd_b: 1.59
      sd_log_k_sat: 0.50715
      sd_theta_s: 7.365
    rtol: 1.0e-12
    atol: 1.0e-12
    notes: Calculated directly from Table 5 formulas for pilot testing.
  edge_cases:
  - id: nan_input
    inputs:
      sand: .nan
      silt: 30.0
      clay: 20.0
    expected_behavior: Propagate NaN in outputs that depend on sand.
    notes: Pilot policy.
  documentation:
    notes:
    - No back-transform is applied to logarithmic outputs.
    - Public API names are provisional for pilot testing.
    warnings:
    - Log-transformed output units use the pilot contract `reported log value`.
scientific_notes: '

  # Cosby et al. (1984)


  ## `calc_ptf_cosby1984_univariate`


  ### Formula


  Formulas extracted from Table 5.


  ```text

  mean_b = 2.91 + 0.159 * clay

  mean_log_psi_s = 1.88 - 0.0131 * sand

  mean_log_k_sat = -0.884 + 0.0153 * sand

  mean_theta_s = 48.9 - 0.126 * sand

  sd_b = 1.34 + 0.0500 * clay

  sd_log_k_sat = 0.459 + 0.00321 * silt

  sd_theta_s = 7.73 - 0.0730 * clay

  ```


  ### Excluded output


  `sd_log_psi_s` is excluded from this pilot because Table 5 reports no significant
  univariate regression.


  ### Numeric policy


  Use `f64`, do not round, propagate NaN, and retain NumPy-compatible domain behaviour.



  ### Remaining notes


  The DOI has not been established for this pilot specification.

  '
