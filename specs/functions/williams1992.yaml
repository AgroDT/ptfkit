scientific_notes: |
  ## Supported models

  - Equation 8 is `ln(theta) = A + B ln(h)`. Table 3 supplies eight
    regressions for `A` and `B`; the public functions evaluate the complete
    relation and return volumetric water content in percent for a positive
    water-potential magnitude in bar.
  - Table 5 publishes Campbell `b` and `h_e` values calculated with Function 7
    for six Northcote field-texture groups, both source structure levels, and a
    fixed bulk density of 1.4 g/cm^3.

  ## Review decisions

  - The International System fractions in Table 3 Note 3 are preserved:
    `C < 0.002 mm`, `SI 0.002-0.02 mm`, `FS 0.02-0.20 mm`, and
    `CS 0.20-2.0 mm`. The source does not state inclusivity at shared endpoints.
  - Function 6 literally prints `ln(C^2)`; the implementation therefore takes
    the natural logarithm after squaring clay, rather than squaring `ln(C)`.
  - Texture and structure are categorical public inputs. Source numeric codes
    are recovered internally through complete categorical decision trees.
  - Table 5 is represented as a separate categorical lookup because its
    published rows are a directly usable PTF distinct from evaluating Table 3.

  ## Documented limitations

  - The source warns that regression predictions fail outside their development
    domain but does not publish exact joint multivariate calibration bounds.
  - Function 6 fails for the high-clay, high-organic-matter British Fen soils;
    the paper reports organic matter exceeding 30 percent in those soils.
  - Predicted water contents showed little bias on several independent data
    sets, but precision was often inadequate for quantitative site-specific
    water-flow analysis. The authors recommend the approximations for broader
    planning and exploratory use.
