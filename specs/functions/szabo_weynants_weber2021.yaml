functions:
- name: calc_ptf_szabo2021_awc_2_ptf01
  status: implemented
  implementation:
    external_model:
      kind: euptf2
      artifact: ../models/euptf2/collection.json
      level: 1
  public_api:
    name: calc_ptf_szabo2021_awc_2_ptf01
    result_class: Euptf2Awc2Statistics
    summary: Predict AWC_2_PTF01 original-scale point estimates and five conditional quantiles.
  scope:
    prediction_target: Directly fitted available water content between -100 and -15000 cm.
    models:
      h_theta: null
      k_h: null
  inputs:
  - name: ussand
    symbol: null
    unit: '%'
    domain: null
    description: USDA sand, 50-2000 micrometres; mass percentage. No normalization, clipping or imputation.
  - name: ussilt
    symbol: null
    unit: '%'
    domain: null
    description: USDA silt, 2-50 micrometres; mass percentage. No normalization, clipping or imputation.
  - name: usclay
    symbol: null
    unit: '%'
    domain: null
    description: USDA clay, below 2 micrometres; mass percentage. No normalization, clipping or imputation.
  - name: depth_m
    symbol: null
    unit: cm
    domain: null
    description: Mean soil horizon depth in centimetres, despite the variable suffix. No normalization,
      clipping or imputation.
  outputs:
    $ref: '#/$defs/Euptf2Awc2Statistics'
  verification_cases:
  - id: original_sample_1
    kind: calculated
    inputs:
      ussand: 1.0
      ussilt: 53.0
      usclay: 46.0
      depth_m: 60.0
    expected:
      mean: 0.206020837964712
      q05: 0.09395
      q25: 0.13525
      q50: 0.2085
      q75: 0.232
      q95: 0.456
    source_location: Original euptf2 1.0.0 / ranger 0.18.0; specs/models/euptf2/references/AWC_2_PTF01.json
      cases[0].
    rationale: Independent execution of upstream euptf2::euptfFun; no ptfkit prediction or converted artifact
      is used by the oracle.
  documentation:
    notes:
    - Original object AWC_2_PTF01; artifact SHA-256 1ae1832bddc02221fc16a742ab716a7bfa635ea5d0c69d7861a2ea1a667dd9ad.
      Inputs follow the saved forest ordering. Predictions require an externally imported model with this
      identity. Missing required values reject a scalar row; upstream table orchestration removes incomplete
      rows and preserves OBS_ID. Defaults are 0.05, 0.25, 0.5, 0.75, 0.95. VG/MVG M appears in means only;
      no M quantile is invented.
