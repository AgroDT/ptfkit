source:
  summary: Original EU-PTF v2 hydraulic predictions with native QRF uncertainty and external artifacts.
  citation_apa: Szabó, B., Weynants, M., & Weber, T. K. D. (2021). Updated European hydraulic pedotransfer
    functions with communicated uncertainties in the predicted variables (euptfv2). Geoscientific Model
    Development, 14, 151-175.
  doi:
    identifier: 10.5194/gmd-14-151-2021
    url: https://doi.org/10.5194/gmd-14-151-2021
scope:
  territory: European soils represented by subsets of the EU-HYDI inventory; no extrapolation validation
    is asserted.
  dataset: Original trained EU-PTF v2 saved ranger objects; no retraining.
scientific_notes: 'Original predictor units and USDA particle sizes follow the paper and package sample_data
  documentation. FC_2 and FC denote -100 and -330 cm matric potential head respectively. KS and K0 use
  cm/day; ALP uses inverse cm. Fitted scales: KS/K0 log10, THR log10(THR+1), ALP log10, N log10(N-1);
  all others identity. Means are averaged before back-transform. Stored ranger terminal response samples
  support the exact upstream type-7 quantile algorithm. Parameters and quantiles are marginal; no joint
  parameter distribution or uncertainty for derived M is claimed. The 77 trained objects must not be confused
  with the package selection aliases for 32 predictor combinations. All artifacts remain external.'
$defs:
  Euptf2Awc2Statistics:
    type: record
    name: Euptf2Awc2Statistics
    fields:
    - name: mean
      quantity: available_water_capacity
      symbol: null
      unit: volume_fraction
      reported_unit: cm^3/cm^3
      domain: null
      description: 'AWC_2: original-scale point estimate. Ranger means are aggregated on the fitted scale
        before the original back-transform; M is derived only for means.'
    - name: q05
      quantity: available_water_capacity
      symbol: null
      unit: volume_fraction
      reported_unit: cm^3/cm^3
      domain: null
      description: 'AWC_2: conditional quantile at probability 0.05; type-7 interpolation of stored terminal
        response samples, then original back-transform.'
    - name: q25
      quantity: available_water_capacity
