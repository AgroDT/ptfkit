functions:
  - name: calc_ptf_wosten2001_class_parameters
    status: implemented
    public_api:
      name: calc_ptf_wosten2001_class_parameters
      result_class: Wosten2001ClassParameters
      summary: Return the six published hydraulic parameters for a Staring Series class.
    scope:
      prediction_target: >-
        Residual and saturated water content, saturated hydraulic conductivity,
        and alpha, l, and n for a source-defined Staring Series class.
      models:
        h_theta: van Genuchten model with m = 1 - 1 / n
        k_h: Mualem-van Genuchten hydraulic-conductivity model
    inputs:
      - name: soil_class
        description: Source class identifier used to select a Table 3 row.
