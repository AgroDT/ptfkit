  - name: calc_ptf_wosten2001_loam_clay_table5
    status: implemented
    public_api:
      name: calc_ptf_wosten2001_loam_clay_table5
      result_class: Wosten2001Table5Parameters
      summary: Evaluate the printed Table 5 regressions for mineral loam and clay soils.
    scope:
      prediction_target: >-
        Bulk density, saturated water content, saturated conductivity, and the
        alpha, l, and n parameters from the printed loam-and-clay regressions.
      models:
        h_theta: Table 5 parameter regressions for the van Genuchten model
        k_h: Table 5 parameter regressions for the Mualem-van Genuchten model
    inputs:
      - {name: clay, symbol: LUTUM, unit: "%", domain: "value > 0", description: Mass percentage of particles smaller than 2 micrometers.}
      - {name: organic_matter, symbol: HUMUS, unit: "%", domain: "value > 0", description: Soil organic-matter mass percentage.}
    outputs:
      $ref: "#/$defs/Wosten2001Table5Parameters"
    verification_cases:
      - id: interior_mineral_loam
        kind: calculated
        inputs: {clay: 20.0, organic_matter: 2.0}
        expected: {bulk_density: 1.4198586200084602, theta_s: 0.44529807370986707, saturated_conductivity: 55.79484942214282, alpha: 0.06962286410058446, conductivity_shape_parameter: -3.252787330870209, n: 1.1501521612949224}
        source_location: "Table 5 loam-and-clay equations"
        rationale: >-
          Uses positive interior mineral-soil inputs that satisfy every printed
          reciprocal and logarithmic precondition and calculates all outputs from
          the rounded Table 5 coefficients.
    edge_cases: []
    documentation:
      notes:
        - Positive clay and organic-matter inputs are required by reciprocal and natural-log terms.
      warnings:
        - The reciprocal-density expression must be positive before inversion.
        - >-
          These are the printed rounded Table 5 equations; they do not claim
          numerical parity with the unavailable Staringreeks 1.0 program.
        - The report does not publish the legacy program's applicability-warning thresholds.
    implementation:
      variables:
        - {name: organic_matter_squared, expr: "organic_matter ^ 2"}
        - {name: reciprocal_organic_matter, expr: "1 / organic_matter"}
        - {name: ln_clay, expr: "ln(clay)"}
        - {name: ln_organic_matter, expr: "ln(organic_matter)"}
        - name: reciprocal_density
          expr: 0.6117 + 0.003601 * clay + 0.002172 * organic_matter_squared + 0.01715 * ln_organic_matter
        - {name: bulk_density, expr: "1 / reciprocal_density"}
        - {name: bulk_density_squared, expr: "bulk_density ^ 2"}
        - {name: density_organic_matter, expr: "bulk_density * organic_matter"}
        - {name: density_clay, expr: "bulk_density * clay"}
        - {name: clay_organic_matter, expr: "clay * organic_matter"}
        - name: theta_s
          expr: 0.6311 + 0.003383 * clay - 0.09699 * bulk_density_squared - 0.00204 * density_clay
        - name: log_saturated_conductivity
          expr: -42.6 + 8.71 * organic_matter + 61.9 * bulk_density - 20.79 * bulk_density_squared - 0.2107 * organic_matter_squared - 0.01622 * clay_organic_matter - 5.382 * density_organic_matter
        - {name: saturated_conductivity, expr: "exp(log_saturated_conductivity)"}
        - name: log_alpha
          expr: -19.13 + 0.812 * organic_matter + 23.4 * bulk_density - 8.16 * bulk_density_squared + 0.423 * reciprocal_organic_matter + 2.388 * ln_organic_matter - 1.338 * density_organic_matter
        - {name: alpha, expr: "exp(log_alpha)"}
        - {name: transformed_l, expr: "0.102 + 0.0222 * clay - 0.043 * density_clay"}
        - {name: exp_transformed_l, expr: "exp(transformed_l)"}
        - {name: conductivity_shape_parameter, expr: "10 * (exp_transformed_l - 1) / (exp_transformed_l + 1)"}
        - name: log_n_minus_one
          expr: -0.235 + 0.972 * reciprocal_density - 0.7743 * ln_clay - 0.3154 * ln_organic_matter + 0.0678 * density_organic_matter
        - {name: n, expr: "1 + exp(log_n_minus_one)"}
scientific_notes: |
  ## Supported models

  - Table 3 publishes optimized `theta_r`, `theta_s`, `K_s`, `alpha`, `l`, and
    `n` values for 18 topsoil classes (`B1`-`B18`) and 18 subsoil classes
    (`O1`-`O18`). The class identifier is an explicit input; the texture and
    organic-matter ranges in Tables 1 and 2 are metadata, not an automatic
    classification rule.
  - The retention model uses `m = 1 - 1/n` and
    `Se = (1 + (alpha * |h|)^n)^(-m)`. Water content is
    `theta_r + (theta_s - theta_r) * Se`; conductivity is
    `K_s * Se^l * (1 - (1 - Se^(1/m))^m)^2`.
  - The continuous regressions are restricted to mineral soils and are printed
    separately for sandy soils and for loam/clay soils.

  ## Continuous-regression evidence

  These printed formulas define the normative Table 5 computational contracts.
  All logarithms are natural logarithms, and superscripts `-1` and `2` denote
  reciprocals and squares, respectively. Sandy topsoil and subsoil are separate
  public functions so the source indicator is fixed explicitly to 1 or 0.

  For sandy soils, Table 5 prints:

  - `theta_s = -35.7 - 0.1843*D - 0.03576*M50 + 0.0000261*M50^2 - 0.0564/LEEM + 0.008/HUMUS + 496.0/M50 + 0.02244*ln(HUMUS) + 7.56*ln(M50)`.
  - `K_s* = 45.8 - 14.34*D + 0.001481*LEEM^2 - 27.5/D - 0.891*ln(LEEM) - 0.34*ln(HUMUS)`.
  - `alpha* = 13.66 - 5.91*D - 0.172*BOVENGROND + 0.003248*M50 - 11.89/D - 2.121/LEEM - 0.3742*ln(LEEM)`.
  - `l* = -76.4 - 0.097*LEEM + 59.6*D + 0.0332*M50 - 13.45*D^2 + 0.001127*LEEM^2 + 0.00431*HUMUS^2 - 0.0000399*M50^2 + 40.8/D + 2.364/LEEM + 1.014*ln(LEEM)`.
  - `n* = -1.057 + 0.1003*HUMUS + 1.119*D + 0.000764*LEEM^2 - 0.1397/HUMUS - 57.2/M50 - 0.557*ln(HUMUS) - 0.02997*D*LEEM`.
  - `1/D = -7.58 + 0.01791*HUMUS + 0.0326*BOVENGROND - 0.00338*M50 + 0.00003937*LEEM^2 + 157.7/M50 + 1.522*ln(M50)`.

  For loam and clay soils, Table 5 prints:

  - `theta_s = 0.6311 + 0.003383*LUTUM - 0.09699*D^2 - 0.00204*D*LUTUM`.
  - `K_s* = -42.6 + 8.71*HUMUS + 61.9*D - 20.79*D^2 - 0.2107*HUMUS^2 - 0.01622*LUTUM*HUMUS - 5.382*D*HUMUS`.
  - `alpha* = -19.13 + 0.812*HUMUS + 23.4*D - 8.16*D^2 + 0.423/HUMUS + 2.388*ln(HUMUS) - 1.338*D*HUMUS`.
  - `l* = 0.102 + 0.0222*LUTUM - 0.043*D*LUTUM`.
  - `n* = -0.235 + 0.972/D - 0.7743*ln(LUTUM) - 0.3154*ln(HUMUS) + 0.0678*D*HUMUS`.
  - `1/D = 0.6117 + 0.003601*LUTUM + 0.002172*HUMUS^2 + 0.01715*ln(HUMUS)`.

  The printed transforms are `K_s* = ln(K_s)`, `alpha* = ln(alpha)`, and
  `n* = ln(n - 1)`. The inverse transforms are `K_s = exp(K_s*)`,
  `alpha = exp(alpha*)`, and `n = 1 + exp(n*)`. For sandy soils,
  `l = 2 * (exp(l*) - 1) / (exp(l*) + 1)`; for loam/clay soils,
  `l = 10 * (exp(l*) - 1) / (exp(l*) + 1)`.

  ## Review decisions

  - The evaluator accepts a nonnegative pressure-head magnitude because the report
    tabulates positive magnitudes while discussing negative pressure heads in prose.
  - Source class IDs are preserved exactly as public enum values. Lookup rows and
    verification inputs use their lower-snake-case schema member names.
  - Table 4 supplies rounded source-native checks. The B3 case at 100 cm is also
    independently evaluated at full precision to protect the computational formula.
  - The Table 5 result deliberately excludes `theta_r`: no `theta_r` equation is
    printed. The `0.010` shown in Figure 2 belongs to the distinct legacy-program
    display and is not inferred to be a general Table 5 rule.
  - The printed Table 5 equations are treated as their own versioned contract.
    They make no claim of numerical parity with the unavailable legacy program.

  ## Documented limitations

  - The sampling locations are concentrated where research projects occurred and
    are not regularly distributed across the Netherlands.
  - The report states that measured class ranges can be narrower than the defining
    class ranges, so class means may not be valid for samples outside measured ranges.
  - The analytical equations underestimate saturated conductivity for loam and clay
    classes where macropores and cracks are important.
  - Redistribution of the report or extracted table payloads remains subject to a
    separate rights review; this release consideration does not change the
    scientific extraction statuses.

  ## Legacy-program discrepancy

  - For the Figure 1 input, the original program display in Figure 2 reports
    `D=1.539`, `theta_s=0.458`, `K_s=39.78`, `alpha=0.0196`, `n=1.536`, and
    `l=2.000`. Direct evaluation of the rounded Table 5 coefficients instead gives
    approximately `D=1.54384`, `theta_s=0.44755`, `K_s=37.87743`,
    `alpha=0.019770`, `n=1.54190`, and `l=1.9999995`.
  - The inspected OBIC 4.3.0 implementation reproduces the rounded Table 5 path,
    not the original program display. The unavailable Staringreeks 1.0 artifact or
    another authoritative full-precision source would still be required for a
    separate legacy-program-parity implementation; it is not required to evaluate
    the explicitly named Table 5 contracts.
