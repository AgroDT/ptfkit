source:
  summary: Wösten et al. (2001), Staring Series hydraulic parameters for Dutch soils.
  citation_apa: >-
    Wösten, J. H. M., Veerman, G. J., de Groot, W. J. M., & Stolte, J. (2001).
    Waterretentie- en doorlatendheidskarakteristieken van boven- en ondergronden
    in Nederland: de Staringreeks; vernieuwde uitgave 2001. Alterra-rapport 153.
    Wageningen: Alterra.
  doi: null
scope:
  territory: Netherlands
  dataset: >-
    832 measured soil-horizon hydraulic characteristics used to define 18 topsoil
    and 18 subsoil classes and to fit continuous regressions for mineral soils.
$defs:
  Wosten2001SoilClass:
    type: enum
    description: >-
      One of the 36 source-defined Staring Series identifiers: B1-B18 for
      topsoils and O1-O18 for subsoils.
    values:
      - {name: b1, value: B1, description: "Topsoil: low-silt fine sand; 0-10% particles below 50 µm, 0-15% organic matter, M50 105-210 µm."}
      - {name: b2, value: B2, description: "Topsoil: weakly silty fine sand; 10-18% particles below 50 µm, 0-15% organic matter, M50 105-210 µm."}
      - {name: b3, value: B3, description: "Topsoil: strongly silty fine sand; 18-33% particles below 50 µm, 0-15% organic matter, M50 105-210 µm."}
      - {name: b4, value: B4, description: "Topsoil: very strongly silty fine sand; 33-50% particles below 50 µm, 0-15% organic matter, M50 105-210 µm."}
      - {name: b5, value: B5, description: "Topsoil: coarse sand; 0-15% organic matter and M50 210-2000 µm."}
      - {name: b6, value: B6, description: "Topsoil: glacial till; 0-50% particles below 50 µm, 0-15% organic matter, M50 50-2000 µm."}
      - {name: b7, value: B7, description: "Topsoil: very light loam; 8-12% clay and 0-15% organic matter."}
      - {name: b8, value: B8, description: "Topsoil: moderately light loam; 12-18% clay and 0-15% organic matter."}
      - {name: b9, value: B9, description: "Topsoil: heavy loam; 18-25% clay and 0-15% organic matter."}
      - {name: b10, value: B10, description: "Topsoil: light clay; 25-35% clay and 0-15% organic matter."}
      - {name: b11, value: B11, description: "Topsoil: moderately heavy clay; 35-50% clay and 0-15% organic matter."}
      - {name: b12, value: B12, description: "Topsoil: very heavy clay; 50-100% clay and 0-15% organic matter."}
      - {name: b13, value: B13, description: "Topsoil: sandy silt loam; 50-85% particles below 50 µm and 0-15% organic matter."}
      - {name: b14, value: B14, description: "Topsoil: silty loam; 85-100% particles below 50 µm and 0-15% organic matter."}
      - {name: b15, value: B15, description: "Topsoil: peaty sand; 0-8% clay and 15-25% organic matter."}
      - {name: b16, value: B16, description: "Topsoil: sandy peat and peat; 0-8% clay and 25-100% organic matter."}
      - {name: b17, value: B17, description: "Topsoil: peaty clay; 8-100% clay and 16-45% organic matter."}
      - {name: b18, value: B18, description: "Topsoil: clayey peat; 8-100% clay and 25-70% organic matter."}
      - {name: o1, value: O1, description: "Subsoil: low-silt fine sand; 0-10% particles below 50 µm, 0-3% organic matter, M50 105-210 µm."}
      - {name: o2, value: O2, description: "Subsoil: weakly silty fine sand; 10-18% particles below 50 µm, 0-3% organic matter, M50 105-210 µm."}
      - {name: o3, value: O3, description: "Subsoil: strongly silty fine sand; 18-33% particles below 50 µm, 0-3% organic matter, M50 105-210 µm."}
      - {name: o4, value: O4, description: "Subsoil: very strongly silty fine sand; 33-50% particles below 50 µm, 0-3% organic matter, M50 105-210 µm."}
      - {name: o5, value: O5, description: "Subsoil: coarse sand; 0-3% organic matter and M50 210-2000 µm."}
      - {name: o6, value: O6, description: "Subsoil: glacial till; 0-50% particles below 50 µm, 0-3% organic matter, M50 50-2000 µm."}
      - {name: o7, value: O7, description: "Subsoil: brook loam; 33-50% particles below 50 µm, 0-3% organic matter, M50 50-150 µm."}
      - {name: o8, value: O8, description: "Subsoil: very light loam; 8-12% clay and 0-3% organic matter."}
      - {name: o9, value: O9, description: "Subsoil: moderately light loam; 12-18% clay and 0-3% organic matter."}
      - {name: o10, value: O10, description: "Subsoil: heavy loam; 18-25% clay and 0-3% organic matter."}
      - {name: o11, value: O11, description: "Subsoil: light clay; 25-35% clay and 0-3% organic matter."}
      - {name: o12, value: O12, description: "Subsoil: moderately heavy clay; 35-50% clay and 0-3% organic matter."}
      - {name: o13, value: O13, description: "Subsoil: very heavy clay; 50-100% clay and 0-3% organic matter."}
      - {name: o14, value: O14, description: "Subsoil: sandy silt loam; 50-85% particles below 50 µm and 0-3% organic matter."}
      - {name: o15, value: O15, description: "Subsoil: silty loam; 85-100% particles below 50 µm and 0-3% organic matter."}
      - {name: o16, value: O16, description: "Subsoil: oligotrophic peat with 35-100% organic matter."}
      - {name: o17, value: O17, description: "Subsoil: mesotrophic or eutrophic peat with 35-100% organic matter."}
      - {name: o18, value: O18, description: "Subsoil: organic interlayer with 15-35% organic matter."}
  Wosten2001ClassParameters:
    type: record
    name: Wosten2001ClassParameters
    fields:
      - name: theta_r
        quantity: volumetric_water_content
        symbol: theta_r
        unit: volume_fraction
        reported_unit: cm³/cm³
        domain: 0 <= value <= 1
        description: Residual volumetric water content.
      - name: theta_s
        quantity: volumetric_water_content
        symbol: theta_s
        unit: volume_fraction
        reported_unit: cm³/cm³
        domain: 0 < value <= 1
        description: Saturated volumetric water content.
      - name: saturated_conductivity
        quantity: saturated_hydraulic_conductivity
        symbol: K_s
        unit: centimeter_per_day
        reported_unit: cm/day
        domain: value >= 0
        description: Saturated hydraulic conductivity.
      - name: alpha
        quantity: van_genuchten_alpha
        symbol: alpha
        unit: inverse_centimeter
        reported_unit: 1/cm
        domain: value > 0
        description: Inverse pressure-head scale of the van Genuchten model.
      - name: conductivity_shape_parameter
        quantity: conductivity_shape_parameter
        symbol: l
        unit: dimensionless
        reported_unit: dimensionless
        domain: null
        description: Mualem hydraulic-conductivity shape parameter.
      - name: n
        quantity: van_genuchten_n
        symbol: n
        unit: dimensionless
        reported_unit: dimensionless
        domain: value > 1
        description: van Genuchten pore-size distribution parameter.
  Wosten2001ClassParametersBySoilClass:
    type: lookup
    input:
      $ref: "#/$defs/Wosten2001SoilClass"
    output:
