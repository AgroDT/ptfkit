  - name: calc_ptf_wosten2001_hydraulic
    status: implemented
    public_api:
      name: calc_ptf_wosten2001_hydraulic
      result_class: Wosten2001HydraulicResult
      summary: Evaluate water content and conductivity from Staring Series parameters.
    scope:
      prediction_target: >-
        Volumetric water content and unsaturated hydraulic conductivity at a
        nonnegative pressure-head magnitude.
      models:
        h_theta: van Genuchten model with m = 1 - 1 / n
        k_h: Mualem-van Genuchten hydraulic-conductivity model
    inputs:
      - {name: theta_r, symbol: theta_r, unit: cm³/cm³, domain: "0 <= value < theta_s", description: Residual volumetric water content.}
      - {name: theta_s, symbol: theta_s, unit: cm³/cm³, domain: "theta_r < value <= 1", description: Saturated volumetric water content.}
      - {name: saturated_conductivity, symbol: K_s, unit: cm/day, domain: "value >= 0", description: Saturated hydraulic conductivity.}
      - {name: alpha, symbol: alpha, unit: 1/cm, domain: "value > 0", description: van Genuchten inverse pressure-head scale.}
      - {name: conductivity_shape_parameter, symbol: l, unit: dimensionless, domain: null, description: Mualem hydraulic-conductivity shape parameter.}
      - {name: n, symbol: n, unit: dimensionless, domain: "value > 1", description: van Genuchten pore-size distribution parameter.}
      - name: pressure_head_magnitude
        symbol: "|h|"
        unit: cm
        domain: value >= 0
        description: >-
          Nonnegative magnitude of pressure head; callers must convert any
          signed-negative convention explicitly before calling.
    outputs:
      type: record
      name: Wosten2001HydraulicResult
      fields:
        - name: water_content
          quantity: volumetric_water_content
          symbol: theta
          unit: volume_fraction
          reported_unit: cm³/cm³
          domain: theta_r <= value <= theta_s
          description: Volumetric water content at the supplied pressure-head magnitude.
        - name: conductivity
          quantity: unsaturated_hydraulic_conductivity
          symbol: K
          unit: centimeter_per_day
          reported_unit: cm/day
          domain: value >= 0
          description: Hydraulic conductivity at the supplied pressure-head magnitude.
    verification_tolerances:
      conductivity:
        absolute: 0.005
        relative: 0.01
        source_location: "Table 4, conductivity values reported to displayed precision"
    verification_cases:
      - id: table_4_b1_topsoil_mineral_h100
        kind: published
        inputs: {theta_r: 0.02, theta_s: 0.43, saturated_conductivity: 23.41, alpha: 0.0234, conductivity_shape_parameter: 0.000, n: 1.801, pressure_head_magnitude: 100}
        expected: {water_content: 0.210, conductivity: 0.16}
        source_location: "Tables 3 and 4, B1 at h = 100 cm"
        notes: Published rounded values for a mineral topsoil class.
      - id: table_4_o1_subsoil_mineral_h100
        kind: published
        inputs: {theta_r: 0.01, theta_s: 0.36, saturated_conductivity: 15.22, alpha: 0.0224, conductivity_shape_parameter: 0.000, n: 2.286, pressure_head_magnitude: 100}
        expected: {water_content: 0.124, conductivity: 0.096}
        source_location: "Tables 3 and 4, O1 at h = 100 cm"
        notes: Published rounded values for a mineral subsoil class.
      - id: table_4_b16_topsoil_organic_h100
        kind: published
        inputs: {theta_r: 0.01, theta_s: 0.80, saturated_conductivity: 6.79, alpha: 0.0176, conductivity_shape_parameter: -2.259, n: 1.293, pressure_head_magnitude: 100}
        expected: {water_content: 0.622, conductivity: 0.088}
        source_location: "Tables 3 and 4, B16 at h = 100 cm"
        notes: Published rounded values for an organic topsoil class.
      - id: table_4_o18_subsoil_organic_h100
        kind: published
        inputs: {theta_r: 0.01, theta_s: 0.57, saturated_conductivity: 34.45, alpha: 0.0138, conductivity_shape_parameter: -1.204, n: 1.323, pressure_head_magnitude: 100}
        expected: {water_content: 0.456, conductivity: 0.60}
        source_location: "Tables 3 and 4, O18 at h = 100 cm"
        notes: Published rounded values for an organic subsoil class.
      - id: b3_h100_full_precision
        kind: calculated
        inputs: {theta_r: 0.02, theta_s: 0.46, saturated_conductivity: 15.42, alpha: 0.0144, conductivity_shape_parameter: -0.215, n: 1.534, pressure_head_magnitude: 100}
        expected: {water_content: 0.3294148460516339, conductivity: 0.3526692308873073}
        source_location: "Table 3, B3 row; Table 4, B3 at h = 100 cm"
        rationale: >-
          Independently calculated at an interior tabulated pressure head from
          the published B3 parameters; Table 4 prints 0.329 and 3.5E-1.
    edge_cases:
      - id: saturation_limit
        inputs: {theta_r: 0.02, theta_s: 0.46, saturated_conductivity: 15.42, alpha: 0.0144, conductivity_shape_parameter: -0.215, n: 1.534, pressure_head_magnitude: 0}
        expected_behavior: Returns theta_s and saturated_conductivity.
        notes: Direct limit of the published equations at zero pressure-head magnitude.
    documentation:
      notes:
        - Pressure head is accepted as a nonnegative magnitude to make the sign convention explicit.
      warnings:
        - Parameters must belong to one internally consistent van Genuchten-Mualem parameter set.
    implementation:
      variables:
        - name: m
          expr: 1 - 1 / n
        - name: pressure_term
          expr: (alpha * pressure_head_magnitude) ^ n
        - name: effective_saturation
          expr: (1 + pressure_term) ^ (-m)
        - name: water_content
          expr: theta_r + (theta_s - theta_r) * effective_saturation
        - name: conductivity
          expr: saturated_conductivity * effective_saturation ^ conductivity_shape_parameter * (1 - (1 - effective_saturation ^ (1 / m)) ^ m) ^ 2

  - name: calc_ptf_wosten2001_sand_topsoil_table5
    status: implemented
    public_api:
      name: calc_ptf_wosten2001_sand_topsoil_table5
      result_class: Wosten2001Table5Parameters
      summary: Evaluate the printed Table 5 regressions for mineral sandy topsoils.
    scope:
      prediction_target: >-
        Bulk density, saturated water content, saturated conductivity, and the
        alpha, l, and n parameters from the printed sandy-topsoil regressions.
      models:
        h_theta: Table 5 parameter regressions for the van Genuchten model
        k_h: Table 5 parameter regressions for the Mualem-van Genuchten model
    inputs:
      - {name: silt, symbol: LEEM, unit: "%", domain: "value > 0", description: Mass percentage of particles smaller than 50 micrometers.}
      - {name: organic_matter, symbol: HUMUS, unit: "%", domain: "value > 0", description: Soil organic-matter mass percentage.}
      - {name: median_sand_size, symbol: M50, unit: µm, domain: "value > 0", description: Median particle size of the sand fraction.}
    outputs:
      $ref: "#/$defs/Wosten2001Table5Parameters"
    verification_cases:
      - id: figure_1_predictors_as_topsoil
        kind: calculated
        inputs: {silt: 24.0, organic_matter: 2.0, median_sand_size: 160.0}
        expected: {bulk_density: 1.469860509980007, theta_s: 0.4611829739101765, saturated_conductivity: 44.64230473213631, alpha: 0.017492180519232788, conductivity_shape_parameter: 1.999999478489978, n: 1.5261145383023824}
        source_location: "Table 5 sandy-soil equations; Figure 1 predictor values"
        rationale: >-
          Uses the complete positive predictor row printed in Figure 1 with the
          source topsoil indicator set to 1 and calculates every output directly
          from the rounded Table 5 coefficients.
    edge_cases: []
    documentation:
      notes:
        - This function fixes the source-defined BOVENGROND indicator to 1.
        - Positive inputs are required by the reciprocal and natural-log terms.
      warnings:
        - The reciprocal-density expression must be positive before inversion.
        - >-
          These are the printed rounded Table 5 equations; they do not claim
          numerical parity with the unavailable Staringreeks 1.0 program.
        - The report does not publish the legacy program's applicability-warning thresholds.
    implementation:
      variables:
        - {name: topsoil_indicator, expr: "1"}
        - {name: silt_squared, expr: "silt ^ 2"}
        - {name: organic_matter_squared, expr: "organic_matter ^ 2"}
        - {name: median_sand_size_squared, expr: "median_sand_size ^ 2"}
        - {name: reciprocal_silt, expr: "1 / silt"}
        - {name: reciprocal_organic_matter, expr: "1 / organic_matter"}
        - {name: reciprocal_median_sand_size, expr: "1 / median_sand_size"}
        - {name: ln_silt, expr: "ln(silt)"}
        - {name: ln_organic_matter, expr: "ln(organic_matter)"}
        - {name: ln_median_sand_size, expr: "ln(median_sand_size)"}
        - name: reciprocal_density
          expr: -7.58 + 0.01791 * organic_matter + 0.0326 * topsoil_indicator - 0.00338 * median_sand_size + 0.00003937 * silt_squared + 157.7 * reciprocal_median_sand_size + 1.522 * ln_median_sand_size
        - {name: bulk_density, expr: "1 / reciprocal_density"}
        - {name: bulk_density_squared, expr: "bulk_density ^ 2"}
        - name: theta_s
          expr: -35.7 - 0.1843 * bulk_density - 0.03576 * median_sand_size + 0.0000261 * median_sand_size_squared - 0.0564 * reciprocal_silt + 0.008 * reciprocal_organic_matter + 496.0 * reciprocal_median_sand_size + 0.02244 * ln_organic_matter + 7.56 * ln_median_sand_size
        - name: log_saturated_conductivity
          expr: 45.8 - 14.34 * bulk_density + 0.001481 * silt_squared - 27.5 * reciprocal_density - 0.891 * ln_silt - 0.34 * ln_organic_matter
        - {name: saturated_conductivity, expr: "exp(log_saturated_conductivity)"}
        - name: log_alpha
          expr: 13.66 - 5.91 * bulk_density - 0.172 * topsoil_indicator + 0.003248 * median_sand_size - 11.89 * reciprocal_density - 2.121 * reciprocal_silt - 0.3742 * ln_silt
        - {name: alpha, expr: "exp(log_alpha)"}
        - name: transformed_l
          expr: -76.4 - 0.097 * silt + 59.6 * bulk_density + 0.0332 * median_sand_size - 13.45 * bulk_density_squared + 0.001127 * silt_squared + 0.00431 * organic_matter_squared - 0.0000399 * median_sand_size_squared + 40.8 * reciprocal_density + 2.364 * reciprocal_silt + 1.014 * ln_silt
        - {name: exp_transformed_l, expr: "exp(transformed_l)"}
        - {name: conductivity_shape_parameter, expr: "2 * (exp_transformed_l - 1) / (exp_transformed_l + 1)"}
        - name: log_n_minus_one
          expr: -1.057 + 0.1003 * organic_matter + 1.119 * bulk_density + 0.000764 * silt_squared - 0.1397 * reciprocal_organic_matter - 57.2 * reciprocal_median_sand_size - 0.557 * ln_organic_matter - 0.02997 * bulk_density * silt
        - {name: n, expr: "1 + exp(log_n_minus_one)"}

