source:
  summary: Aimrun & Amin (2009), Tanjung Karang Rice Irrigation Project, Malaysia.
  citation_apa: Aimrun, W., & Amin, M. S. M. (2009). Pedo-transfer function for saturated
    hydraulic conductivity of lowland paddy soils. Paddy and Water Environment, 7,
    217-225.
  doi:
    identifier: 10.1007/s10333-009-0165-y
    url: https://doi.org/10.1007/s10333-009-0165-y
scope:
  territory: Tanjung Karang Rice Irrigation Project, located on a flat coastal plain
    in the Integrated Agricultural Development Area (IADA Barat Laut Selangor), Malaysia
  dataset: 408 lowland paddy soil samples from Sawah Sempadan rice cultivation area.
functions:
- name: calc_ptf_aimrun2009
  status: implemented
  public_api:
    name: calc_ptf_aimrun2009
    result_class: null
    summary: Estimate saturated hydraulic conductivity for lowland paddy soils.
  scope:
    prediction_target: Saturated hydraulic conductivity from clay, dry bulk density,
      organic matter, and geometric mean diameter.
    models:
      h_theta: null
      k_h: Saturated hydraulic conductivity
  inputs:
  - name: clay
    symbol: C
    unit: '%'
    domain: value > 0
    description: Clay content, <2 um.
  - name: bulk_density
    symbol: Db
    unit: g/cm^3
    domain: value > 0
    description: Dry bulk density.
  - name: organic_matter
    symbol: OM
    unit: '%'
    domain: value > 0
    description: Organic matter content.
  - name: gmd
    symbol: GMD
    unit: mm
    domain: value > 0
    description: Geometric mean diameter of texture.
  outputs:
    type: scalar
    name: k_sat
    symbol: Ks
    unit: m/s
    domain: value >= 0
    description: Saturated hydraulic conductivity.
  golden_tests:
  - id: mean_topsoil_layer
    inputs:
      clay: 43.88
      bulk_density: 0.94
      organic_matter: 12.07
      gmd: 0.01
    expected:
      k_sat: 7.358406556179513e-08
    rtol: 1.0e-08
    atol: 1.0e-12
    notes: Calculated from equation (10) and unit conversion.
  - id: mean_hardpan_layer
    inputs:
      clay: 50.21
      bulk_density: 1.19
      organic_matter: 8.55
      gmd: 0.007
    expected:
      k_sat: 3.07872446717209e-08
    rtol: 1.0e-08
    atol: 1.0e-12
    notes: Calculated from equation (10) and unit conversion.
  - id: mean_subsoil_layer
    inputs:
      clay: 58.81
      bulk_density: 1.13
      organic_matter: 5.12
      gmd: 0.005
    expected:
      k_sat: 2.3343051908963327e-08
    rtol: 1.0e-08
    atol: 1.0e-12
    notes: Calculated from equation (10) and unit conversion.
  - id: min_organic_matter
    inputs:
      clay: 47.5
      bulk_density: 1.08
      organic_matter: 1.43
      gmd: 0.008
    expected:
      k_sat: 3.831168764444974e-08
    rtol: 1.0e-08
    atol: 1.0e-12
    notes: Calculated from equation (10) and unit conversion.
  edge_cases:
  - id: non_positive_log_input
    inputs:
      clay: 0.0
      bulk_density: 1.0
      organic_matter: 1.0
      gmd: 0.01
    expected_behavior: NumPy-compatible logarithm-domain behaviour.
    notes: Formula uses natural logarithms of all inputs.
  documentation:
    notes:
    - Sand and silt are not inputs to the selected final model.
    - 'Applicability: Clayey rice soils with compacted subsoil.'
    warnings:
    - The formula uses natural logarithms of all inputs.
  implementation:
    variables:
    - name: ln_k_sat_m_per_day
      expr: -2.368 + 3.846 * bulk_density + 0.091 * organic_matter - 6.203 * ln(bulk_density) - 0.343 * ln(organic_matter) - 2.334 * ln(clay) - 0.411 * ln(gmd)
    - name: k_sat_m_per_day
      expr: exp(ln_k_sat_m_per_day)
    - name: k_sat
      expr: k_sat_m_per_day * (1.0 / 86400.0)
scientific_notes: |
  # Aimrun and Amin (2009)

  ## Supported model

  The implementation is equation 10. Its saturated hydraulic conductivity is
  reported in m/day and converted to the public m/s unit.
