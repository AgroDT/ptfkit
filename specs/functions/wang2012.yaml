source:
  summary: Wang et al. (2012), surface loess across China's Loess Plateau.
  citation_apa: Wang, Y. Q., Shao, M. A., & Liu, Z. P. (2012). Pedotransfer functions
    for predicting soil hydraulic properties of the Chinese Loess Plateau. Soil Science,
    177, 424-432.
  doi:
    identifier: 10.1097/SS.0b013e318255a449
    url: https://doi.org/10.1097/SS.0b013e318255a449
scope:
  territory: Surface soils across the entire Loess Plateau, China
  dataset: 382 surface (0-5 cm) sites; 252 derivation and 130 validation data sets.
functions:
- name: calc_ptf_wang2012
  status: implemented
  public_api:
    name: calc_ptf_wang2012
    result_class: Wang2012PTFResult
    summary: Estimate saturated water content, field capacity, and saturated conductivity.
  scope:
    prediction_target: Saturated soil-water content, water content at -33 kPa, and
      saturated hydraulic conductivity.
    models:
      h_theta: Point estimates at saturation and -33 kPa
      k_h: Saturated hydraulic conductivity
  inputs:
  - name: sand
    symbol: Sand
    unit: '%'
    domain: 0.8 <= value <= 92.0
    description: Sand content, 0.05-1 mm.
  - name: silt
    symbol: Silt
    unit: '%'
    domain: 6.3 <= value <= 84.7
    description: Silt content, 0.002-0.05 mm.
  - name: clay
    symbol: Clay
    unit: '%'
    domain: 0.4 <= value <= 35.8
    description: Clay content, <0.002 mm.
  - name: bulk_density
    symbol: BD
    unit: g/cm^3
    domain: 1.04 <= value <= 1.82
    description: Bulk density.
  - name: soil_organic_carbon
    symbol: SOC
    unit: '%'
    domain: 0.033 <= value <= 3.369
    description: Soil organic carbon exposed by the public API as percent by mass.
  - name: altitude
    symbol: Altitude
    unit: m
    domain: 99 <= value <= 2835
    description: Altitude above sea level.
  outputs:
    type: record
    fields:
    - name: theta_s
      symbol: SSWC
      unit: cm^3/cm^3
      domain: value >= 0
      description: Saturated volumetric water content normalized from the regression's
        volume-percent scale.
    - name: theta_fc
      symbol: FC
      unit: cm^3/cm^3
      domain: value >= 0
      description: Volumetric water content at -33 kPa normalized from the regression's
        volume-percent scale.
    - name: k_sat
      symbol: Ks
      unit: m/s
      domain: value >= 0
      description: Saturated hydraulic conductivity converted from cm/day.
  golden_tests:
  - id: derivation_minimum_soc_case
    inputs:
      sand: 85.0
      silt: 10.0
      clay: 5.0
      bulk_density: 1.22
      soil_organic_carbon: 0.033
      altitude: 1193.0
    expected:
      theta_s: 0.61540575
      theta_fc: 0.38491949
      k_sat: 3.872974e-05
    rtol: 1.0e-06
    atol: 1.0e-12
    notes: Calculated from Table 6, converting SOC percent to g/kg and water-content
      percentage points to volumetric fractions.
  edge_cases:
  - id: non_positive_log_or_reciprocal_input
    inputs:
      sand: 0.0
      silt: 0.0
      clay: 0.0
      bulk_density: 1.22
      soil_organic_carbon: 0.0
      altitude: 1193.0
    expected_behavior: NumPy-compatible logarithm-domain and division-by-zero behaviour.
    notes: The equations use logarithms and reciprocals of sand, silt, clay, and SOC.
  documentation:
    notes:
    - The regression uses source SOC in g/kg; the public API accepts percent.
    - Base-10 logarithms reproduce the source's raw and transformed Ks ranges.
    - Water-content equations are evaluated in percentage points and divided by 100
      for public volumetric fractions.
    warnings:
    - This normalization intentionally changes the legacy water-content outputs by
      a factor of 100.
  implementation:
    variables:
    - name: soil_organic_carbon_g_per_kg
      expr: 10.0 * soil_organic_carbon
    - name: log10_k_sat_cm_per_day
      expr: 1.173 + 0.038 * silt + 0.690 * log10(sand) + 0.865 / sand - 0.030 * bulk_density * silt - 0.00000995 * soil_organic_carbon_g_per_kg * altitude
    - name: k_sat_cm_per_day
      expr: 10.0 ^ log10_k_sat_cm_per_day
    - name: fc_percent
      expr: 46.481 - 4.757 * soil_organic_carbon_g_per_kg - 14.028 * log10(clay) - 13.991 * log10(sand) + 42.261 * log10(soil_organic_carbon_g_per_kg) - 11.763 / sand + 19.198 / soil_organic_carbon_g_per_kg - 5.448 * bulk_density ^ 2 + 0.044 * soil_organic_carbon_g_per_kg ^ 2 + 1.975 * bulk_density * soil_organic_carbon_g_per_kg
    - name: sswc_percent
      expr: 98.813 - 21.555 / bulk_density - 39.735 / silt - 2.091 / sand + 3.247 / soil_organic_carbon_g_per_kg - 17.096 * bulk_density ^ 2
    - name: theta_s
      expr: sswc_percent / 100.0
    - name: theta_fc
      expr: fc_percent / 100.0
    - name: k_sat
      expr: k_sat_cm_per_day / 8640000.0
scientific_notes: |
  # Wang et al. (2012)

  ## Review decisions

  Table 6 supplies the regressions. Table 3 confirms that the reported
  logarithms are base 10: 0.61-1672.56 cm/day transforms to the reported
  -0.22-3.22 range. Although FC and SSWC are labelled cm^3/cm^3, the article
  models and reports them as percentage points: 2.39-36.82 for FC and
  32.81-67.12 for SSWC. Their predictions are divided by 100 for public
  volumetric-fraction outputs.
