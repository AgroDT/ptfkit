source:
  summary: "Kalumba et al. (2021) PTFs for Zambezi River Basin soil hydraulic properties."
  citation_apa: "Kalumba, M., Bamps, B., Nyambe, I., Dondeyne, S., & Van Orshoven, J. (2021). Development and functional evaluation of pedotransfer functions for soil hydraulic properties for the Zambezi River Basin. European Journal of Soil Science, 72(4), 1559-1574."
  doi:
    identifier: 10.1111/ejss.13077
    url: https://doi.org/10.1111/ejss.13077
scope:
  territory: "Zambezi River Basin, with field measurements from the Upper Mulungushi sub-basin."
  dataset: "631 soil samples: 329 Africa Soil Profiles observations and 302 Upper Mulungushi observations; target-specific sample availability is documented below."
$defs:
  depth:
    name: depth
    symbol: Dep
    unit: "cm"
    domain: "6 <= value <= 217"
    description: "Depth of the upper and lower boundary of the sampled horizon or layer."
  elevation:
    name: elevation
    symbol: ELE
    unit: "m"
    domain: "81 <= value <= 1924"
    description: "Topographic elevation of the soil profile site."
  sand:
    name: sand
    symbol: SAND
    unit: "fraction"
    domain: "0.032 <= value <= 0.973"
    description: "Sand fraction used as a PTF input."
  clay:
    name: clay
    symbol: CLAY
    unit: "fraction"
    domain: "0.015 <= value <= 0.843"
    description: "Clay fraction used as a PTF input."
  silt:
    name: silt
    symbol: SILT
    unit: "fraction"
    domain: "0.047 <= value <= 0.786"
    description: "Silt fraction used as a PTF input."
  stoniness:
    name: stoniness
    symbol: STON
    unit: "fraction"
    domain: "0 <= value <= 0.85"
    description: "Stoniness fraction under the reviewed Table 4 scale interpretation."
  organic_matter:
    name: organic_matter
    symbol: OM
    unit: "%"
    domain: "0.039 <= value <= 6.854"
    description: "Soil organic matter content in percentage points."
  nitrogen:
    name: nitrogen
    symbol: N
    unit: "%"
    domain: "0 <= value <= 0.366"
    description: "Soil nitrogen content in percentage points."
  electrical_conductivity:
    name: electrical_conductivity
    symbol: EC
    unit: "dS/m"
    domain: "0.001 <= value <= 0.090"
    description: "Soil electrical conductivity."
  ph:
    name: ph
    symbol: pH
    unit: "1"
    domain: "4.98 <= value <= 8.50"
    description: "Soil pH measured in a 1:5 soil-to-water suspension."
  bulk_density:
    name: bulk_density
    symbol: BD
    unit: "g/cm^3"
    domain: "0.83 <= value <= 2.04"
    description: "Soil bulk density."
  WaterContentPF00:
    type: scalar
    name: water_content_pf00
    quantity: volumetric_water_content
    symbol: "pF0.0"
    unit: volume_fraction
    reported_unit: fractions
    domain: "0 <= value <= 1"
    description: "Volumetric water content at pF 0.0."
  WaterContentPF10:
    type: scalar
    name: water_content_pf10
    quantity: volumetric_water_content
    symbol: "pF1.0"
    unit: volume_fraction
    reported_unit: fractions
    domain: "0 <= value <= 1"
    description: "Volumetric water content at pF 1.0."
  WaterContentPF20:
    type: scalar
    name: water_content_pf20
    quantity: volumetric_water_content
    symbol: "pF2.0"
    unit: volume_fraction
    reported_unit: fractions
    domain: "0 <= value <= 1"
    description: "Volumetric water content at pF 2.0."
  WaterContentPF28:
    type: scalar
    name: water_content_pf28
    quantity: volumetric_water_content
    symbol: "pF2.8"
    unit: volume_fraction
    reported_unit: fractions
    domain: "0 <= value <= 1"
    description: "Volumetric water content at pF 2.8."
  WaterContentPF34:
    type: scalar
    name: water_content_pf34
    quantity: volumetric_water_content
    symbol: "pF3.4"
    unit: volume_fraction
    reported_unit: fractions
    domain: "0 <= value <= 1"
    description: "Volumetric water content at pF 3.4."
  WaterContentPF42:
    type: scalar
    name: water_content_pf42
    quantity: volumetric_water_content
    symbol: "pF4.2"
    unit: volume_fraction
    reported_unit: fractions
    domain: "0 <= value <= 1"
    description: "Volumetric water content at pF 4.2."
  SaturatedHydraulicConductivity:
    type: scalar
    name: saturated_hydraulic_conductivity
    quantity: saturated_hydraulic_conductivity
    symbol: Ksat
    unit: millimeter_per_hour
    reported_unit: mm/hr
    domain: "value >= 0"
    description: "Saturated hydraulic conductivity."
functions:
- name: calc_ptf_kalumba2021_mlr_pf00
  status: implemented
  public_api:
    name: calc_ptf_kalumba2021_mlr_pf00
    result_class: null
    summary: "Estimate volumetric water content at pf 0.0 with the Kalumba et al. MLR PTF."
  scope:
    prediction_target: "Volumetric water content at pF 0.0."
    models:
      h_theta: "Multiple linear regression point estimate at pF 0.0."
      k_h: null
  inputs:
  - $ref: "#/$defs/elevation"
  - $ref: "#/$defs/sand"
  - $ref: "#/$defs/silt"
  - $ref: "#/$defs/stoniness"
  - $ref: "#/$defs/nitrogen"
  - $ref: "#/$defs/electrical_conductivity"
  - $ref: "#/$defs/ph"
  - $ref: "#/$defs/bulk_density"
  outputs:
    $ref: "#/$defs/WaterContentPF00"
  implementation:
    variables:
    - name: water_content_pf00
      expr: "1.090 - 1.17e-4 * elevation - 0.073 * sand - 0.052 * silt - 0.024 * stoniness + 0.181 * nitrogen - 0.360 * electrical_conductivity - 0.003 * ph - 0.319 * bulk_density"
  verification_cases:
  - id: table1_mean_pf00
    kind: calculated
    inputs:
      elevation: 1179.0
      sand: 0.508
      silt: 0.219
      stoniness: 0.062
      nitrogen: 0.040
      electrical_conductivity: 0.016
      ph: 5.97
      bulk_density: 1.53
    expected:
      water_content_pf00: 0.397597
    source_location: "Table 1 means and Table 4 coefficients."
    rationale: "Calculated from the published marginal means. The texture means convert to fractions and sum to 1.0; the case is an implementation check, not a source-native row or evidence of model accuracy."
  edge_cases: []
  documentation:
    notes:
    - "Table 4 publishes the complete MLR equation; the target dataset is 302 Upper Mulungushi observations."
    warnings:
    - "Developed for Zambezi River Basin soils; the Table 1 ranges are marginal and do not define a joint Cartesian applicability domain."
