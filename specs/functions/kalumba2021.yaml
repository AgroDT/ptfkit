scientific_notes: |
  ## Supported models

  The paper develops seven multiple-linear-regression PTFs and seven fitted
  models for each of ANN, random forest, and SVM. Table 4 publishes complete
  MLR coefficients. Table 3 publishes target-specific predictor rankings for
  the MLR and machine-learning families.

  The pF 0.0, pF 1.0, pF 2.8, pF 3.4, and Ksat targets use 302 Upper
  Mulungushi observations. The pF 2.0 and pF 4.2 targets are reported against
  the combined 631-observation dataset.

  ## Review decisions

  The citation year is 2021 because that is the issue year, although the
  publisher records online publication and copyright in 2020.

  The paper calls water-content PTF outputs "fractions or percentages" while
  Table 1 labels observations as Vol %. The reviewed computational contract
  uses fractions: the Table 4 equations evaluate on the 0.x scale, and Figure
  4 reports water-content RMSE values of about 0.02 to 0.06. The literal
  source term `fractions` is retained as an equivalent notation for
  `volume_fraction` after explicit user review.

  Sand, clay, and silt are explicitly fractions at PTF input. STON is also
  interpreted as a fraction after explicit review: using the Table 1 mean as
  percentage points in the Ksat equation gives 3087.31 mm/hr, above the
  published 509.40 mm/hr maximum, whereas 0.062 gives a physically plausible
  122.656 mm/hr. OM and N retain the percentage-point scales stated in
  Section 2.2 and Table 1.

  The calculated verification inputs use the published Table 1 means. The
  mean texture fractions are 0.508 sand, 0.273 clay, and 0.219 silt and sum
  exactly to 1.0. Their expected values are fixed evaluations of Table 4, not
  source-native rows, independent validation, or evidence of predictive
  accuracy.

  The literal Ksat notation `mm/hr` is retained as a reviewed alias of
  `millimeter_per_hour`; no numerical conversion is applied.

  ## Documented limitations

  Table 1 publishes marginal ranges, not complete joint predictor rows. The
  ranges therefore document the source data but do not define a Cartesian
  applicability region. The paper supplies no out-of-domain behavior.

  No complete published predictor-to-prediction example is available. This is
  not a blocker for the computationally complete MLR equations because the
  verification cases are calculated directly from the published contract.

  ## Blockers

  The ANN, random-forest, and SVM functions remain blocked. The paper states
  that explanatory and response variables were normalized and that default
  meta-parameters and a random 70/30 split were used, but it does not publish
  the exact normalization, package identities and versions, split membership
  or seed, target transforms, or fitted weights, trees, support vectors, and
  coefficients. Re-training would produce different fitted models.

  Supporting data are available only from the corresponding author upon
  reasonable request. Rights and redistribution remain a separate release
  gate and do not change the scientific extraction status.
