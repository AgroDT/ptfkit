source:
  summary: Representative hydraulic parameters for eleven USDA soil texture classes.
  citation_apa: >-
    Clapp, R. B., & Hornberger, G. M. (1978). Empirical equations for some soil
    hydraulic properties. Water Resources Research, 14(4), 601-604.
  doi:
    identifier: 10.1029/WR014i004p00601
    url: https://doi.org/10.1029/WR014i004p00601
scope:
  territory: United States
  dataset: >-
    Desorption measurements reported by Holtan et al. (1968), reduced from more
    than 1,800 samples to 1,446 accepted soils from 34 United States localities.
functions:
- name: calc_ptf_clapp1978_texture_class
  status: blocked
  public_api:
    name: calc_ptf_clapp1978_texture_class
    result_class: Clapp1978TextureClassPTFResult
    summary: Look up representative hydraulic parameters by USDA soil texture class.
  scope:
    prediction_target: >-
      Representative moisture-characteristic, conductivity, wetting-front, and
      sorptivity parameters for a soil texture class.
    models:
      h_theta: 'psi = psi_s * W^(-b), with a parabolic section near saturation'
      k_h: 'k = W^(2b+3), using the verified correction to the damaged OCR'
  inputs:
  - name: soil_texture
    type: usda_texture_class
    symbol: null
    unit: USDA texture class
    domain: >-
      sand, loamy sand, sandy loam, silt loam, loam, sandy clay loam,
      silty clay loam, clay loam, sandy clay, silty clay, or clay
    description: >-
      USDA textural class assigned to the source soil and represented in Table 2.
  outputs:
    type: record
    name: Clapp1978TextureClassPTFResult
    fields:
    - name: mean_clay_fraction
      symbol: null
      unit: '1'
      domain: '[0, 1]'
      description: Clay fraction read at the center of the USDA textural class.
    - name: mean_b
      symbol: null
      unit: '1'
      domain: null
      description: Mean fitted exponent of the moisture-characteristic power curve.
    - name: mean_psi_s
      symbol: null
      unit: cm
      domain: null
      description: Arithmetic mean fitted saturation suction.
    - name: representative_psi_s_log
      symbol: null
      unit: cm
      domain: null
      description: Antilog of the mean logarithm of fitted saturation suction.
    - name: wetting_front_suction
      symbol: null
      unit: cm
      domain: null
      description: Representative Green-Ampt wetting-front suction.
    - name: saturated_water_content
      symbol: null
      unit: cm^3/cm^3
      domain: '[0, 1]'
      description: Mean saturated volumetric water content or total porosity.
    - name: saturated_hydraulic_conductivity
      symbol: null
      unit: cm/min
      domain: '[0, +inf)'
      description: Average saturated hydraulic conductivity reported by Li et al. (1976).
    - name: sorptivity
      symbol: null
      unit: cm/min^(1/2)
      domain: '[0, +inf)'
      description: Representative sorptivity for the source-defined initial moisture deficit.
  golden_tests:
  - id: table_2_sand
    inputs: {soil_texture: sand}
    expected:
      mean_clay_fraction: 0.03
      mean_b: 4.05
      mean_psi_s: 12.1
      representative_psi_s_log: 3.50
      wetting_front_suction: 4.66
      saturated_water_content: 0.395
      saturated_hydraulic_conductivity: 1.056
      sorptivity: 1.52
    rtol: 0
    atol: 0
    notes: Source-native values from Table 2.
  - id: table_2_loamy_sand
