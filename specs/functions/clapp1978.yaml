  edge_cases:
  - id: source_has_no_silt_row
    inputs: {soil_texture: silt}
    expected_behavior: Reject the class because Table 2 publishes no value for silt.
    notes: The registered USDA type includes silt, but the source lookup has only eleven rows.
  documentation:
    notes:
    - Table 2 values are direct source-native class averages, not values calculated
      from the repository USDA representative-fraction adapter.
    - The source uses the USDA (1951) textural triangle to read the clay fraction
      at the center of each textural class.
    warnings:
    - The source states that the average values were not verified and that blind
      use may be erroneous because several parameters have large within-class variability.
    - Sorptivity combines source-derived parameters with average saturated
      conductivity values reported by Li et al. (1976).
scientific_notes: |
  ## Supported model

  - Table 2 directly maps eleven USDA soil texture classes to representative
    hydraulic parameters. These rows are source-native golden values.
  - The source defines W as theta/theta_s and fits psi = psi_s * W^(-b).
  - The prepared-source correction establishes that the empirical working
    conductivity relation is k = W^(2b+3); the damaged OCR prints 2b+2.

  ## Texture interpretation

  - Holtan et al. assigned a textural class to each soil but supplied no measured
    particle-size distributions. Clapp and Hornberger used the USDA (1951)
    triangle center only to read a mean clay fraction for ordering and comparison.
  - The publication does not provide a numerical regression that predicts the
    Table 2 hydraulic parameters from clay, sand, or silt fractions. Therefore
    this categorical lookup must not be rewritten as adapter-derived fractions
    followed by an invented formula.
  - The USDA adapter is used only to resolve the exact categorical input type.
    No derived_inputs binding is declared, and no repository representative
    fractions are copied into this specification.

  ## Documented limitations

  - The source describes the averages as unverified and reports substantial
    within-class variability, particularly for psi_s.
  - The source table has no row for the USDA silt class.
  ## Blockers

  - The current semantic implementation model has no source-defined categorical
    lookup primitive. Human review must select a representation that preserves
    the eleven published rows and rejects the unsupported silt class without
    lowering through representative sand, silt, and clay fractions.
