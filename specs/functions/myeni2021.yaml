source:
  summary: Myeni et al. (2021) point water-retention PTFs for South African soils.
  citation_apa: >-
    Myeni, L., Mdlambuzi, T., Paterson, D. G., De Nysschen, G., & Moeletsi,
    M. E. (2021). Development and evaluation of pedotransfer functions to
    estimate soil moisture content at field capacity and permanent wilting
    point for South African soils. Water, 13(19), 2639.
    https://doi.org/10.3390/w13192639
  doi:
    identifier: 10.3390/w13192639
    url: https://doi.org/10.3390/w13192639
scope:
  territory: South Africa
  dataset: >-
    6,307 soil horizons from the South African national soil database after
    quality control; 3,171 horizons were used for development and 3,136 for
    independent validation.
$defs:
  clay:
    name: clay
    symbol: Cl
    unit: '%'
    domain: 'Development-data range: 1 <= value <= 83'
    description: Clay content by mass for particles smaller than 0.002 mm.
  silt:
    name: silt
    symbol: Si
    unit: '%'
    domain: 'Development-data range: 1 <= value <= 64'
    description: Silt content by mass for particles from 0.002 to 0.05 mm.
  soil_organic_carbon:
    name: soil_organic_carbon
    symbol: SOC
    unit: '%'
    domain: 'Development-data range: 0.01 <= value <= 9.36'
    description: Soil organic carbon content by mass measured by the Walkley-Black method.
  Myeni2021PTFResult:
    type: record
    name: Myeni2021PTFResult
    fields:
      - name: field_capacity
        quantity: gravimetric_water_content
        symbol: FC
        unit: kg/kg
        domain: null
        description: >-
          Gravimetric soil moisture content at field capacity, corresponding
          to -33 kPa matric potential.
      - name: permanent_wilting_point
        quantity: gravimetric_water_content
        symbol: PWP
        unit: kg/kg
        domain: null
        description: >-
          Gravimetric soil moisture content at permanent wilting point,
          corresponding to -1500 kPa matric potential.
functions:
  - name: calc_ptf_myeni2021
    status: implemented
    public_api:
      name: calc_ptf_myeni2021
      result_class: Myeni2021PTFResult
      summary: Estimate field capacity and permanent wilting point for South African soils.
    scope:
      prediction_target: >-
        Gravimetric soil moisture content at field capacity (-33 kPa) and
        permanent wilting point (-1500 kPa).
      models:
        h_theta: Two point estimates from stepwise multiple linear regression
        k_h: null
    inputs:
      - $ref: '#/$defs/clay'
      - $ref: '#/$defs/silt'
      - $ref: '#/$defs/soil_organic_carbon'
    outputs:
      $ref: '#/$defs/Myeni2021PTFResult'
    implementation:
      variables:
        - name: field_capacity
          expr: 0.014 + 0.005 * clay + 0.009 * soil_organic_carbon + 0.002 * silt
        - name: permanent_wilting_point
          expr: 0.003 * clay + 0.001 * silt + 0.007 * soil_organic_carbon
    verification_cases:
      - id: representative_soil
        kind: calculated
        inputs:
          clay: 30.0
          silt: 20.0
          soil_organic_carbon: 1.0
        expected:
          field_capacity: 0.213
          permanent_wilting_point: 0.117
        rationale: >-
          Interior physically plausible mineral-soil composition using mass
          percentages for texture and soil organic carbon. The expected values
          were calculated from the rounded equations published in Table 5 and
          do not demonstrate parity with the non-public SMR spreadsheet.
    edge_cases: []
    documentation:
      notes:
        - >-
          Table 5 reports development R-squared values of 0.73 for field
          capacity and 0.79 for permanent wilting point.
        - >-
          Independent validation gave R-squared values of 0.77 and 0.82 and
          RMSE values of 0.047 kg/kg and 0.029 kg/kg for field capacity and
          permanent wilting point, respectively.
        - >-
          The source equations use clay, silt, and soil organic carbon as mass
          percentages and directly return gravimetric water content in kg/kg.
      warnings:
        - >-
          Apply outside South Africa only with caution and in regions with
          similar soil types and climatic conditions.
        - >-
          The regressions were developed from disturbed samples and do not
          explicitly account for soil structure through bulk density.
scientific_notes: |
  # Myeni et al. (2021)

  ## Supported models

  Table 5 publishes two stepwise multiple-linear-regression PTFs. Both use
  clay, silt, and soil organic carbon mass percentages. They estimate
  gravimetric water content at field capacity (-33 kPa) and permanent wilting
  point (-1500 kPa). The models were developed from 3,171 soil horizons and
  evaluated with an independent set of 3,136 horizons.

  The pressure-plate measurements used disturbed soil samples. Sand was
  considered during stepwise model development but is absent from both selected
  equations.

  ## Review decisions

  The two equations are exposed together because they have identical inputs and
  jointly provide the two point-retention quantities presented as the study's
  new PTFs. Table 5 includes a `Constant` row for the PWP regression, but its
  printed output equation has no intercept; the implementation preserves that
  published equation without adding a constant.

  Input domains reproduce the development-data ranges in Table 3. Across the
  full development and validation data, the reported ranges are 1-83% clay,
  1-68% silt, and 0.01-11.7% soil organic carbon.

  ## Documented limitations

  The authors advise caution outside South Africa and limit transferability to
  regions with similar soil types and climatic conditions. They also report
  reduced performance in wetter soils because the regressions omit bulk density
  and therefore do not explicitly represent soil structure.

  ## Verification decision

  The article supplies no row-level observations or complete published
  input-output example. This does not block implementation because Table 5
  fully specifies both equations. The calculated verification case uses an
  interior, physically plausible mineral-soil composition and fixes the
  results of straightforward reference calculations from those published
  rounded equations. It is not independent validation of model accuracy or
  evidence of parity with the non-public soil-moisture-retentivity spreadsheet.
