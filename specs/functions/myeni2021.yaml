source:
  summary: Gravimetric field capacity and permanent wilting point for South African soils.
  citation_apa: >-
    Myeni, L., Mdlambuzi, T., Paterson, D. G., De Nysschen, G., & Moeletsi,
    M. E. (2021). Development and evaluation of pedotransfer functions to
    estimate soil moisture content at field capacity and permanent wilting
    point for South African soils. Water, 13(19), 2639.
    https://doi.org/10.3390/w13192639
  doi:
    identifier: 10.3390/w13192639
    url: https://doi.org/10.3390/w13192639
scope:
  territory: South Africa.
  dataset: >-
    ARC national soil database: 6307 soil horizons retained after quality
    control, with 3171 development horizons and 3136 validation horizons.
    Horizons were grouped regardless of depth, soil type, textural class,
    geographic location and climate, then randomly split per granulometric
    range (Sections 2.1-2.2; Tables 2-3).
$defs:
  Clay:
    name: clay
    symbol: Cl
    unit: "%"
    domain: "Development dataset range: 1.00-83.00% (Table 3)."
    description: Clay content by weight, particle diameter below 0.002 mm.
  Silt:
    name: silt
    symbol: Si
    unit: "%"
    domain: "Development dataset range: 1.00-64.00% (Table 3)."
    description: Silt content by weight, particle diameter 0.002-0.05 mm.
  Soc:
    name: soc
    symbol: SOC
    unit: "%"
    domain: "Development dataset range: 0.01-9.36% (Table 3)."
    description: Soil organic carbon content by weight, measured by the Walkley-Black method.
functions:
  - name: calc_ptf_myeni2021_fc
    status: implemented
    public_api:
      name: calc_ptf_myeni2021_fc
      summary: Estimate gravimetric field capacity from clay, silt and soil organic carbon.
    scope:
      prediction_target: Gravimetric soil moisture content at field capacity (-33 kPa).
      models:
        h_theta: null
        k_h: null
    inputs:
      - $ref: '#/$defs/Clay'
      - $ref: '#/$defs/Silt'
      - $ref: '#/$defs/Soc'
    outputs:
      type: scalar
      name: fc
      quantity: gravimetric_water_content
      symbol: FC
      unit: mass_fraction
      reported_unit: kg kg⁻¹
      domain: "Observed development dataset range: 0.01-0.50 kg/kg (Table 3)."
      description: Gravimetric soil moisture content at field capacity (-33 kPa).
    implementation:
      variables:
        - name: fc
          expr: 0.014 + (0.005 * clay) + (0.009 * soc) + (0.002 * silt)
    verification_cases:
      - id: development_predictor_means
        kind: calculated
        inputs: {clay: 27.65, silt: 16.34, soc: 0.75}
        expected: {fc: 0.19168}
        source_location: Table 3 development predictor means; Table 5 FC equation.
        rationale: >-
          Use the published development predictor means, which lie inside
          their marginal ranges. Together with the published sand mean of
          54.72%, texture sums to 98.71%, within the source's 95-105% quality
          criterion. Direct decimal arithmetic from Table 5 gives 0.19168
          kg/kg, above the calculated PWP of 0.10454 kg/kg. This is a
          calculated formula check, not a published input-output pair or
          evidence of model accuracy.
    documentation:
      notes:
        - Table 5 gives the stepwise multiple linear regression for FC.
        - Inputs are weight percentages; output is gravimetric water content.
      warnings:
        - Apply with caution outside South Africa, even under similar soil and climatic conditions.
        - Disturbed samples were used; soil structure is not explicitly represented.
  - name: calc_ptf_myeni2021_pwp
    status: implemented
    public_api:
      name: calc_ptf_myeni2021_pwp
      summary: Estimate gravimetric permanent wilting point from clay, silt and soil organic carbon.
    scope:
      prediction_target: Gravimetric soil moisture content at permanent wilting point (-1500 kPa).
      models:
        h_theta: null
        k_h: null
    inputs:
      - $ref: '#/$defs/Clay'
      - $ref: '#/$defs/Silt'
      - $ref: '#/$defs/Soc'
    outputs:
      type: scalar
      name: pwp
      quantity: gravimetric_water_content
      symbol: PWP
      unit: mass_fraction
      reported_unit: kg kg⁻¹
      domain: "Observed development dataset range: 0.00-0.31 kg/kg (Table 3)."
      description: Gravimetric soil moisture content at permanent wilting point (-1500 kPa).
    implementation:
      variables:
        - name: pwp
          expr: (0.003 * clay) + (0.001 * silt) + (0.007 * soc)
    verification_cases:
      - id: development_predictor_means
        kind: calculated
        inputs: {clay: 27.65, silt: 16.34, soc: 0.75}
        expected: {pwp: 0.10454}
        source_location: Table 3 development predictor means; Table 5 PWP equation.
        rationale: >-
          Use the published development predictor means, which lie inside
          their marginal ranges. Together with the published sand mean of
          54.72%, texture sums to 98.71%, within the source's 95-105% quality
          criterion. Direct decimal arithmetic from Table 5 gives 0.10454
          kg/kg, below the calculated FC of 0.19168 kg/kg. This is a
          calculated formula check, not a published input-output pair or
          evidence of model accuracy.
    documentation:
      notes:
        - Table 5 gives the stepwise multiple linear regression for PWP without an additive constant.
        - Inputs are weight percentages; output is gravimetric water content.
      warnings:
        - Apply with caution outside South Africa, even under similar soil and climatic conditions.
        - Disturbed samples were used; soil structure is not explicitly represented.
scientific_notes: |
  ## Supported models

  Table 5 publishes two new multiple linear regressions for gravimetric FC
  and PWP. Table 1 lists comparison models from other authors; these are not
  attributed to Myeni et al. or extracted as new models here. Textural classes
  in Table 2 describe the dataset and are not categorical predictors.

  ## Review decisions

  Section 2.2 specifies weight percentages for predictors; Table 5 identifies
  outputs as gravimetric kg kg⁻¹. Section 2.1 includes both percent and kg kg⁻¹
  in its initial description, but Table 5 equations and Table 3 fractional
  output ranges establish the output scale used here. No percent conversion
  or bulk-density conversion is applied. The abstract specifies -33 and
  -1500 kPa; Section 2.1 describes the corresponding pressure-plate magnitudes.

  Although Table 5 lists a PWP constant significance statistic, its printed
  output equation has no additive constant. The implementation follows that
  equation. Reported coefficient standard errors and Table 6 performance
  statistics are not implementation tolerances. The approved mass_fraction
  notation alias preserves numerical values and the existing absolute
  tolerance of 0.001, with no relative tolerance.

  ## Documented limitations

  The source supplies no complete published predictor-output example. Table 3
  contains marginal summaries, not individual horizons. Figure descriptions
  in the supplied Markdown give approximate measured-versus-estimated points
  without predictors; these are not verification pairs. Section 3.4.2 offers
  the SMR spreadsheet on request, and the Data Availability Statement offers
  data on request. Calculated cases follow the current extraction policy;
  the supplied bundle's earlier missing-golden-case audit is historical.

  Table 3 ranges describe observed samples, not clipping bounds or a promise
  of applicability for arbitrary combinations of marginal extrema. Section
  2.1 retained texture totals between 95% and 105%. The published development
  texture means are preserved without renormalization. The study used
  disturbed samples and omitted bulk density, limiting representation of
  soil structure (Section 3.4.1). Transfer outside the study region requires
  caution (Section 3.4.2 and Conclusions).

  ## Blockers

  None. The draft awaits human review before target generation.
