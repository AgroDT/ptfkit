scientific_notes: |
  Audited computational source: official rosetta-soil at revision
  6b0e3902f8a145805d41b691dc36f8e69e898f2a. The paper is cited for model
  identity; no claim is made that the full paper was reviewed in this audit.

  The reviewed software contract, architecture, local regeneration commands,
  numerical comparisons, and outstanding production integration are recorded in
  docs/src/contributing/rosetta3.md. The versioned artifact manifest is
  specs/models/rosetta3/manifest.json. Parameter files remain local only.

  The ordinary formula and Random Forest pipelines do not yet accept external
  neural-model inputs. Local targets are generated by generate-rosetta-local;
  they do not mark this source implemented and are excluded from packages.

  Additional conductivity parameters use the Rosetta1 network described by
  Schaap, M. G., Leij, F. J., & van Genuchten, M. T. (2001). ROSETTA: a computer
  program for estimating soil hydraulic parameters with hierarchical pedotransfer
  functions. Journal of Hydrology, 251(3-4), 163-176.
  https://doi.org/10.1016/S0022-1694(01)00466-8
