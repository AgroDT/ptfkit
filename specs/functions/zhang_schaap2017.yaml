source:
  summary: Rosetta3 native-inference audit and local verification; production integration blocked.
  citation_apa: >-
    Zhang, Y., & Schaap, M. G. (2017). Weighted recalibration of the Rosetta
    pedotransfer model with improved estimates of hydraulic parameter
    distributions and summary statistics (Rosetta3). Journal of Hydrology,
    547, 39-53.
  doi:
    identifier: 10.1016/j.jhydrol.2017.01.004
    url: https://doi.org/10.1016/j.jhydrol.2017.01.004
scope:
  territory: Not independently established by this software audit.
  dataset: Original trained upstream ensembles; no retraining or replacement.
$defs:
  Rosetta3ArithmeticStatistics:
    type: record
    name: Rosetta3ArithmeticStatistics
    fields:
      - name: theta_r_mean
        quantity: volumetric_water_content
        symbol: null
        unit: volume_fraction
        reported_unit: "cm^3/cm^3"
        domain: null
        description: "Arithmetic ensemble mean. Residual volumetric water content."
      - name: theta_s_mean
        quantity: volumetric_water_content
        symbol: null
        unit: volume_fraction
        reported_unit: "cm^3/cm^3"
        domain: null
        description: "Arithmetic ensemble mean. Saturated volumetric water content."
      - name: alpha_mean
        quantity: van_genuchten_alpha
        symbol: null
        unit: inverse_centimeter
        reported_unit: "1/cm"
        domain: null
        description: "Arithmetic ensemble mean. van Genuchten inverse pressure-scale parameter."
      - name: n_mean
        quantity: van_genuchten_n
        symbol: null
        unit: dimensionless
        reported_unit: "1"
        domain: null
        description: "Arithmetic ensemble mean. van Genuchten pore-size parameter."
      - name: k_sat_mean
        quantity: saturated_hydraulic_conductivity
        symbol: null
        unit: centimeter_per_day
        reported_unit: "cm/day"
        domain: null
        description: "Arithmetic ensemble mean. Saturated hydraulic conductivity."
      - name: k_0_mean
        quantity: unsaturated_hydraulic_conductivity
        symbol: null
        unit: centimeter_per_day
        reported_unit: "cm/day"
        domain: null
        description: "Arithmetic ensemble mean. Unsaturated conductivity matching-point parameter; not saturated conductivity."
      - name: l_mean
        quantity: conductivity_shape_parameter
        symbol: null
        unit: dimensionless
        reported_unit: "1"
        domain: null
        description: "Arithmetic ensemble mean. Unsaturated conductivity exponent from the separate Rosetta1 ensemble."
      - name: theta_r_std
        quantity: volumetric_water_content
        symbol: null
        unit: volume_fraction
        reported_unit: "cm^3/cm^3"
        domain: null
        description: "Sample standard deviation (ddof=1), in physical parameter units. Residual volumetric water content."
      - name: theta_s_std
        quantity: volumetric_water_content
        symbol: null
        unit: volume_fraction
        reported_unit: "cm^3/cm^3"
        domain: null
        description: "Sample standard deviation (ddof=1), in physical parameter units. Saturated volumetric water content."
      - name: alpha_std
        quantity: van_genuchten_alpha
        symbol: null
        unit: inverse_centimeter
        reported_unit: "1/cm"
        domain: null
        description: "Sample standard deviation (ddof=1), in physical parameter units. van Genuchten inverse pressure-scale parameter."
      - name: n_std
        quantity: van_genuchten_n
        symbol: null
        unit: dimensionless
        reported_unit: "1"
        domain: null
        description: "Sample standard deviation (ddof=1), in physical parameter units. van Genuchten pore-size parameter."
      - name: k_sat_std
        quantity: saturated_hydraulic_conductivity
        symbol: null
        unit: centimeter_per_day
        reported_unit: "cm/day"
        domain: null
        description: "Sample standard deviation (ddof=1), in physical parameter units. Saturated hydraulic conductivity."
      - name: k_0_std
        quantity: unsaturated_hydraulic_conductivity
        symbol: null
        unit: centimeter_per_day
        reported_unit: "cm/day"
        domain: null
        description: "Sample standard deviation (ddof=1), in physical parameter units. Unsaturated conductivity matching-point parameter; not saturated conductivity."
      - name: l_std
        quantity: conductivity_shape_parameter
        symbol: null
        unit: dimensionless
        reported_unit: "1"
        domain: null
        description: "Sample standard deviation (ddof=1), in physical parameter units. Unsaturated conductivity exponent from the separate Rosetta1 ensemble."
functions:
  - name: calc_ptf_zhang2017_mod2
    status: blocked
    public_api:
      name: calc_ptf_zhang2017_mod2
      result_class: Rosetta3ArithmeticStatistics
      summary: Estimate Rosetta3 level 2 physical-scale arithmetic means and uncertainty.
    scope:
      prediction_target: Seven hydraulic parameters and their bootstrap sample standard deviations.
      models:
        h_theta: van Genuchten retention parameters
        k_h: Saturated conductivity and Rosetta1 unsaturated conductivity parameters
    inputs:
      - name: sand
        symbol: null
        unit: "%"
        domain: "Nonnegative mass percentage; texture sum within [99, 101]."
        description: "Sand mass percentage in the upstream convention; no granulometric conversion is applied."
      - name: silt
        symbol: null
        unit: "%"
        domain: "Nonnegative mass percentage; texture sum within [99, 101]."
        description: "Silt mass percentage in the upstream convention."
      - name: clay
        symbol: null
        unit: "%"
        domain: "Nonnegative mass percentage; texture sum within [99, 101]."
        description: "Clay mass percentage in the upstream convention."
    outputs:
      $ref: "#/$defs/Rosetta3ArithmeticStatistics"
    verification_cases:
      - id: upstream_clay_loam
        kind: published
        inputs:
          sand: 30
          silt: 30
          clay: 40
        expected:
          theta_r_mean: 0.11921313412479762
          theta_s_mean: 0.4348486578079577
          alpha_mean: 0.009109686083606867
          n_mean: 1.3094213646469939
          k_sat_mean: 8.74047181417013
          k_0_mean: 1.3099307799553759
          l_mean: -1.009187960743742
          theta_r_std: 0.009022699466985867
          theta_s_std: 0.010140469075525323
          alpha_std: 0.0022509742698824248
          n_std: 0.0366504620061113
          k_sat_std: 2.930411333703784
          k_0_std: 0.843530623042398
          l_std: 1.547848314232419
        source_location: >-
          Official rosetta-soil revision 6b0e3902f8a145805d41b691dc36f8e69e898f2a,
          rosetta(3, inputs, estimate_type="arith"); specs/models/rosetta3/reference.json, mod2_arith_clay_loam.
    documentation:
      notes:
        - Fixed-level local verification rejects invalid predictors instead of silently falling back.
        - Full arithmetic, log10, and geometric reference results are in the external model fixture.
      warnings:
        - Production API integration is incomplete; this entry is intentionally blocked.
        - Trained-parameter redistribution rights remain unresolved; no weights are bundled.
        - Local inference is not validation of predictive accuracy or applicability to a new soil population.
