scientific_notes: |
  Computational source: official rosetta-soil at commit
  6b0e3902f8a145805d41b691dc36f8e69e898f2a. The paper is cited for model
  identity; the complete paper has not been independently reviewed.

  Dense architectures, artifact metadata, activations, and scaling are declared
  in implementation.networks. Ordered implementation.variables describe member
  transformations, sample statistics, estimate selection, conductivity inputs,
  numeric conditions, and output transformations. Arithmetic uses the shared
  expression parser and semantic model. Python and C++ reuse the C computation.
  Explicit initialization shares immutable bundled parameters. Numerical reference
  cases are retained in specs/models/rosetta3/reference.json.

  Arithmetic estimates summarize members in physical units. Log10 estimates
  summarize alpha, n, k_sat, and k_0 in log10 of their declared numeric units;
  theta_r, theta_s, and l retain their original scales. Geometric estimates
  exponentiate the corresponding log10 means and retain physical-scale sample
  standard deviations. All sample standard deviations use ddof=1, not standard
  errors. These conventions are implemented by the declared estimate operations.

  Additional conductivity parameters use the Rosetta1 network described by
  Schaap, M. G., Leij, F. J., & van Genuchten, M. T. (2001). ROSETTA: a computer
  program for estimating soil hydraulic parameters with hierarchical pedotransfer
  functions. Journal of Hydrology, 251(3-4), 163-176.
  https://doi.org/10.1016/S0022-1694(01)00466-8
