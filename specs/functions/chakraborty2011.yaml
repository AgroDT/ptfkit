        - name: water_content_100
          expr: (0.262 * clay + 0.380 * silt - 3.167 * bulk_density + 8.219) / 100
        - name: water_content_500
          expr: (0.244 * clay + 0.187 * silt - 3.079 * bulk_density + 8.046) / 100
        - name: water_content_1500
