scientific_notes: |
  # Chakraborty et al. (2011)

  Table 3 presents six multiple-linear-regression equation sets at each of four
  matric potentials. `Clay`, `Silt`, `Sand`, and `Org C` are expressed as mass
  percentages and `BD` as Mg/m^3. The regressions return gravimetric moisture
  content on a percent oven-dry basis, so every raw percentage prediction is
  divided by 100 to expose g/g outputs.

  The paper reports dry bulk density from 1.17 to 1.98 Mg/m^3. It reports the
  organic-C range as 0.2 to 11.8 g/kg, while Table 3 labels the regression input
  `Org C (%)`; the specified 0.02% to 1.18% domain is the direct unit conversion
  of that reported range.

  The abstract recommends clay plus silt at -33 and -500 kPa and clay, silt,
  plus bulk density at -100 and -1500 kPa. The discussion likewise chooses
  equation 1 at -33 and -500 kPa and equation 3 at -100 and -1500 kPa. However,
  Table 4's printed final ranking assigns rank 1 to equation 5 at -33 kPa and
  equation 3 at -500 kPa. This draft preserves every published equation set and
  does not introduce a composite API that would silently choose between the
  conflicting recommendations.

  ## Numeric policy

  Use `f64`, do not round intermediate or final values, and propagate IEEE 754
  NaN and infinities. Golden cases are direct evaluations of the printed Table 3
  coefficients at representative inputs, with source percentage predictions
  divided by 100 to obtain g/g.

  ## Review decisions

  - Retain all six numbered equation sets as public functions rather than
    selecting only the paper's preferred equations.
  - Treat the user-supplied citation as authoritative; the article has no DOI.
  - The conflicting narrative and tabulated model rankings are documentation,
    not a blocker, because no composite best-model function is exposed.
