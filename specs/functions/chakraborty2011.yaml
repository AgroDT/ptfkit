source:
  summary: Chakraborty et al. (2011), point water-retention PTFs for Indian soils.
  citation_apa: >-
    Chakraborty, D., Mazumdar, S. P., Garg, R. N., Banerjee, S., Santra, P.,
    Singh, R., & Tomar, R. K. (2011). Pedotransfer functions for predicting
    points on the moisture retention curve of Indian soils. Indian Journal of
    Agricultural Sciences, 81(11), 1030.
  doi: null
scope:
  territory: India
  dataset: >-
    187 soil samples from three or more horizons at locations across India;
    107 samples were used for regression development and 80 independent samples
    for validation. Analyses were performed during 2006-2008.
$defs:
  clay:
    name: clay
    symbol: Clay
    unit: '%'
    domain: null
    description: Clay content by mass.
  silt:
    name: silt
    symbol: Silt
    unit: '%'
    domain: null
    description: Silt content by mass.
  sand:
    name: sand
    symbol: Sand
    unit: '%'
    domain: null
    description: Sand content by mass.
  organic_carbon:
    name: organic_carbon
    symbol: OrgC
    unit: '%'
    domain: 0.02 <= value <= 1.18
    description: Soil organic carbon content by mass.
  bulk_density:
    name: bulk_density
    symbol: BD
    unit: Mg/m^3
    domain: 1.17 <= value <= 1.98
    description: Dry soil bulk density.
  Chakraborty2011PTFResult:
    type: record
    name: Chakraborty2011PTFResult
    fields:
      - name: water_content_33
        symbol: w_33
        unit: g/g
        domain: null
        description: Gravimetric water content at -33 kPa matric potential.
      - name: water_content_100
        symbol: w_100
        unit: g/g
        domain: null
        description: Gravimetric water content at -100 kPa matric potential.
      - name: water_content_500
        symbol: w_500
        unit: g/g
        domain: null
        description: Gravimetric water content at -500 kPa matric potential.
      - name: water_content_1500
        symbol: w_1500
        unit: g/g
        domain: null
        description: Gravimetric water content at -1500 kPa matric potential.
functions:
  - name: calc_ptf_chakraborty2011_eq1
    status: implemented
    public_api:
      name: calc_ptf_chakraborty2011_eq1
      result_class: Chakraborty2011PTFResult
      summary: Estimate four gravimetric water contents from clay and silt.
    scope:
      prediction_target: >-
        Gravimetric water content at -33, -100, -500, and -1500 kPa.
      models:
        h_theta: Four point estimates from regression equation set 1
        k_h: null
    inputs:
      - $ref: '#/$defs/clay'
      - $ref: '#/$defs/silt'
    outputs:
      $ref: '#/$defs/Chakraborty2011PTFResult'
    implementation:
      variables:
        - name: water_content_33
          expr: (0.297 * clay + 0.478 * silt + 4.600) / 100
        - name: water_content_100
          expr: (0.270 * clay + 0.379 * silt + 2.988) / 100
        - name: water_content_500
          expr: (0.251 * clay + 0.185 * silt + 2.958) / 100
        - name: water_content_1500
          expr: (0.184 * clay + 0.144 * silt + 3.702) / 100
    golden_tests:
      - id: representative_case
        inputs:
          clay: 20.0
          silt: 30.0
        expected:
          water_content_33: 0.2488
          water_content_100: 0.19758
          water_content_500: 0.13528
          water_content_1500: 0.11702
        rtol: 1.0e-12
        atol: 1.0e-12
        notes: Calculated directly from Table 3 and divided by 100.
    edge_cases: []
    documentation:
      notes:
        - >-
          Table 3 reports R-squared values of 0.820, 0.709, 0.698, and 0.489
          at -33, -100, -500, and -1500 kPa, respectively.
        - >-
          Table 3 reports SEE values of 4.351, 5.051, 3.837, and 4.488
          percentage points at the four respective potentials.
      warnings:
        - Use outside the source Indian-soil dataset requires independent validation.
  - name: calc_ptf_chakraborty2011_eq2
    status: implemented
    public_api:
      name: calc_ptf_chakraborty2011_eq2
      result_class: Chakraborty2011PTFResult
      summary: Estimate four gravimetric water contents from sand and bulk density.
    scope:
      prediction_target: >-
        Gravimetric water content at -33, -100, -500, and -1500 kPa.
      models:
        h_theta: Four point estimates from regression equation set 2
        k_h: null
    inputs:
      - $ref: '#/$defs/sand'
      - $ref: '#/$defs/bulk_density'
    outputs:
      $ref: '#/$defs/Chakraborty2011PTFResult'
    implementation:
      variables:
        - name: water_content_33
          expr: (-0.377 * sand - 0.215 * bulk_density + 41.114) / 100
        - name: water_content_100
          expr: (-0.330 * sand + 2.611 * bulk_density + 30.160) / 100
        - name: water_content_500
          expr: (-0.244 * sand - 0.795 * bulk_density + 27.495) / 100
        - name: water_content_1500
          expr: (-0.187 * sand + 1.241 * bulk_density + 19.320) / 100
    golden_tests:
      - id: representative_case
        inputs:
          sand: 50.0
          bulk_density: 1.5
        expected:
          water_content_33: 0.219415
          water_content_100: 0.175765
          water_content_500: 0.141025
          water_content_1500: 0.118315
        rtol: 1.0e-12
        atol: 1.0e-12
        notes: Calculated directly from Table 3 and divided by 100.
    edge_cases: []
    documentation:
      notes:
        - >-
          Table 3 reports R-squared values of 0.812, 0.726, 0.721, and 0.519
          at -33, -100, -500, and -1500 kPa, respectively.
        - >-
          Table 3 reports SEE values of 4.454, 4.875, 3.691, and 4.352
          percentage points at the four respective potentials.
      warnings:
        - Use outside the source Indian-soil dataset requires independent validation.
  - name: calc_ptf_chakraborty2011_eq3
    status: implemented
