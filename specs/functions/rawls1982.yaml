source:
  summary: Rawls et al. (1982), water-retention regressions for soils across the USA.
  citation_apa: Rawls, W. J., Brakensiek, D. L., & Saxton, K. E. (1982). Estimation
    of soil water properties. Transactions of the ASAE, 25, 1316-1320.
  doi: null
scope:
  territory: Agricultural soils from 32 states of the USA
  dataset: 1,323 soils with about 5,350 horizons; regression equations used 2,541
    horizons.
functions:
- name: calc_ptf_rawls1982_theta_1500
  status: implemented
  public_api:
    name: calc_theta_1500_rawls1982
    result_class: null
    summary: Estimate volumetric water content at -1500 kPa.
  scope:
    prediction_target: Volumetric soil water content at -1500 kPa.
    models:
      h_theta: Point estimate at -1500 kPa
      k_h: null
  inputs:
  - name: clay
    symbol: Clay
    unit: '%'
    domain: 0.1 <= value <= 94
    description: Clay content.
  - name: organic_matter
    symbol: OM
    unit: '%'
    domain: 0.1 <= value <= 12.5
    description: Organic matter content.
  outputs:
    type: scalar
    name: theta_1500
    symbol: theta_1500
    unit: cm^3/cm^3
    domain: value >= 0
    description: Volumetric soil water content at -1500 kPa.
  verification_cases:
  - id: loamy_sand
    kind: calculated
    inputs:
      clay: 5.12
      organic_matter: 0.1
    expected:
      theta_1500: 0.05318
    rationale: Calculated directly from the -15 bar first-level regression in Table 3.
  edge_cases: []
  documentation:
    notes: []
    warnings: []
  implementation:
    variables:
    - name: theta_1500
      expr: 0.0260 + 0.0050 * clay + 0.0158 * organic_matter
- name: calc_ptf_rawls1982_theta_33
  status: implemented
  public_api:
    name: calc_theta_33_rawls1982
    result_class: null
    summary: Estimate volumetric water content at -33 kPa using measured or estimated
      theta_1500.
  scope:
    prediction_target: Volumetric soil water content at -33 kPa.
    models:
      h_theta: Point estimate at -33 kPa
      k_h: null
  inputs:
  - name: sand
    symbol: Sand
    unit: '%'
    domain: 0.1 <= value <= 99
    description: Sand content.
  - name: organic_matter
    symbol: OM
    unit: '%'
    domain: 0.1 <= value <= 12.5
    description: Organic matter content.
  - name: theta_1500
    symbol: theta_1500
    unit: cm^3/cm^3
    domain: value >= 0
    description: Measured or estimated volumetric water content at -1500 kPa.
  outputs:
    type: scalar
    name: theta_33
    symbol: theta_33
    unit: cm^3/cm^3
    domain: value >= 0
    description: Volumetric soil water content at -33 kPa.
  verification_cases:
  - id: loamy_sand_with_estimated_theta_1500
    kind: calculated
    inputs:
      sand: 85.0
      organic_matter: 0.1
      theta_1500: 0.05318
    expected:
      theta_33: 0.1179896
    rationale: Calculated directly from the -0.33 bar second-level regression in Table
      3.
  edge_cases: []
  documentation:
    notes: []
    warnings: []
  implementation:
    variables:
    - name: theta_33
      expr: 0.2391 - 0.0019 * sand + 0.0210 * organic_matter + 0.72 * theta_1500
- name: calc_ptf_rawls1982_full_wrc
  status: implemented
  public_api:
    name: calc_full_wrc_rawls1982
    result_class: Rawls1982PTFResult
    summary: Estimate a twelve-point water-retention curve using theta_33 and theta_1500.
  scope:
    prediction_target: Volumetric water contents from -4 to -1500 kPa.
    models:
      h_theta: Twelve point water-retention curve
      k_h: null
  inputs:
  - name: sand
    symbol: Sand
    unit: '%'
    domain: 0.1 <= value <= 99
    description: Sand content.
  - name: organic_matter
    symbol: OM
    unit: '%'
    domain: 0.1 <= value <= 12.5
    description: Organic matter content.
  - name: bulk_density
    symbol: BD
    unit: g/cm^3
    domain: 0.1 <= value <= 2.09
    description: Bulk density.
  - name: theta_33
    symbol: theta_33
    unit: cm^3/cm^3
    domain: value >= 0
    description: Measured or estimated volumetric water content at -33 kPa.
  - name: theta_1500
    symbol: theta_1500
    unit: cm^3/cm^3
    domain: value >= 0
    description: Measured or estimated volumetric water content at -1500 kPa.
  outputs:
    type: record
    name: Rawls1982PTFResult
    fields:
    - name: theta_4
      symbol: theta_4
      unit: cm^3/cm^3
      domain: null
      description: Volumetric water content at -4 kPa.
    - name: theta_7
      symbol: theta_7
      unit: cm^3/cm^3
      domain: null
      description: Volumetric water content at -7 kPa.
    - name: theta_10
      symbol: theta_10
      unit: cm^3/cm^3
      domain: null
      description: Volumetric water content at -10 kPa.
    - name: theta_20
      symbol: theta_20
      unit: cm^3/cm^3
      domain: null
      description: Volumetric water content at -20 kPa.
    - name: theta_33
      symbol: theta_33
      unit: cm^3/cm^3
      domain: null
      description: Input volumetric water content at -33 kPa.
    - name: theta_60
      symbol: theta_60
      unit: cm^3/cm^3
      domain: null
      description: Volumetric water content at -60 kPa.
    - name: theta_100
      symbol: theta_100
      unit: cm^3/cm^3
      domain: null
      description: Volumetric water content at -100 kPa.
    - name: theta_200
      symbol: theta_200
      unit: cm^3/cm^3
      domain: null
      description: Volumetric water content at -200 kPa.
    - name: theta_400
      symbol: theta_400
      unit: cm^3/cm^3
      domain: null
      description: Volumetric water content at -400 kPa.
    - name: theta_700
      symbol: theta_700
      unit: cm^3/cm^3
      domain: null
      description: Volumetric water content at -700 kPa.
    - name: theta_1000
      symbol: theta_1000
      unit: cm^3/cm^3
      domain: null
      description: Volumetric water content at -1000 kPa.
    - name: theta_1500
      symbol: theta_1500
      unit: cm^3/cm^3
      domain: null
      description: Input volumetric water content at -1500 kPa.
  verification_cases:
  - id: loamy_sand
    kind: calculated
    inputs:
      sand: 85.0
      organic_matter: 0.66
      bulk_density: 1.22
      theta_33: 0.091
      theta_1500: 0.033
    expected:
      theta_4: 0.247242
      theta_7: 0.968738
      theta_10: 0.145588
      theta_20: 0.10483
      theta_33: 0.091
      theta_60: 0.075428
      theta_100: 0.063192
      theta_200: 0.052946
      theta_400: 0.045826
      theta_700: 0.041824
      theta_1000: 0.038932
      theta_1500: 0.033
    rationale: Calculated from the third-level regressions in Table 3 using the given
      endpoint water contents.
  edge_cases: []
  documentation:
    notes:
    - The source offers three regression levels; this function uses measured theta_33
      and theta_1500 for the intermediate points.
    warnings:
    - The source value 0.8888 is retained literally for the theta_7 intercept.
  implementation:
    variables:
    - name: theta_4
      expr: 0.1829 - 0.0246 * organic_matter - 0.0376 * bulk_density + 1.89 * theta_33 - 1.38 * theta_1500
    - name: theta_7
      expr: 0.8888 - 0.0003 * sand - 0.0107 * organic_matter + 1.53 * theta_33 - 0.81 * theta_1500
    - name: theta_10
      expr: 0.0619 - 0.0002 * sand - 0.0067 * organic_matter + 1.34 * theta_33 - 0.51 * theta_1500
    - name: theta_20
      expr: 0.0319 - 0.0002 * sand + 1.01 * theta_33 - 0.06 * theta_1500
    - name: theta_60
      expr: 0.0136 - 0.0091 * bulk_density + 0.66 * theta_33 + 0.39 * theta_1500
    - name: theta_100
      expr: -0.0034 + 0.0022 * organic_matter + 0.52 * theta_33 + 0.54 * theta_1500
    - name: theta_200
      expr: -0.0043 + 0.0026 * organic_matter + 0.36 * theta_33 + 0.69 * theta_1500
    - name: theta_400
      expr: -0.0038 + 0.0026 * organic_matter + 0.24 * theta_33 + 0.79 * theta_1500
    - name: theta_700
      expr: -0.0027 + 0.0024 * organic_matter + 0.16 * theta_33 + 0.86 * theta_1500
    - name: theta_1000
      expr: -0.0019 + 0.0022 * organic_matter + 0.11 * theta_33 + 0.89 * theta_1500
scientific_notes: |
  # Rawls et al. (1982)

  ## Review decisions

  Table 3 coefficients are implemented literally, including the `0.8888`
  intercept for `theta_7`. The physically unusual value is retained rather than
  corrected or inferred. The API preserves the table's staged regression
  structure, with the -15 and -0.33 bar predictions feeding the full
  water-retention result.
