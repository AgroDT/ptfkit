source:
  summary: Saturated hydraulic conductivity PTFs for the Loess Plateau of China.
  citation_apa: >-
    Zhao, C., Shao, M., Jia, X., Nasir, M., & Zhang, C. (2016).
    Using pedotransfer functions to estimate soil hydraulic conductivity in
    the Loess Plateau of China. CATENA, 143, 1-6.
    https://doi.org/10.1016/j.catena.2016.03.037
  doi:
    identifier: 10.1016/j.catena.2016.03.037
    url: https://doi.org/10.1016/j.catena.2016.03.037
scope:
  territory: Typical Loess Plateau of China, covering approximately 430,000 square kilometers.
  dataset: >-
    729 samples from 243 sites, sampled in 2012 at depths of 0-10, 10-20,
    and 20-40 cm. Each of 400 random calibration-validation splits used
    583 development records and 146 validation records (Section 2.3.1).
$defs:
  bulk_density:
    name: bulk_density
    symbol: BD
    unit: g/cm^3
    domain: 'Observed range in Table 1: 0.97 to 1.79 g/cm^3.'
    description: >-
      Soil bulk density measured on undisturbed cores.
  silt:
    name: silt
    symbol: Silt
    unit: '%'
    domain: 'Observed range in Table 1: 2.04 to 76.01 percent.'
    description: >-
      Silt content measured by laser diffraction using USDA taxonomy
      (Section 2.2.2).
  clay:
    name: clay
    symbol: Clay
    unit: '%'
    domain: 'Observed range in Table 1: 0.010 to 32.67 percent.'
    description: >-
      Clay content measured by laser diffraction using USDA taxonomy
      (Section 2.2.2).
  conductivity:
    type: scalar
    name: ks
    quantity: saturated_hydraulic_conductivity
    symbol: Ks
    unit: millimeter_per_minute
    reported_unit: mm/min
    domain: 'Observed range in Table 1: 0.01 to 0.99 mm/min; not an output clamp.'
    description: >-
      Saturated hydraulic conductivity, measured by the constant-head method.
functions:
  - name: calc_ptf_zhao2016_m2_1
    status: implemented
    public_api:
      name: calc_ptf_zhao2016_m2_1
      result_class: null
      summary: Estimate saturated hydraulic conductivity using reconstructed M2-1.
    scope:
      prediction_target: Saturated hydraulic conductivity
      models:
        h_theta: null
        k_h: null
    inputs:
      - $ref: '#/$defs/bulk_density'
      - $ref: '#/$defs/silt'
      - $ref: '#/$defs/clay'
    outputs:
      $ref: '#/$defs/conductivity'
    verification_cases:
      - id: published_predictor_means
        kind: calculated
        inputs:
          bulk_density: 1.32
          silt: 63.33
          clay: 17.41
        expected:
          ks: 0.3780
        rationale: >-
          Uses Table 1 predictor means, within the observed marginal ranges.
          Silt and clay leave 19.26 percent sand. All standardized predictors
          equal 0.5. Expected conductivity was calculated with decimal arithmetic
          from Table 4 and the reviewed scaling reconstruction.
      - id: interior_soil
        kind: calculated
        inputs:
          bulk_density: 1.2
          silt: 60
          clay: 20
        expected:
          ks: 0.5615765333953871
        rationale: >-
          Interior soil with 60 percent silt, 20 percent clay and a residual
          20 percent sand, at bulk density 1.2 g/cm^3. All inputs are within
          Table 1 ranges and differ from the scaling means. Expected output
          was fixed from decimal reference calculations of Jia Equation 3,
          Table 4 and the reviewed inverse response transformation.
    edge_cases: []
    documentation:
      notes:
        - 'Highest-ranked fitted PTF, ranked by descending R-squared (Section 3.3).'
        - >-
          Uses Table 1 means and standard deviations for Jia et al. (2012)
          Equation 3 on both predictors and response, as a reviewed reconstruction.
      warnings:
        - >-
          The publication does not explicitly confirm Table 1 statistics as
          the fitted scaling constants or the application of response scaling.
          This reconstruction has not been verified against author software.
        - Observed ranges describe the sampled soils; predictions are not clamped.
    implementation:
      variables:
        - name: bd_scaled
          expr: '(bulk_density - (1.32 - 2 * 0.14)) / (4 * 0.14)'
        - name: silt_scaled
          expr: '(silt - (63.33 - 2 * 9.85)) / (4 * 9.85)'
        - name: clay_scaled
          expr: '(clay - (17.41 - 2 * 4.69)) / (4 * 4.69)'
        - name: response_scaled
          expr: '0.873 - 0.555 * bd_scaled - 0.399 * silt_scaled + 0.224 * clay_scaled'
        - name: ks
          expr: '4 * 0.25 * response_scaled + 0.37 - 2 * 0.25'
