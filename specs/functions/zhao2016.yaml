scientific_notes: |
  ## Supported models

  Section 3.3 and Table 4 publish six coefficient sets for M2, predicting
  saturated hydraulic conductivity from bulk density, silt and clay. M2 was
  selected for stability, ease of measuring its predictors and accuracy
  comparable to M1. The six functions retain the published row order:
  highest-ranked fit, averages of the top 25%, 50%, 75% and 100% of 400 fits,
  and lowest-ranked fit, ranked by descending R-squared.

  ## Accepted review interpretation

  On 2026-09-07 the user requested generation in response to the concrete
  reconstruction proposal. This was treated as acceptance of using Zhao
  Table 1 statistics with Jia Equation 3 for both predictors and response.
  This is an explicitly reviewed reconstruction, not a newly discovered
  author-confirmed preprocessing contract.

  Zhao Section 2.3.1 cites Jia, X., Shao, M., & Wei, X. (2012).
  State-space prediction of soil respiration time series in temperate,
  semi-arid grassland in northern China. Soil Research, 50(4), 293-303.
  https://doi.org/10.1071/SR12068
  The user-supplied sr12068.pdf, page 295 (PDF page 3), Theory, Equation 3,
  defines z = [Z - (mu - 2*sigma)] / (4*sigma). Here mu and sigma are the
  measured variable's mean and standard deviation. Algebraically,
  Z = 4*sigma*z + mu - 2*sigma. This derivation justifies the inverse used
  under the accepted interpretation; it does not establish author-code parity.

  Table 1 supplies means and SDs of BD (1.32, 0.14), Silt (63.33, 9.85),
  Clay (17.41, 4.69), and Ks (0.37, 0.25), in the documented physical units.
  These published values define this implementation at their stated precision.
  Section 2.3.1 discusses standardization before random calibration-validation
  splitting, supporting the accepted whole-dataset interpretation. It does
  not explicitly identify those statistics as the fitted scaling constants
  or unambiguously specify whether the response was standardized.

  A consistency check supports, but does not prove, response scaling:
  at the predictor means all scaled predictors are 0.5, and M2-5 (the average
  over all 400 fits) gives a fitted response of 0.5005. Inverse scaling gives
  0.3705 mm/min, close to Table 1's mean Ks of 0.37 mm/min. Without inverse
  scaling the same fitted response would be 0.5005 mm/min. This comparison
  is a diagnostic inference; differing training subsets are unavailable.

  ## Verification decision

  No complete published input-output pair is present in the supplied source.
  Each model has calculated cases at published predictor means and at an
  interior soil with nonzero deviations from those means. Fixed expected
  outputs were evaluated using Python decimal arithmetic directly from
  the reviewed transformation and published coefficients, without codegen.
  These cases check the computational reconstruction, not predictive accuracy
  or agreement with unpublished author artifacts. Model RMSE is not an
  implementation tolerance. Source-bundle instructions requiring published
  golden cases are superseded by the current verification policy.

  ## Documented limitations and excluded models

  Published marginal ranges describe the dataset, not joint extreme soils
  or guarantees outside the sampled region. The regressions are not clamped.
  M1 and M3-M6 in Table 3 lack fitted coefficients. ANN models A1-A6 lack
  trained weights, biases and a complete preprocessing contract. These
  alternative models are excluded and do not block the reviewed M2 functions.

  ## Evidence provenance

  Zhao's supplied local Markdown contains the article text, Tables 1 and 4,
  and prior research notes. Automated image descriptions are not numerical
  evidence. The publisher confirms CATENA volume 143, pages 1-6:
  https://www.sciencedirect.com/science/article/pii/S0341816216301242
  Title, DOI, institutional-repository and coefficient searches on 2026-09-07
  did not locate an accessible author preprocessing or trained-model artifact.
  The subsequent local Jia PDF resolved the referenced normalization equation.
  It concerns a separate respiration dataset; its own statistics are not used.
