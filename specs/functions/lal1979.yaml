scientific_notes: |
  ## Supported models

  Tables IV-VII provide separate univariate regressions for saturation, moisture
  retention at 0.1, 0.3 and 15 bar suction, and moisture equivalent. Table VIII
  relates moisture constants. Table IX provides plasticity regressions; entries
  reported only as n.s. have no coefficients and are not computational models.
  Groups are represented by separate functions with explicit applicability,
  not by a new categorical predictor. No continuous retention curve is fitted.

  ## Review decisions

  The supplied bundle includes the article and older research instructions requiring
  an external numerical oracle. The active extraction policy permits calculated
  verification cases. No complete published input-to-predicted-output cases occur
  in the supplied article; Tables II-III are marginal summaries, not such cases.
  Python decimal arithmetic evaluates m*x+b directly to fix the calculated values.
  Group I surface texture means (66, 15, 19) and Group II B2t means (57, 5, 38)
  sum to 100%; inconsistent texture means in the other rows are not combined.
  These summary predictors are not individual measured soil records.

  Table III reports moisture retention in g g⁻¹, mapped without conversion to
  gravimetric_water_content/mass_fraction. The user approved this notation alias.
  Plastic limits are gravimetric moisture percentages (Methods and Table II);
  plasticity index is their difference and uses the same quantity in mass_percent.
  The DOI is supplied in the bundle; the citation year and pagination come from
  the article abstract. Measurement definitions for shrinkage and bulk density,
  correlation statistics, and qualitative profile trends are not predictive PTFs.

  ## Documented limitations

  The dataset contains 119 genetic-horizon samples from 23 profiles. Samples were
  air-dried, ground and sieved at 2 mm. Retention used disturbed samples, a hanging
  water column at low suctions and pressure plates at higher suctions. Clay
  mineralogy is predominantly kaolinite and sesquioxides. The paper restricts
  extrapolation to similar soils and notes structural limitations of disturbed
  samples. Full predictor calibration ranges are not tabulated; Table II ranges
  cover surface and B2t horizons only and are not imposed as full-domain bounds.
  Sand uses the published 0.02 mm lower boundary, not the USDA 0.05 mm boundary.
  No output accuracy override, clipping, or unsupported boundary behavior is added.
  Independent regressions need not preserve ordering when combined into a curve.
  Table IX Group I organic-carbon upper-limit r is printed positive despite a
  negative slope; this statistical discrepancy does not change its coefficients.
  The supplied image descriptions are not numerical evidence.

  ## Blockers

  Seven Table VIII rows are blocked: all four Group I rows and the three Group II
  rows using saturation as predictor. Their printed coefficients with the column
  labels imply wetter soil at greater suction, contrary to Table III. For example,
  Group I saturation 0.31 would predict 0.51 at 0.1 bar instead of the reported
  surface mean 0.19. This flags an ambiguity, not a requirement to fit the means.
  The last two Group II rows have coherent directions and negative intercepts and
  are retained as printed. Confirm the seven affected regression directions and
  intercept signs before implementation; coefficients are preserved in their notes.

  Table IX Group I sand-to-upper-plastic-limit is blocked because its printed
  negative slope and negative intercept imply negative moisture percentages.
  Authoritative evidence for the intercept sign is required. No silent typographic
  repair is made. All other complete regressions remain drafts for human review.
