source:
  summary: "Moisture retention and plasticity regressions for two groups of Nigerian soils."
  citation_apa: "Lal, R. (1979). Physical properties and moisture retention characteristics of some Nigerian soils. Geoderma, 21, 209-223."
  doi: {"identifier": "10.1016/0016-7061(78)90028-9", "url": "https://doi.org/10.1016/0016-7061(78)90028-9"}
scope:
  territory: Nigeria
  dataset: 119 genetic-horizon samples from 23 profiles in two parent-material groups.
$defs:
  clay: {"name": "clay", "symbol": null, "unit": "%", "domain": null, "description": "Clay smaller than 0.002 mm; percentage of the fine earth. Full calibration bounds are not reported."}
  sand: {"name": "sand", "symbol": null, "unit": "%", "domain": null, "description": "Sand from 0.02 to 2 mm; percentage of the fine earth. Full calibration bounds are not reported."}
  silt: {"name": "silt", "symbol": null, "unit": "%", "domain": null, "description": "Silt from 0.002 to 0.02 mm; percentage of the fine earth. Full calibration bounds are not reported."}
  organic_carbon: {"name": "organic_carbon", "symbol": null, "unit": "%", "domain": null, "description": "Organic carbon measured by Walkley and Black wet combustion; percentage of the fine earth. Full calibration bounds are not reported."}
  water_0bar: {"name": "water_0bar", "symbol": null, "unit": "g/g", "domain": null, "description": "Gravimetric moisture retention at 0 bar suction on disturbed soil."}
  water_01bar: {"name": "water_01bar", "symbol": null, "unit": "g/g", "domain": null, "description": "Gravimetric moisture retention at 0.1 bar suction on disturbed soil."}
functions:
  - name: calc_ptf_lal1979_group_i_water_0bar_from_clay
    status: "ready-for-implementation"
    public_api: {"name": "calc_ptf_lal1979_group_i_water_0bar_from_clay", "result_class": null, "summary": "Estimate gravimetric moisture retention at saturation for Group I."}
    scope: {"territory": "Group I: 11 well-drained upland profiles in western Nigeria developed over pre-Cambrian basement complex rocks, mainly biotite-muscovite paragneisses.", "prediction_target": "Gravimetric moisture retention at saturation", "models": {"h_theta": null, "k_h": null}}
    inputs: [{"$ref": "#/$defs/clay"}]
    outputs: {"type": "scalar", "name": "water_0bar", "quantity": "gravimetric_water_content", "symbol": null, "unit": "mass_fraction", "reported_unit": "g g⁻¹", "domain": null, "description": "Gravimetric moisture retention at saturation expressed per unit dry soil mass."}
    verification_cases:
      - {"id": "published_predictor_mean", "kind": "calculated", "inputs": {"clay": 19}, "expected": {"water_0bar": 0.365}, "rationale": "Table II surface horizon mean for Group I; the accompanying sand, silt and clay means sum to 100%. Only the stated predictor is used. Expected value calculated with Python decimal arithmetic from the printed slope and intercept; not an observed prediction or evidence of model accuracy."}
    edge_cases: []
    documentation: {"notes": ["Table IV, Group I, clay predictor, water_0bar response."], "warnings": []}
    implementation:
      variables:
        - name: water_0bar
          expr: "0.004 * clay + (0.289)"
