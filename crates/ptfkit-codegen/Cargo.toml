[package]
name = "ptfkit-codegen"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
jsonschema = "0.49"
pest = "2.8.8"
pest_derive = "2.8.8"
proc-macro2 = "1.0"
quote = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
syn = { version = "3.0", features = ["full", "parsing"] }
