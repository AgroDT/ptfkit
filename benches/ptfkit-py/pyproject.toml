[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[project]
name = "ptfkit-py-benchmarks"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "ptfkit",
]

[project.scripts]
ptfkit-py-benchmarks = "ptfkit_py_benchmarks:main"

[tool.uv.sources]
ptfkit = { path = "../../targets/ptfkit-py" }
