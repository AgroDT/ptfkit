[build-system]
requires = ["scikit-build-core>=1.0", "numpy>=2.0,<3"]
build-backend = "scikit_build_core.build"

[project]
name = "ptfkit"
dynamic = ["version"]
description = "Collection of published pedotransfer functions for estimating soil hydraulic properties"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = [
    "pedotransfer functions",
    "soil hydraulic properties",
    "soil water retention",
    "hydraulic conductivity",
    "soil science",
    "hydrology",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Free Threading",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Topic :: Scientific/Engineering",
]
authors = [
    {name = "Dmitry Fomin", email = "fomin_ds@esoil.ru"},
    {name = "Petr Shumilin", email = "shumpet03@yandex.ru"},
    {name = "Kirill Tolstygin", email = "tolstygin_kd@esoil.ru"},
    {name = "Petr Tsymbarovich", email = "tpr@esoil.ru"},
]
maintainers = [
    {name = "Petr Tsymbarovich", email = "tpr@esoil.ru"},
    {name = "Kirill Tolstygin", email = "tolstygin_kd@esoil.ru"},
]

dependencies = [
    "numpy>=2.0,<3",
]

[project.urls]
Repository = "https://github.com/AgroDT/ptfkit"
Issues = "https://github.com/AgroDT/ptfkit/issues"
Documentation = "https://agrodt.github.io/ptfkit/"

[dependency-groups]
dev = [
    "pytest~=9.1",
    "pytest-cov~=7.0",
]

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.regex"
field = "version"
input = "src/ptfkit/_version.py"

[tool.pytest.ini_options]
addopts = "--cov=ptfkit"
testpaths = ["tests"]

[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.exclude = ["*.c", "*.h"]

[tool.scikit-build.sdist.force-include]
"../ptfkit-native/include" = "vendor/ptfkit-native/include"
