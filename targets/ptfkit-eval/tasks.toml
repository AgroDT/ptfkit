["eval:sync"]
description = "Synchronize the locked ptfkit-eval development environment"
dir = "targets/ptfkit-eval"
run = "uv sync --frozen --all-groups"

["eval:lock"]
description = "Verify that the ptfkit-eval lockfile is current"
dir = "targets/ptfkit-eval"
run = "uv lock --check"

["eval:test"]
description = "Run the ptfkit-eval test suite"
dir = "targets/ptfkit-eval"
run = "uv run --no-sync pytest"

["eval:pilot"]
description = "Run the source-reviewed meta_v3.3 descriptive pilot"
usage = '''
arg "<workbook>" help="Private meta_v3.3.xlsx path"
arg "<paper>" help="Reviewed Panina 2015 PDF path"
arg "<output>" help="New local output directory"
'''
run = 'uv run --project targets/ptfkit-eval --no-sync python evaluation/experiments/panina_clapp/pilot.py --workbook "{{ usage.workbook }}" --paper "{{ usage.paper }}" --output "{{ usage.output }}"'

["eval:benchmark"]
description = "Reproduce meta_v3.3 accounting and source-reviewed benchmark results"
usage = '''
arg "<workbook>" help="Private meta_v3.3.xlsx path"
arg "<paper>" help="Reviewed Panina 2015 PDF path"
arg "<output>" help="New local output directory"
'''
run = 'uv run --project targets/ptfkit-eval --no-sync python -m evaluation.experiments.meta_v3_3.benchmark --workbook "{{ usage.workbook }}" --paper "{{ usage.paper }}" --output "{{ usage.output }}"'

["eval:lint"]
description = "Run Ruff lint checks for ptfkit-eval"
dir = "targets/ptfkit-eval"
run = "ruff check"

["eval:atomic-campaign"]
description = "Review atomic PTF opportunities against exact measured targets"
usage = '''
arg "<benchmark>" help="Completed reviewed benchmark directory"
arg "<workbook>" help="Private meta_v3.3.xlsx path"
arg "<output>" help="New local output directory"
'''
run = 'uv run --project targets/ptfkit-eval --no-sync python -m evaluation.experiments.meta_v3_3.atomic_campaign --benchmark "{{ usage.benchmark }}" --workbook "{{ usage.workbook }}" --output "{{ usage.output }}"'

["eval:format"]
description = "Check ptfkit-eval formatting"
dir = "targets/ptfkit-eval"
run = "ruff format --check"

["eval:typecheck"]
description = "Run ty for ptfkit-eval"
dir = "targets/ptfkit-eval"
run = "ty check"

["eval:verify"]
description = "Run all ptfkit-eval quality checks"
depends = ["eval:lint", "eval:format", "eval:typecheck", "eval:test"]

["eval:clean"]
description = "Remove ptfkit-eval build artifacts and its development environment"
dir = "targets/ptfkit-eval"
run = "cmake -E rm -rf .venv build dist src/ptfkit_eval.egg-info"
