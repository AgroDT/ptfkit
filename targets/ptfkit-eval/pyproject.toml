[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ptfkit-eval"
version = "0.1.0"
description = "Reproducible external evaluation of ptfkit pedotransfer functions"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "ptfkit>=0.4,<0.5",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26,<5",
    "pytest>=9.0,<10",
]

[tool.uv.sources]
ptfkit = {path = "../ptfkit-py", editable = true}

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/ptfkit_eval"]

[tool.hatch.build.targets.wheel.force-include]
"schemas/evaluation-plan.schema.json" = "ptfkit_eval/schemas/evaluation-plan.schema.json"
