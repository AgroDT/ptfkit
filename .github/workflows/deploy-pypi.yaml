name: Deploy to PyPI

on:
  release:
    types:
      - published

jobs:
  check-version:
    name: Check release version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check target versions
        run: python .github/scripts/check-version.py "${{ github.event.release.tag_name }}"

  make-sdist:
    name: Make SDist
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Build SDist
        run: uv build --directory targets/ptfkit-py --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-sdist
          path: targets/ptfkit-py/dist/*.tar.gz

  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    needs: check-version
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        include:
          - os: linux-intel
            runs-on: ubuntu-latest
          - os: linux-arm
            runs-on: ubuntu-24.04-arm
          - os: windows-intel
            runs-on: windows-latest
          - os: macos-intel
            # macos-15-intel is the last x86_64 runner
            runs-on: macos-15-intel
          - os: macos-arm
            # macos-14+ (including latest) are ARM64 runners
            runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.0
        with:
          package-dir: targets/ptfkit-py/dist
          output-dir: targets/ptfkit-py/dist/wheelhouse
        env:
          CIBW_BUILD_FRONTEND: uv

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: targets/ptfkit-py/wheelhouse/*.whl

  publish:
    name: Publish to PyPI
    needs: [make-sdist, build-wheels]
    environment:
      name: pypi
      url: https://pypi.org/p/ptfkit
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: cibw-*
          path: targets/ptfkit-py/dist
          merge-multiple: true
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: targets/ptfkit-py/dist/
