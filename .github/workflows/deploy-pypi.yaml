name: Deploy to PyPI

on:
  release:
    types:
      - published

jobs:
  make-sdist:
    name: Make SDist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install build dependencies
        run: uv sync --project crates/ptfkit-py --frozen --group dev
      - name: Build SDist
        run: >
          uv run --project crates/ptfkit-py --directory crates/ptfkit-py
          --no-sync maturin sdist --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: crates/ptfkit-py/dist/*.tar.gz

  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        include:
          - os: linux-intel
            runs-on: ubuntu-latest
          - os: linux-arm
            runs-on: ubuntu-24.04-arm
          - os: windows-intel
            runs-on: windows-latest
          - os: macos-intel
            # macos-15-intel is the last x86_64 runner
            runs-on: macos-15-intel
          - os: macos-arm
            # macos-14+ (including latest) are ARM64 runners
            runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build wheels
        uses: pypa/cibuildwheel@v3.3.1
        with:
          package-dir: crates/ptfkit-py
          output-dir: crates/ptfkit-py/wheelhouse
        env:
          CIBW_BUILD_FRONTEND: build
      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: crates/ptfkit-py/wheelhouse/*.whl

  publish:
    name: Publish to PyPI
    needs: [make-sdist, build-wheels]
    environment:
      name: pypi
      url: https://pypi.org/p/ptfkit
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: cibw-*
          path: crates/ptfkit-py/dist
          merge-multiple: true
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
