name: PR Checks

on:
  pull_request:
    branches:
      - main

jobs:
  pytest:
    name: Tests Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.14t']
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --project crates/ptfkit-py --frozen

      - name: Install Python bindings
        run: >
          uv run --project "${{ github.workspace }}/crates/ptfkit-py"
          --directory "${{ github.workspace }}/crates/ptfkit-py"
          --no-sync maturin develop

      - name: Run pytest
        run: >
          uv run --project "${{ github.workspace }}/crates/ptfkit-py"
          --directory "${{ github.workspace }}/crates/ptfkit-py"
          --no-sync pytest --no-cov

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: crates/ptfkit-py/pyproject.toml

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Check uv.lock
        run: uv lock --project crates/ptfkit-py --check

      - name: Install the project
        run: uv sync --project crates/ptfkit-py --frozen --all-groups

      - name: Install Python bindings
        run: >
          uv run --project "${{ github.workspace }}/crates/ptfkit-py"
          --directory "${{ github.workspace }}/crates/ptfkit-py"
          --no-sync maturin develop

      - name: Ruff check
        id: ruff-check
        continue-on-error: true
        run: >
          uv run --project "${{ github.workspace }}/crates/ptfkit-py"
          --directory "${{ github.workspace }}/crates/ptfkit-py"
          --no-sync ruff check --output-format=github

      - name: Ruff format
        id: ruff-format
        continue-on-error: true
        run: >
          uv run --project "${{ github.workspace }}/crates/ptfkit-py"
          --directory "${{ github.workspace }}/crates/ptfkit-py"
          --no-sync ruff format --check --preview --output-format=github

      - name: Mypy
        id: mypy
        continue-on-error: true
        run: >
          uv run --project "${{ github.workspace }}/crates/ptfkit-py"
          --directory "${{ github.workspace }}/crates/ptfkit-py"
          --no-sync mypy |
          uv run --project "${{ github.workspace }}/crates/ptfkit-py"
          --directory "${{ github.workspace }}/crates/ptfkit-py"
          --no-sync mypy-gh-action-report

      - name: Fail if any step failed
        if: |
          steps.ruff-check.outcome == 'failure' ||
          steps.ruff-format.outcome == 'failure' ||
          steps.mypy.outcome == 'failure'
        run: exit 1

  summary:
    name: PR Checks Summary
    runs-on: ubuntu-latest
    if: always()
    needs: [pytest, code-quality]
    steps:
      - run: >
          test
          "${{ needs.pytest.result }}" = "success" -a
          "${{ needs.code-quality.result }}" = "success"
