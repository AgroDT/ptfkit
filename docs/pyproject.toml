[project]
name = "ptfkit-docs"
version = "0.1.0"
requires-python = ">=3.13"
classifiers = [
    "Private :: Do Not Upload"
]

dependencies = [
    "mkdocs>=1.6.1",
    "mkdocs-awesome-nav>=3.3.0",
    "mkdocs-material>=9.7.7",
    "mkdocs-minify-plugin>=0.8.0",
    "mkdocstrings>=1.0.6",
    "mkdocstrings-python>=2.0.7",
]

[tool.uv]
package = false

[tool.ruff]
extend = "../ruff.toml"
