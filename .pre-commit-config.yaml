repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix, lf]
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: generate
        name: regenerate targets
        language: system
        entry: cargo
        args: [run, --manifest-path, codegen/Cargo.toml, generate]
        files: '^(codegen/|specs/|targets/)'
        pass_filenames: false
      - id: rustfmt-codegen
        name: rustfmt codegen
        language: system
        entry: cargo
        args: [fmt, --manifest-path, codegen/Cargo.toml, --all]
        files: '^codegen/.*\.rs$'
        pass_filenames: false
      - id: rustfmt-target
        name: rustfmt ptfkit-rs
        language: system
        entry: cargo
        args: [fmt, --manifest-path, targets/ptfkit-rs/Cargo.toml, --all]
        files: '^targets/ptfkit-rs/.*\.rs$'
        pass_filenames: false
      - id: clang-format
        name: clang-format
        language: system
        entry: clang-format
        args: [--style=file, -i]
        files: '\.(c|h|cc|cpp|cppm|cxx|hpp)$'
      - id: uv-lock-ptfkit-py
        name: uv lock ptfkit-py
        language: system
        entry: uv
        args: [--project, targets/ptfkit-py, lock, --check]
        files: '^targets/ptfkit-py/(uv\.lock|pyproject\.toml|uv\.toml)$'
        pass_filenames: false
      - id: uv-sync-ptfkit-py
        name: uv sync ptfkit-py
        language: system
        entry: uv
        args: [--project, targets/ptfkit-py, sync, --frozen]
        always_run: true
        pass_filenames: false
      - id: uv-lock-docs
        name: uv lock docs
        language: system
        entry: uv
        args: [--project, docs, lock, --check]
        files: '^docs/(uv\.lock|pyproject\.toml|uv\.toml)$'
        pass_filenames: false
      - id: uv-sync-docs
        name: uv sync docs
        language: system
        entry: uv
        args: [--project, docs, sync, --frozen]
        always_run: true
        pass_filenames: false
      - id: ruff-check
        name: ruff check
        language: system
        entry: ruff
        args: [check, --fix]
        types: [file, python]
      - id: ruff-format
        name: ruff format
        language: system
        entry: ruff
        args: [format]
        types: [file, python]
      - id: ty-check-python
        name: ty check ptfkit-py
        language: system
        entry: ty
        args: [check, --project, targets/ptfkit-py]
        files: '^targets/ptfkit-py/.*\.py$'
      - id: ty-check-docs
        name: ty check documentation
        language: system
        entry: uv
        args: [--project, docs, run, --no-sync, ty, check]
        files: '^docs/.*\.py$'
      - id: ty-check-github
        name: ty check GitHub scripts
        language: system
        entry: ty
        args: [check]
        files: '^\.github/scripts/.*\.py$'
