[package]
name = "ptfkit-codegen"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0"
astro-float = "0.9.6"
clap = { version = "4.6", features = ["derive"] }
convert_case = "0.11"
jsonschema = "0.50"
pest = "2.9"
pest_derive = "2.9"
proc-macro2 = "1.0"
quote = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

[dev-dependencies]
syn = { version = "3.0", features = ["full", "parsing"] }
