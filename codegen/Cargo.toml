[package]
name = "ptfkit-codegen"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
convert_case = "0.12"
jsonschema = "0.60"
pest = "2.9"
pest_derive = "2.9"
proc-macro2 = "1.0"
quote = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0.21"

[dev-dependencies]
snapbox = "1.2.2"
syn = { version = "3.0", features = ["full", "parsing"] }
