["codegen:lint"]
description = "Run Clippy for the code generator"
dir = "codegen"
run = "cargo clippy --all-targets -- -D warnings"

["codegen:format"]
description = "Check code generator Rust formatting"
dir = "codegen"
run = "cargo fmt --all --check"

["codegen:test"]
description = "Run code generator tests"
dir = "codegen"
run = "cargo test"

["codegen:test-update"]
description = "Update code generator snapshots for all or selected tests"
dir = "codegen"
env = { SNAPSHOTS = "overwrite" }
usage = 'arg "[tests]" var=#true help="Test name filters; omit to update all snapshots"'
run = "cargo test --{% for test in usage.tests %} {{ test | quote }}{% endfor %}"

["codegen:verify"]
description = "Run all code generator quality checks"
depends = ["codegen:format", "codegen:lint", "codegen:test"]

["codegen:clean"]
description = "Remove code generator Cargo build artifacts"
dir = "codegen"
run = "cargo clean"

["rosetta:import"]
description = "Import bundled parameters from a trusted upstream checkout"
usage = 'arg "<upstream>" help="Path to the upstream checkout"'
run = 'uv run --no-project --with numpy==2.4.3 --with pyyaml python codegen/scripts/import_rosetta3.py --upstream "{{ usage.upstream }}"'

["models:prepare"]
description = "Prepare exact typed model arrays for builds and distribution"
run = "cargo run --manifest-path codegen/Cargo.toml -- prepare-models"
