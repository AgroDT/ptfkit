["codegen:lint"]
description = "Run Clippy for the code generator"
dir = "codegen"
run = "cargo clippy --all-targets -- -D warnings"

["codegen:format"]
description = "Check code generator Rust formatting"
dir = "codegen"
run = "cargo fmt --all --check"

["codegen:test"]
description = "Run code generator tests"
dir = "codegen"
run = "cargo test"

["codegen:test-update"]
description = "Update code generator snapshots for all or selected tests"
dir = "codegen"
env = { SNAPSHOTS = "overwrite" }
usage = 'arg "[tests]" var=#true help="Test name filters; omit to update all snapshots"'
run = "cargo test --{% for test in usage.tests %} {{ test | quote }}{% endfor %}"

["codegen:verify"]
description = "Run all code generator quality checks"
depends = ["codegen:format", "codegen:lint", "codegen:test"]

["codegen:clean"]
description = "Remove code generator Cargo build artifacts"
dir = "codegen"
run = "cargo clean"

["euptf2:import"]
description = "Authenticate and import THS_PTF01 locally with offline R"
usage = 'arg "<upstream>" help="Path to the pinned euptf2 1.0.0 source"'
run = 'uv run --no-project python codegen/scripts/import_euptf2.py --upstream "{{ usage.upstream }}" --output .euptf2-local/ths.ptfq'

["euptf2:import-test"]
description = "Check importer rejection before R execution or output replacement"
run = 'uv run --no-project python codegen/scripts/test_import_euptf2.py'

["euptf2:fetch"]
description = "Download authenticated EU-PTF v2 sources and import all models locally"
usage = 'flag "--rscript <path>" default="Rscript" help="Base R executable used only during import"'
run = 'uv run --no-project python codegen/scripts/fetch_euptf2.py --rscript "{{ usage.rscript }}"'

["euptf2:fetch-test"]
description = "Check authenticated downloads, cache reuse and selective extraction"
run = 'uv run --no-project python codegen/scripts/test_fetch_euptf2.py'

["euptf2:rust-build"]
description = "Build the public Rust THS_PTF01 reference runner"
run = 'cargo build --manifest-path targets/ptfkit-rs/Cargo.toml --example euptf2_runner'

["euptf2:import-collection"]
description = "Authenticate and convert the original EU-PTF v2 model collection offline"
usage = '''
arg "<upstream>" help="Path to the pinned euptf2 1.0.0 source"
arg "<archive>" help="Path to the pinned euptfv2 v.2.0.0 scientific archive"
'''
run = 'uv run --no-project python codegen/scripts/import_euptf2.py --collection --upstream "{{ usage.upstream }}" --archive "{{ usage.archive }}" --output .euptf2-local/models'

["euptf2:verify-collection"]
description = "Compare every implemented EU-PTF v2 object through all four public targets"
depends = ["native:build", "python:test", "euptf2:rust-build", "euptf2:import-test"]
usage = 'arg "<models>" help="Directory of locally imported PTFKQF02 artifacts"'
run = 'uv run --project targets/ptfkit-py --frozen python codegen/scripts/verify_euptf2_collection.py --models "{{ usage.models }}" --rust targets/ptfkit-rs/target/debug/examples/euptf2_runner'
run_windows = 'uv run --project targets/ptfkit-py --frozen python codegen/scripts/verify_euptf2_collection.py --models "{{ usage.models }}" --rust targets/ptfkit-rs/target/debug/examples/euptf2_runner.exe'

["euptf2:verify-public"]
description = "Compare all four public THS_PTF01 APIs with upstream R references"
depends = ["native:build", "python:test", "euptf2:rust-build", "euptf2:import-test"]
usage = 'arg "<model>" help="Path to the locally imported PTFKQF01 container"'
run = 'uv run --project targets/ptfkit-py --frozen python codegen/scripts/verify_euptf2.py --model "{{ usage.model }}" --build targets/ptfkit-native/build/tests --rust targets/ptfkit-rs/target/debug/examples/euptf2_runner'
run_windows = 'uv run --project targets/ptfkit-py --frozen python codegen/scripts/verify_euptf2.py --model "{{ usage.model }}" --build targets/ptfkit-native/build/tests --rust targets/ptfkit-rs/target/debug/examples/euptf2_runner.exe'

["rosetta:import"]
description = "Verify and import pinned Rosetta artifacts for local use only"
usage = 'arg "<upstream>" help="Path to the pinned official checkout"'
run = 'uv run --no-project --with numpy==2.4.3 python codegen/scripts/import_rosetta3.py --upstream "{{ usage.upstream }}"'

["rosetta:generate-local"]
description = "Generate opt-in local Rosetta targets without changing release packages"
run = 'cargo run --manifest-path codegen/Cargo.toml -- generate-rosetta-local --model .rosetta-local/imported/models.json --output .rosetta-local/native'

["rosetta:verify-rust"]
description = "Compare native Rust inference with frozen upstream Rosetta references"
run = 'cargo run --manifest-path codegen/Cargo.toml -- verify-rosetta --model .rosetta-local/imported/models.json --reference specs/models/rosetta3/reference.json'

["rosetta:verify-targets"]
description = "Compare built local C, C++, Rust and CPython targets with upstream"
usage = '''
arg "<build>" help="Local CMake binary directory"
arg "<rust>" help="Generated Rust runner executable"
'''
run = 'uv run --no-project python codegen/scripts/verify_rosetta3_targets.py --build "{{ usage.build }}" --rust "{{ usage.rust }}"'

["rosetta:pack"]
description = "Pack the verified external Rosetta container without bundling weights"
run = 'cargo run --manifest-path codegen/Cargo.toml -- pack-neural-model --model .rosetta-local/imported/models.json --output .rosetta-local/rosetta3.ptfm'

["rosetta:public-rust-build"]
description = "Build the real Rust crate public API reference runner"
dir = "targets/ptfkit-rs"
run = 'cargo build --example rosetta_runner'

["rosetta:verify-bundled"]
description = "Verify bundled models in all four public APIs without external model files"
depends = ["native:build", "python:test", "rosetta:public-rust-build"]
run = 'uv run --project targets/ptfkit-py --frozen python codegen/scripts/verify_rosetta3_public.py --builtin --build targets/ptfkit-native/build/tests --rust targets/ptfkit-rs/target/debug/examples/rosetta_runner'
run_windows = 'uv run --project targets/ptfkit-py --frozen python codegen/scripts/verify_rosetta3_public.py --builtin --build targets/ptfkit-native/build/tests --rust targets/ptfkit-rs/target/debug/examples/rosetta_runner.exe'

["rosetta:verify-public"]
description = "Verify all four public APIs against unchanged upstream Rosetta references"
depends = ["native:build", "python:test", "rosetta:public-rust-build"]
run = 'uv run --project targets/ptfkit-py --frozen python codegen/scripts/verify_rosetta3_public.py --model .rosetta-local/rosetta3.ptfm --build targets/ptfkit-native/build/tests --rust targets/ptfkit-rs/target/debug/examples/rosetta_runner'
run_windows = 'uv run --project targets/ptfkit-py --frozen python codegen/scripts/verify_rosetta3_public.py --model .rosetta-local/rosetta3.ptfm --build targets/ptfkit-native/build/tests --rust targets/ptfkit-rs/target/debug/examples/rosetta_runner.exe'
